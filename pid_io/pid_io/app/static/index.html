<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>계장 개념설계 IO 산출</title>
<style>
:root{
  --green:#15ad60; --green-d:#1c5438; --green-l:#e7f6ee; --ink:#111111; --sub:#666666; --mute:#999999;
  --line:#dcdcdc; --line-l:#ececec; --bg:#ededed; --panel:#ffffff; --dark:#222222;
  --red:#d1335d; --purple:#7e66cb; --blue:#4fa1e0; --yellow:#ffba00; --chg:#fff5d6;
  --font:"Hyundai Harmony L","HyundaiHarmonyL","현대하모니 L","Hyundai Harmony","HyundaiHarmony","Malgun Gothic","Apple SD Gothic Neo","Noto Sans CJK KR",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}
button,input,select{font:inherit;color:inherit}
a{color:var(--green-d)}
/* top bar */
.top{height:58px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px;gap:14px;position:sticky;top:0;z-index:10}
.mark{width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;border-bottom:19px solid var(--green)}
.brand{font-size:18px;letter-spacing:-.01em}
.brand b{font-weight:700}
.brand span{color:var(--mute);font-size:12.5px;margin-left:10px;letter-spacing:.04em}
.top .proj{margin-left:auto;display:flex;align-items:center;gap:10px;color:var(--sub);font-size:13px}
.top .proj b{color:var(--ink);font-weight:700}
/* layout */
.wrap{display:flex;min-height:calc(100vh - 58px)}
nav{width:220px;background:#fff;border-right:1px solid var(--line);padding:22px 0;flex:none}
nav .st{display:flex;align-items:center;gap:12px;padding:12px 24px;color:var(--sub);cursor:pointer;border-left:3px solid transparent;font-size:15px}
nav .st i{font-style:normal;width:24px;height:24px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--mute);flex:none}
nav .st.on{color:var(--ink);font-weight:700;border-left-color:var(--green);background:var(--green-l)}
nav .st.on i{background:var(--green);color:#fff;border-color:var(--green)}
nav .st.done i{border-color:var(--green);color:var(--green)}
nav .st.dis{opacity:.45;pointer-events:none}
nav .foot{margin:26px 24px 0;padding-top:16px;border-top:1px solid var(--line-l);font-size:12px;color:var(--mute);line-height:1.7}
main{flex:1;padding:30px 34px 60px;min-width:0}
.head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px;gap:20px}
.eyebrow{font-size:12.5px;color:var(--green);font-weight:700;letter-spacing:.08em;margin-bottom:6px}
h1{font-size:32px;font-weight:300;letter-spacing:-.02em;line-height:1.2}
h2{font-size:17px;font-weight:700;margin-bottom:12px}
.lead{color:var(--sub);margin-top:6px}
.panel{background:#fff;border:1px solid var(--line);padding:20px 22px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g5{grid-template-columns:repeat(5,1fr)}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--green);color:#fff;border:1px solid var(--green);padding:10px 20px;cursor:pointer;font-weight:700;font-size:14px}
.btn{white-space:nowrap}
.kv>*:last-child{white-space:nowrap;margin-left:14px}
.btn:hover{background:var(--green-d);border-color:var(--green-d)}
.btn.line{background:#fff;color:var(--ink);border-color:#111}
.btn.line:hover{background:#111;color:#fff}
.btn.sm{padding:6px 12px;font-size:13px}
.btn[disabled]{opacity:.4;pointer-events:none}
.chip{display:inline-block;font-size:12px;padding:2px 9px;border:1px solid var(--line);color:var(--sub);white-space:nowrap}
.chip.g{border-color:var(--green);color:var(--green)} .chip.r{border-color:var(--red);color:var(--red)}
.chip.y{border-color:#e0a400;color:#b78600} .chip.p{border-color:var(--purple);color:var(--purple)} .chip.b{border-color:var(--blue);color:#2c7fc0}
.chip.fill{background:var(--green);border-color:var(--green);color:#fff}
.stat .k{font-size:12.5px;color:var(--sub)}
.stat .v{font-size:34px;font-weight:300;line-height:1.15;letter-spacing:-.02em}
.stat .v small{font-size:14px;color:var(--sub);margin-left:4px}
.uline{border-bottom:2px solid var(--green);display:inline-block;padding-bottom:2px}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line-l);font-size:13.5px;vertical-align:middle}
th{font-size:12px;color:var(--sub);font-weight:700;border-bottom:1px solid #111}
tr.click{cursor:pointer} tr.click:hover td{background:#f7faf8}
.mono{font-family:Consolas,"D2Coding",monospace;font-size:12.5px}
.empty{color:var(--mute);padding:40px;text-align:center;border:1px dashed var(--line);background:#fafafa}
input[type=text],input[type=number],select{border:1px solid #bbb;background:#fff;padding:7px 10px;border-radius:0;min-width:0}
input[type=number]{width:90px;text-align:right}
select{padding-right:26px}
/* file cards */
.fcard{background:#fff;border:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:8px;min-height:150px}
.fcard .t{font-weight:700;display:flex;justify-content:space-between;align-items:center}
.fcard .n{font-size:13px;color:var(--sub);word-break:break-all;flex:1}
.fcard.ok{border-top:3px solid var(--green)} .fcard.need{border-top:3px solid var(--red)} .fcard.opt{border-top:3px solid var(--line)}
.fcard label{align-self:flex-start}
.fcard input[type=file]{display:none}
.prog{height:6px;background:#e3e3e3;overflow:hidden}
.prog i{display:block;height:100%;background:var(--green);transition:width .3s}
/* checklist */
.tabs{display:flex;gap:0;border-bottom:1px solid #111;margin-bottom:0;flex-wrap:wrap}
.tabs a{padding:10px 14px;cursor:pointer;color:var(--sub);text-decoration:none;font-size:13.5px;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs a.on{color:var(--ink);font-weight:700;border-bottom-color:var(--green)}
.tabs a .cnt{font-size:11px;background:var(--yellow);color:#111;padding:0 5px;margin-left:4px}
.item{display:grid;grid-template-columns:48px 1fr 230px;gap:14px;align-items:center;padding:13px 6px;border-bottom:1px solid var(--line-l)}
.item.chg{background:var(--chg)}
.item.plan{opacity:.55}
.item .id{font-family:Consolas,monospace;color:var(--mute);font-size:12px}
.item .nm{font-size:14.5px}
.item .ef{font-size:12px;color:var(--sub);margin-top:2px}
.item .ctl{display:flex;justify-content:flex-end;align-items:center;gap:8px}
.item .def{font-size:11.5px;color:var(--mute)}
.tog{width:44px;height:22px;background:#c9c9c9;position:relative;cursor:pointer;flex:none;border:0}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;background:#fff;transition:left .15s}
.tog.on{background:var(--green)} .tog.on::after{left:25px}
.side{width:340px;flex:none;position:sticky;top:78px;align-self:flex-start;display:flex;flex-direction:column;gap:14px}
.bar{display:flex;height:16px;background:#eee}
.bar span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--sub);margin-top:8px}
.legend i{display:inline-block;width:9px;height:9px;margin-right:5px}
.kv{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--line-l);font-size:13px}
.kv:last-child{border:0}
.delta-n{color:var(--green-d);font-weight:700} .delta-p{color:var(--red);font-weight:700}
/* review */
.viewer{background:#fff;border:1px solid var(--line);position:relative;overflow:auto;height:calc(100vh - 230px)}
.viewer img{display:block;transform-origin:0 0}
.hl{position:absolute;border:3px solid var(--red);box-shadow:0 0 0 3000px rgba(0,0,0,.08);pointer-events:none}
.rlist{height:calc(100vh - 290px);overflow:auto;border:1px solid var(--line);background:#fff}
.ritem{padding:10px 12px;border-bottom:1px solid var(--line-l);cursor:pointer}
.ritem:hover{background:#f7faf8} .ritem.on{background:var(--green-l);border-left:3px solid var(--green)}
.ritem .a{display:flex;justify-content:space-between;gap:8px}
.ritem .b{font-size:12px;color:var(--sub);margin-top:3px}
.toast{position:fixed;right:24px;bottom:24px;background:#111;color:#fff;padding:12px 18px;font-size:13.5px;z-index:50;display:none;max-width:420px}
.toast.err{background:var(--red)}
.hidden{display:none!important}
.dot{display:inline-block;width:8px;height:8px;margin-right:6px}
</style>
</head>
<body>
<div class="top">
  <div class="mark"></div>
  <div class="brand"><b>계장 개념설계</b> IO 산출<span>INSTRUMENTATION · CONCEPT I/O</span></div>
  <div class="proj"><span>프로젝트</span><b id="pname">선택 안 됨</b><span id="phome" class="mono"></span></div>
</div>
<div class="wrap">
  <nav id="nav">
    <div class="st" data-s="projects"><i>1</i>프로젝트</div>
    <div class="st" data-s="extract"><i>2</i>입력 · 추출</div>
    <div class="st" data-s="concept"><i>3</i>개념 체크리스트</div>
    <div class="st" data-s="review"><i>4</i>검토</div>
    <div class="st" data-s="output"><i>5</i>출력</div>
    <div class="st" data-s="ai" style="margin-top:14px;border-top:1px solid var(--line-l)"><i>AI</i>AI 연결 설정</div>
    <div class="foot">도면 인식은 한 번,<br>체크리스트를 바꾸면 IO가<br>즉시 다시 계산됩니다.<br><br><span class="mono">IO 1점 = 인덱스 1행</span></div>
  </nav>
  <main id="main"></main>
</div>
<div class="toast" id="toast"></div>

<script>
const ORIGIN_COLOR = {"도면인식":"#4fa1e0","Typical파생":"#15ad60","트레인복제":"#ffba00","장비Typical":"#7e66cb","패키지":"#d1335d","스페어":"#a8a8a8"};
const S = {project:null, screen:"projects", state:null, concept:null, tab:0, summary:null, review:null, sel:null, reason:"", page:null, impact:null};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = n => (n ?? 0).toLocaleString("ko-KR");

async function api(path, opt={}) {
  const r = await fetch("/api/" + path, opt);
  const ct = r.headers.get("content-type") || "";
  const body = ct.includes("json") ? await r.json() : await r.blob();
  if (!r.ok) throw new Error(body.error || r.statusText);
  return body;
}
const post = (path, data) => api(path, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(data||{})});
const P = p => `p/${encodeURIComponent(S.project)}/${p}`;
function toast(msg, err) { const t=$("#toast"); t.textContent=msg; t.className="toast"+(err?" err":""); t.style.display="block"; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display="none", err?6000:2500); }

function go(screen) { S.screen = screen; render(); }
document.querySelectorAll("#nav .st").forEach(el => el.onclick = () => go(el.dataset.s));

function navState() {
  const ex = S.state && S.state.extracted;
  document.querySelectorAll("#nav .st").forEach(el => {
    const s = el.dataset.s;
    el.classList.toggle("on", s === S.screen);
    el.classList.toggle("dis", (!S.project && !["projects","ai"].includes(s)) || (!ex && ["concept","review","output"].includes(s)));
    el.classList.toggle("done", (s==="projects" && S.project) || (s==="extract" && ex));
  });
  $("#pname").textContent = S.project || "선택 안 됨";
}

async function loadState() { if (S.project) S.state = await api(P("")); navState(); }

async function render() {
  navState();
  const m = $("#main");
  try {
    if (S.screen === "projects") return renderProjects(m);
    if (S.screen === "ai") return renderAISettings(m);
    await loadState();
    if (S.screen === "extract") return renderExtract(m);
    if (S.screen === "concept") return renderConcept(m);
    if (S.screen === "review") return renderReview(m);
    if (S.screen === "output") return renderOutput(m);
  } catch (e) { toast(e.message, true); }
}

/* ---------------------------------------------------------------- 1 projects */
async function renderProjects(m) {
  const d = await api("projects");
  $("#phome").textContent = "";
  m.innerHTML = `
  <div class="head"><div><div class="eyebrow">STEP 1</div><h1>프로젝트</h1>
    <p class="lead">프로젝트마다 도면, 양식, 체크리스트, 결과가 폴더 하나에 저장됩니다. <span class="mono">${esc(d.home)}</span></p></div></div>
  <div class="grid" style="grid-template-columns:2fr 1fr">
    <div class="panel">
      <h2>프로젝트 목록</h2>
      ${d.projects.length ? `<table><tr><th>이름</th><th>생성</th><th>P&amp;ID</th><th>추출</th><th></th></tr>
      ${d.projects.map(p => `<tr class="click" data-n="${esc(p.name)}"><td><b>${esc(p.name)}</b></td><td>${esc(p.created||"")}</td>
        <td class="mono">${esc(p.files.pdf||"-")}</td><td>${p.extracted?`<span class="chip g">${esc(p.extracted)}</span>`:`<span class="chip">대기</span>`}</td>
        <td style="text-align:right"><span class="btn sm line">열기</span></td></tr>`).join("")}</table>`
      : `<div class="empty">아직 프로젝트가 없습니다. 오른쪽에서 새로 만드세요.</div>`}
    </div>
    <div class="panel">
      <h2>새 프로젝트</h2>
      <p class="lead" style="margin-bottom:14px">회사 표준 체크리스트(기본값)가 복사되어 시작합니다.</p>
      <input type="text" id="newname" placeholder="예: 서남해 200MW 수전해" style="width:100%;margin-bottom:12px">
      <button class="btn" id="mk">만들기</button>
    </div>
  </div>`;
  m.querySelectorAll("tr.click").forEach(tr => tr.onclick = () => { S.project = tr.dataset.n; S.summary=null; S.concept=null; S.review=null; S.impact=null; go("extract"); });
  $("#mk").onclick = async () => {
    const n = $("#newname").value.trim(); if (!n) return toast("이름을 입력하세요", true);
    try { await post("projects", {name:n}); S.project = n; go("extract"); } catch(e) { toast(e.message, true); }
  };
}

/* ---------------------------------------------------------------- 2 extract */
function fileCard(kind, title, desc, required) {
  const f = (S.state.meta.files||{})[kind];
  const cls = f ? "ok" : (required ? "need" : "opt");
  const info = kind==="pdf" && S.state.meta.pdf_info ? ` · ${S.state.meta.pdf_info.pages}p · ${S.state.meta.pdf_info.vector?"벡터":"스캔(미지원)"}` : "";
  return `<div class="fcard ${cls}">
    <div class="t">${title} ${f?`<span class="chip g">확인</span>`:(required?`<span class="chip r">필수</span>`:`<span class="chip">선택</span>`)}</div>
    <div class="n">${f?`<span class="mono">${esc(f)}</span>${info}`:desc}</div>
    <label class="btn sm line">${f?"바꾸기":"파일 선택"}<input type="file" data-k="${kind}" accept="${kind==="pdf"?".pdf":".xlsx"}"></label>
  </div>`;
}
let pollH = null;
async function renderExtract(m) {
  const st = S.state, j = st.job || {}, ex = st.extract;
  const running = j.state === "running";
  const pct = running && j.total ? Math.round(100*j.page/j.total) : (st.extracted ? 100 : 0);
  m.innerHTML = `
  <div class="head"><div><div class="eyebrow">STEP 2</div><h1>입력 · 추출</h1>
    <p class="lead">도면에서 사실(계기, 연결, 노트, 펌프·패키지, 벤더 경계)을 읽습니다. 한 번 실행하면 결과가 저장됩니다.</p></div>
    <div><button class="btn" id="run" ${running||!(st.meta.files||{}).pdf?"disabled":""}>${st.extracted?"다시 추출":"추출 실행"}</button></div></div>
  <div class="grid g4">
    ${fileCard("pdf","P&ID PDF","레전드 포함 벡터 PDF",true)}
    ${fileCard("template","인덱스 양식","회사 Instrument Index 템플릿 (.xlsx)",true)}
    ${fileCard("concept","개념 체크리스트","비우면 회사 표준 기본값 사용",false)}
    ${fileCard("ref","레퍼런스 인덱스","채점용 (없어도 결과 동일)",false)}
  </div>
  <div class="panel" style="margin-top:16px">
    <div style="display:flex;justify-content:space-between;margin-bottom:8px"><b>${running?esc(j.msg):(j.state==="error"?"오류":(st.extracted?"추출 완료":"대기"))}</b>
      <span class="mono" style="color:var(--sub)">${running?`${j.page}/${j.total} · 심볼 ${j.symbols}`:(j.elapsed?`${j.elapsed}초`:"")}</span></div>
    <div class="prog"><i style="width:${pct}%"></i></div>
    ${j.state==="error"?`<p style="color:var(--red);margin-top:10px">${esc(j.msg)}</p>`:""}
  </div>
  ${ex ? `
  <div class="grid g5" style="margin-top:16px">
    <div class="panel stat"><div class="k">인식 심볼</div><div class="v">${fmt(ex.symbols)}</div></div>
    <div class="panel stat"><div class="k">ESD 연결 계기</div><div class="v" style="color:var(--red)">${fmt(ex.esd_linked)}</div></div>
    <div class="panel stat"><div class="k">펌프 / 패키지</div><div class="v">${ex.pumps}<small>/ ${ex.packages}</small></div></div>
    <div class="panel stat"><div class="k">벤더 경계 안 심볼</div><div class="v" style="color:var(--purple)">${fmt(ex.vendor_symbols)}</div></div>
    <div class="panel stat"><div class="k">읽은 노트</div><div class="v">${fmt(ex.notes)}</div></div>
  </div>
  <div class="grid g2" style="margin-top:16px">
    <div class="panel"><h2>심볼 분류</h2>
      ${Object.entries(ex.by_class).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="kv"><span>${esc(k)}</span><b>${fmt(v)}</b></div>`).join("")}</div>
    <div class="panel"><h2>도면 해석</h2>
      <div class="kv"><span>PDF</span><span class="mono">${esc(ex.pdf)} · ${ex.pages}p</span></div>
      <div class="kv"><span>트레인 복제 노트가 있는 시트</span><b>${ex.train_sheets.join(", ")||"-"}</b></div>
      <div class="kv"><span>벤더 영역</span><span>${ex.vendor_areas.map(a=>`<span class="chip p">${esc(a)}</span>`).join(" ")||"-"}</span></div>
      <div style="margin-top:16px;text-align:right"><button class="btn" id="next">체크리스트로 →</button></div>
    </div>
  </div>` : ""}`;
  m.querySelectorAll("input[type=file]").forEach(inp => inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    toast("업로드 중…");
    try {
      await api(P("upload?kind="+inp.dataset.k), {method:"POST", headers:{"X-Filename":encodeURIComponent(f.name)}, body:f});
      S.concept = null; toast("업로드 완료"); render();
    } catch(e) { toast(e.message, true); }
  });
  const run = $("#run"); if (run) run.onclick = async () => { try { await post(P("extract")); S.summary=null; S.review=null; S.impact=null; render(); } catch(e) { toast(e.message, true); } };
  const nx = $("#next"); if (nx) nx.onclick = () => go("concept");
  clearTimeout(pollH);
  if (running) pollH = setTimeout(() => { if (S.screen==="extract") render(); }, 1500);
}

/* ---------------------------------------------------------------- 3 concept */
function control(it) {
  const v = it.value;
  if (it.type === "ON/OFF") return `<button class="tog ${String(v).toUpperCase()==="ON"?"on":""}" data-id="${it.id}" data-t="tog"></button>`;
  if (it.type === "선택") return `<select data-id="${it.id}">${it.choices.map(c=>`<option ${c===String(v)?"selected":""}>${esc(c)}</option>`).join("")}</select>`;
  const pct = typeof it.default === "number" && it.default < 1 && it.default > 0;
  return `<input type="number" step="${pct?0.05:1}" min="0" value="${esc(v)}" data-id="${it.id}">${pct?`<span class="def">${Math.round(v*100)}%</span>`:""}`;
}
function sidePanel() {
  const s = S.summary;
  if (!s || !s.ready) return `<div class="panel">계산 중…</div>`;
  const tot = Math.max(1, s.hw);
  const sys = Object.entries(s.per_system).map(([k,v]) => `${k} ${fmt(v.AI+v.AO+v.DI+v.DO+(v["TC/RTD"]||0))}`).join(" · ");
  const sc = s.scenarios || [];
  const mx = Math.max(1, ...sc.map(x=>x.hw), s.hw);
  const imp = S.impact;
  return `
  <div class="panel">
    <div class="k" style="font-size:12.5px;color:var(--sub)">하드와이어 IO (스페어 포함)</div>
    <div style="font-size:52px;font-weight:300;line-height:1.05;letter-spacing:-.03em"><span class="uline">${fmt(s.hw)}</span></div>
    <div style="font-size:12.5px;color:var(--sub);margin:8px 0 14px">${sys} · 통신 ${fmt(s.comm)} · 카드 ${fmt(s.cards_total)} · ${fmt(s.rows)}행</div>
    <div class="bar">${s.origins.map(o=>`<span title="${o} ${s.per_origin[o].hw}" style="width:${100*s.per_origin[o].hw/tot}%;background:${ORIGIN_COLOR[o]}"></span>`).join("")}</div>
    <div class="legend">${s.origins.map(o=>`<span><i style="background:${ORIGIN_COLOR[o]}"></i>${o} ${fmt(s.per_origin[o].hw)}</span>`).join("")}</div>
  </div>
  <div class="panel">
    <h2 style="font-size:14px">시나리오</h2>
    ${sc.map(x=>`<div style="display:flex;align-items:center;gap:8px;margin-bottom:7px;font-size:12.5px"><span style="width:76px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(x.name)}">${esc(x.name)}</span>
      <div style="flex:1;background:#eee;height:12px"><div style="width:${100*x.hw/mx}%;height:12px;background:var(--green-d)"></div></div><b style="width:42px;text-align:right">${fmt(x.hw)}</b></div>`).join("") || `<p class="lead" style="font-size:12.5px;margin:0 0 8px">저장된 시나리오가 없습니다.</p>`}
    <div style="display:flex;align-items:center;gap:8px;font-size:12.5px;margin-bottom:10px"><span style="width:76px;color:var(--green);font-weight:700">현재</span>
      <div style="flex:1;background:#eee;height:12px"><div style="width:${100*s.hw/mx}%;height:12px;background:var(--green)"></div></div><b style="width:42px;text-align:right">${fmt(s.hw)}</b></div>
    <div style="display:flex;gap:6px"><input type="text" id="scname" placeholder="시나리오 이름" style="flex:1"><button class="btn sm" id="scsave">저장</button></div>
  </div>
  <div class="panel">
    <div style="display:flex;justify-content:space-between;align-items:center"><h2 style="font-size:14px;margin:0">영향 큰 가정</h2><button class="btn sm line" id="impbtn">분석</button></div>
    <p class="lead" style="font-size:12px;margin:4px 0 8px">각 항목을 반대로 바꿨을 때 하드와이어 IO 변화</p>
    ${imp ? imp.items.map(x=>`<div class="kv"><span><span class="mono" style="color:var(--mute)">${x.id}</span> ${esc(x.name)}<br><span style="font-size:11.5px;color:var(--sub)">${esc(x.current)} → ${esc(x.alt)}</span></span>
      <span class="${x.delta<0?"delta-n":"delta-p"}">${x.delta>0?"+":""}${fmt(x.delta)}</span></div>`).join("") || `<p class="lead">변화 없음</p>` : `<p class="lead" style="font-size:12.5px">"분석"을 누르면 몇 초 걸립니다.</p>`}
  </div>`;
}
async function renderConcept(m) {
  if (!S.concept) S.concept = await api(P("concept"));
  if (!S.summary) S.summary = await api(P("summary"));
  const c = S.concept;
  const tabs = c.groups.map((g,i) => { const n = g.items.filter(x=>String(x.value)!==String(x.default)).length;
    return `<a class="${i===S.tab?"on":""}" data-i="${i}">${esc(g.title.replace(/\s*\(.*\)$/,""))}${n?`<span class="cnt">${n}</span>`:""}</a>`; });
  tabs.push(`<a class="${S.tab===-1?"on":""}" data-i="-1">패키지별 (${c.packages.length})</a>`);
  const g = c.groups[S.tab];
  const body = S.tab === -1 ? packagesTable(c) : g.items.map(it => `
    <div class="item ${String(it.value)!==String(it.default)?"chg":""} ${it.status==="planned"?"plan":""}">
      <div class="id">${it.id}</div>
      <div><div class="nm">${esc(it.name)}${it.status==="planned"?` <span class="chip" title="${esc(it.status_note)}">미적용</span>`:it.status==="info"?` <span class="chip b" title="${esc(it.status_note)}">기록용</span>`:""}</div>
        <div class="ef">${esc(it.effect)}${it.basis?` · <span style="color:var(--mute)">${esc(it.basis)}</span>`:""}${it.status_note?`<br><span style="color:#b07a00">${esc(it.status_note)}</span>`:""}</div></div>
      <div class="ctl">${String(it.value)!==String(it.default)?`<span class="def">기본 ${esc(typeof it.default==="number"&&it.default<1&&it.default>0?Math.round(it.default*100)+"%":it.default)}</span>`:""}${control(it)}</div>
    </div>`).join("");
  m.innerHTML = `
  <div class="head"><div><div class="eyebrow">STEP 3</div><h1>개념 체크리스트</h1>
    <p class="lead">설계 가정을 바꾸면 오른쪽 IO가 즉시 다시 계산됩니다. 바꾼 항목은 노란색으로 표시됩니다. (변경 ${c.changed}건)</p></div>
    <div style="display:flex;gap:8px"><button class="btn line" id="reset">기본값으로</button><button class="btn" id="tor">검토 →</button></div></div>
  <div style="display:flex;gap:20px;align-items:flex-start">
    <div style="flex:1;min-width:0" class="panel">
      <div class="tabs">${tabs.join("")}</div>
      <div>${body}</div>
    </div>
    <div class="side" id="side">${sidePanel()}</div>
  </div>`;
  m.querySelectorAll(".tabs a").forEach(a => a.onclick = () => { S.tab = +a.dataset.i; renderConcept(m); });
  m.querySelectorAll("[data-id]").forEach(el => {
    const fire = v => setVal(el.dataset.id, v);
    if (el.dataset.t === "tog") el.onclick = () => fire(el.classList.contains("on") ? "OFF" : "ON");
    else el.onchange = () => fire(el.value);
  });
  m.querySelectorAll("[data-pk]").forEach(el => el.onchange = () => setPkg(el.dataset.pk, el.dataset.f, el.value));
  bindSide();
  $("#reset").onclick = async () => { if (!confirm("모든 항목을 기본값으로 되돌릴까요?")) return; S.concept = await post(P("concept"), {reset:true}); await refreshSummary(); renderConcept(m); };
  $("#tor").onclick = () => go("review");
}
function packagesTable(c) {
  if (!c.packages.length) return `<div class="empty" style="margin-top:14px">도면에서 찾은 패키지가 없습니다.</div>`;
  const opts = ["전부 하드와이어","벤더PLC+통신","혼합"];
  return `<p class="lead" style="margin:14px 0">도면에서 찾은 패키지입니다. 지정하지 않으면 C01 기본값을 따릅니다.</p>
  <table><tr><th>패키지</th><th>시트</th><th>유닛</th><th>연결 방식</th><th>대수</th><th>Typical</th><th>출처</th></tr>
  ${c.packages.map(p=>`<tr><td class="mono" style="white-space:nowrap"><b>${esc(p.tag)}</b></td><td>${esc(p.dwg||"")}<br><span style="font-size:12px;color:var(--sub)">${esc(p.title||"")}</span></td><td class="mono">${esc(p.units||"-")}</td>
    <td><select data-pk="${esc(p.tag)}" data-f="conn">${opts.map(o=>`<option ${o===p.conn?"selected":""}>${o}</option>`).join("")}</select></td>
    <td><input type="number" min="1" value="${esc(p.qty||1)}" data-pk="${esc(p.tag)}" data-f="qty" style="width:64px"></td>
    <td class="mono">${esc(p.typical||"")}</td><td><span class="chip ${p.source==="C01"?"":"g"}">${esc(p.source)}</span></td></tr>`).join("")}</table>`;
}
function bindSide() {
  const sv = $("#scsave"); if (sv) sv.onclick = async () => { const n = $("#scname").value.trim(); if (!n) return toast("시나리오 이름을 입력하세요", true);
    await post(P("scenario"), {name:n}); S.summary = await api(P("summary")); $("#side").innerHTML = sidePanel(); bindSide(); toast("시나리오 저장"); };
  const ib = $("#impbtn"); if (ib) ib.onclick = async () => { ib.textContent = "계산 중…"; ib.disabled = true; S.impact = await api(P("impact")); $("#side").innerHTML = sidePanel(); bindSide(); };
}
async function refreshSummary() { S.summary = await api(P("summary")); S.review = null; S.impact = null; }
async function setVal(id, v) {
  try { S.concept = await post(P("concept"), {set:{[id]:v}}); await refreshSummary(); renderConcept($("#main")); }
  catch(e) { toast(e.message, true); }
}
async function setPkg(tag, f, v) {
  const p = S.concept.packages.find(x=>x.tag===tag);
  const body = {tag, dwg:p.dwg, title:p.title, conn:p.conn, qty:p.qty}; body[f] = v;
  try { S.concept = await post(P("concept"), {packages:[body]}); await refreshSummary(); renderConcept($("#main")); }
  catch(e) { toast(e.message, true); }
}

/* ---------------------------------------------------------------- 4 review */
async function renderReview(m) {
  if (!S.review || S.review._reason !== S.reason) { S.review = await api(P("review" + (S.reason?`?reason=${encodeURIComponent(S.reason)}`:""))); S.review._reason = S.reason; }
  const r = S.review;
  if (!S.page) S.page = (r.pages[0]||{}).page;
  const chips = Object.entries(r.counts).sort((a,b)=>b[1]-a[1]).map(([k,v]) =>
    `<span class="chip ${S.reason===k?"fill":""}" data-r="${esc(k)}" style="cursor:pointer;margin:0 6px 6px 0">${esc(k)} ${v}</span>`).join("");
  m.innerHTML = `
  <div class="head"><div><div class="eyebrow">STEP 4</div><h1>검토</h1>
    <p class="lead">확인이 필요한 행만 모았습니다. 항목을 누르면 도면에서 위치를 보여줍니다.</p></div>
    <div style="display:flex;gap:8px;align-items:center"><select id="pg">${r.pages.map(p=>`<option value="${p.page}" ${p.page==S.page?"selected":""}>p${p.page} · ${esc(p.dwg)} ${esc(p.title||"")}</option>`).join("")}</select>
      <button class="btn" id="too">출력 →</button></div></div>
  <div style="display:flex;gap:16px;align-items:flex-start">
    <div style="flex:1.6;min-width:0"><div class="viewer" id="viewer"><img id="pimg" src="/api/${P("page/"+S.page)}" alt="도면"><div class="hl hidden" id="hl"></div></div>
      <div class="legend" style="margin-top:8px"><span><i style="background:#15ad60"></i>FIELD</span><span><i style="background:#4fa1e0"></i>DCS</span><span><i style="background:#d1335d"></i>ESD Interlock</span><span><i style="background:#ffba00"></i>DCS/HW Interlock</span><span><i style="background:#7e66cb"></i>벤더 경계</span></div></div>
    <div style="flex:1;min-width:300px">
      <div id="aipanel"></div>
      <div style="margin-bottom:6px">${S.reason?`<span class="chip" data-r="" style="cursor:pointer;margin:0 6px 6px 0">전체 보기 ✕</span>`:""}${chips}</div>
      <div class="rlist" id="rlist">${r.items.map((x,i)=>`<div class="ritem ${S.sel===i?"on":""}" data-i="${i}">
        <div class="a"><b class="mono">${esc(x.tag)}</b><span>${x.reasons.map(t=>`<span class="chip ${/ESD/.test(t)?"r":/벤더/.test(t)?"p":/중복|대수|미분류/.test(t)?"y":""}">${esc(t)}</span>`).join(" ")}</span></div>
        <div class="b">${esc(x.desc)} · ${esc(x.system)} ${esc(x.io)} · ${esc(x.dwg)} p${x.page||"-"} · <span style="color:${ORIGIN_COLOR[x.origin]||"#999"}">${esc(x.origin)}</span></div>
        ${x.inform?`<div class="b" style="color:#444">${esc(x.inform)}</div>`:""}</div>`).join("") || `<div class="empty">검토할 항목이 없습니다.</div>`}
      </div>
      <p class="lead" style="font-size:12px;margin-top:6px">${fmt(r.total)}건${r.total>r.items.length?` 중 ${r.items.length}건 표시`:""}</p>
    </div>
  </div>
  <div class="panel" style="margin-top:16px"><h2>읽은 노트와 적용 효과</h2>
    <table><tr><th style="width:100px">시트</th><th>노트 (발췌)</th><th style="width:330px">적용</th></tr>
    ${r.notes.map(n=>`<tr><td class="mono">${esc(n.dwg)}</td><td style="font-size:12.5px">${esc(n.text)}</td><td>${esc(n.effect)}</td></tr>`).join("")}</table></div>`;
  m.querySelectorAll("[data-r]").forEach(c => c.onclick = () => { S.reason = c.dataset.r; S.sel = null; renderReview(m); });
  $("#pg").onchange = e => { S.page = +e.target.value; S.sel = null; renderReview(m); };
  $("#too").onclick = () => go("output");
  m.querySelectorAll(".ritem").forEach(el => el.onclick = () => {
    const x = r.items[+el.dataset.i]; S.sel = +el.dataset.i;
    if (x.page && x.page !== S.page) { S.page = x.page; renderReview(m).then(() => focusItem(x)); }
    else { m.querySelectorAll(".ritem").forEach(e=>e.classList.toggle("on", e===el)); focusItem(x); }
  });
  if (S.sel != null && r.items[S.sel]) focusItem(r.items[S.sel]);
  renderAIPanel();
}

/* ---------------------------------------------------------------- AI */
const PROVIDER_NAME = {none:"사용 안 함", manual:"수동 (채팅 AI에 복사·붙여넣기)", copilot_cli:"GitHub Copilot CLI"};
let aiPoll = null;
async function renderAIPanel() {
  const box = $("#aipanel"); if (!box) return;
  const a = await api(P("ai"));
  const c = a.counts || {symbols:0, funcs:0};
  const pend = a.suggestions.filter(x=>x.status==="pending");
  const running = a.job && a.job.state === "running";
  box.innerHTML = `<div class="panel" style="padding:14px 16px;margin-bottom:12px;border-top:3px solid var(--green)">
    <div style="display:flex;justify-content:space-between;align-items:center"><b>AI 재판정</b>
      <span class="chip ${a.provider==="none"?"":"g"}" style="cursor:pointer" id="aiset">${esc(PROVIDER_NAME[a.provider])}</span></div>
    <p class="lead" style="font-size:12.5px;margin:6px 0 10px">규칙이 확정하지 못한 것만 AI에게 묻습니다. 답은 제안으로 들어오고, 승인해야 반영됩니다.</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn sm" data-ai="symbols" ${!c.symbols||running||a.provider==="none"?"disabled":""}>심볼 재판정 (${c.symbols})</button>
      <button class="btn sm line" data-ai="funcs" ${!c.funcs||running||a.provider==="none"?"disabled":""}>미분류 기능코드 IO 제안 (${c.funcs})</button>
    </div>
    ${running?`<p style="margin-top:10px;color:var(--green-d)">${esc(a.job.msg)}…</p>`:""}
    ${a.job && a.job.state==="error"?`<p style="margin-top:10px;color:var(--red)">${esc(a.job.msg)}</p>`:""}
    ${a.pending?manualBox(a.pending):""}
    ${pend.length?`<div style="margin-top:12px;border-top:1px solid var(--line-l);padding-top:10px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><b style="font-size:13px">AI 제안 ${pend.length}건</b>
        <button class="btn sm line" id="aiall">신뢰도 0.8 이상 모두 승인</button></div>
      ${pend.map(x=>`<div class="ritem" style="padding:8px 4px" data-sg="${x.sid}">
        <div class="a"><span><b class="mono">${esc(x.kind==="symbols"?(x.text||x.tag):x.func)}</b> → ${esc(x.kind==="symbols"?`${x.class} ${x.tag} ${x.io}/${x.system}`:`${x.desc} ${x.io.join("/")||"IO 없음"} ${x.system}`)}</span>
          <span class="mono" style="color:var(--sub)">${Math.round((x.confidence||0)*100)}%</span></div>
        <div class="b">${esc(x.reason)}</div>
        <div style="margin-top:6px;display:flex;gap:6px"><button class="btn sm" data-ok="${x.sid}">승인</button><button class="btn sm line" data-no="${x.sid}">거절</button></div>
      </div>`).join("")}</div>`:""}
  </div>`;
  $("#aiset").onclick = () => go("ai");
  box.querySelectorAll("[data-ai]").forEach(b => b.onclick = async () => {
    try { const r = await post(P("ai/run"), {kind:b.dataset.ai}); if (!r.manual) toast("Copilot에 질문을 보냈습니다"); renderAIPanel(); }
    catch(e) { toast(e.message, true); }
  });
  box.querySelectorAll("[data-ok],[data-no]").forEach(b => b.onclick = async (ev) => {
    ev.stopPropagation();
    await post(P("ai/decide"), {sid:b.dataset.ok||b.dataset.no, accept:!!b.dataset.ok});
    S.summary = null; S.review = null; renderReview($("#main"));
  });
  box.querySelectorAll("[data-sg]").forEach(el => el.onclick = () => {
    const x = a.suggestions.find(y=>y.sid===el.dataset.sg);
    if (x && x.page) { if (x.page !== S.page) { S.page = x.page; renderReview($("#main")).then(()=>focusItem(x)); } else focusItem(x); }
  });
  const all = $("#aiall"); if (all) all.onclick = async () => { await post(P("ai/decide"), {min_conf:0.8}); S.summary=null; S.review=null; renderReview($("#main")); };
  const cp = $("#aicopy"); if (cp) cp.onclick = async () => { const t=$("#aiprompt"); t.select(); try { await navigator.clipboard.writeText(t.value); } catch(e) { document.execCommand("copy"); } toast("질문을 복사했습니다. Copilot 채팅에 붙여넣으세요"); };

    catch(e) { toast(e.message, true); }
  };
  clearTimeout(aiPoll);
  if (running) aiPoll = setTimeout(() => { if (S.screen==="review") renderAIPanel(); }, 3000);
}

        </div>
      </div>
      <div style="margin-top:16px;display:flex;gap:8px"><button class="btn" id="save">저장</button><button class="btn line" id="test">연결 테스트</button></div>
      <pre id="tres" class="mono" style="margin-top:12px;white-space:pre-wrap;font-size:12px;color:var(--sub)"></pre>
    </div>
    <div class="panel"><h2>안내</h2>
      <div class="kv"><span><b>수동</b>: 질문을 복사해 회사 Copilot(M365) 채팅에 붙여넣고, 답을 다시 붙여넣습니다. API 없이 바로 사용.</span></div>
      <div class="kv"><span><b>GitHub Copilot CLI</b>: 이 PC에 설치된 <span class="mono">copilot</span> 명령을 버튼 하나로 실행합니다. 설치된 버전의 실행 옵션에 맞게 위 명령을 조정하세요 (명령창에서 <span class="mono">copilot --help</span>).</span></div>
      <div class="kv"><span>질문에는 태그 글자, 주변 글자, 외곽선 측정값이 들어갑니다. 심볼 재판정은 주변을 자른 작은 이미지도 함께 만들어집니다 (도면 전체는 보내지 않음).</span></div>
      <div class="kv"><span>승인된 판단은 프로젝트의 <span class="mono">overrides.json</span>에 저장되어 다음 계산부터 자동 적용됩니다.</span></div>
    </div>
  </div>`;
  const sync = () => $("#clibox").style.opacity = (document.querySelector("input[name=prov]:checked").value==="copilot_cli") ? 1 : .4;
  m.querySelectorAll("input[name=prov]").forEach(r => r.onchange = sync); sync();
  const collect = () => { let cmd; try { cmd = JSON.parse($("#cmd").value); } catch(e) { throw new Error("명령은 JSON 배열이어야 합니다"); }
    return {provider:document.querySelector("input[name=prov]:checked").value, command:cmd, model:$("#model").value.trim(), timeout:+$("#tmo").value||300, stdin:$("#stdin").checked}; };
  $("#save").onclick = async () => { try { await post("ai/settings", collect()); toast("저장했습니다"); } catch(e) { toast(e.message, true); } };
  $("#test").onclick = async () => { try { await post("ai/settings", collect()); $("#tres").textContent = "테스트 중…"; const r = await post("ai/test"); $("#tres").textContent = (r.ok?"✓ 연결됨\n":"응답은 왔지만 형식이 다릅니다\n") + r.answer; } catch(e) { $("#tres").textContent = "✕ " + e.message; } };
}
function focusItem(x) {
  const img = $("#pimg"), hl = $("#hl"), v = $("#viewer");
  if (!x.coord || !img) { hl.classList.add("hidden"); return; }
  const place = () => {
    const [cx, cy] = x.coord.split(",").map(Number);
    const k = 60/72, r = 30*k;
    hl.style.left = (cx*k - r) + "px"; hl.style.top = (cy*k - r) + "px";
    hl.style.width = hl.style.height = (2*r) + "px"; hl.classList.remove("hidden");
    v.scrollTo({left: cx*k - v.clientWidth/2, top: cy*k - v.clientHeight/2, behavior:"smooth"});
  };
  img.complete ? place() : img.onload = place;
}

/* ---------------------------------------------------------------- 5 output */
async function renderOutput(m) {
  const outs = await api(P("outputs"));
  if (!S.concept) S.concept = await api(P("concept"));
  if (!S.summary) S.summary = await api(P("summary"));
  const s = S.summary;
  m.innerHTML = `
  <div class="head"><div><div class="eyebrow">STEP 5</div><h1>출력</h1>
    <p class="lead">양식에 맞춘 인덱스(엑셀)와 검토용 PDF를 만듭니다. 결과는 프로젝트 output 폴더에도 저장됩니다.</p></div></div>
  <div class="grid g4">
    <div class="panel stat"><div class="k">인덱스 행</div><div class="v">${fmt(s.rows)}</div></div>
    <div class="panel stat"><div class="k">하드와이어 IO</div><div class="v"><span class="uline">${fmt(s.hw)}</span></div></div>
    <div class="panel stat"><div class="k">통신 포트</div><div class="v">${fmt(s.comm)}</div></div>
    <div class="panel stat"><div class="k">IO 카드 (개략)</div><div class="v">${fmt(s.cards_total)}</div></div>
  </div>
  <div class="grid g2" style="margin-top:16px">
    <div class="panel"><h2>만들기</h2>
      <div class="kv"><span>Instrument Index (양식 + 산출구분/근거/원본 Tag, IO_Summary, Concept_Basis, Notes_Review)</span><b>항상</b></div>
      <div class="kv"><label style="display:flex;gap:8px;align-items:center;cursor:pointer"><input type="checkbox" id="ov" ${S.concept&&S.concept.overlay_default?"checked":""}> 검토용 오버레이 PDF (몇 분 소요, I03)</label><span></span></div>
      <div class="kv"><span>레퍼런스 채점 시트</span><span>${(S.state.meta.files||{}).ref?"레퍼런스 있음 → 포함":"레퍼런스 없음"}</span></div>
      <div style="margin-top:16px"><button class="btn" id="mk">엑셀 만들기</button></div>
    </div>
    <div class="panel"><h2>만든 파일</h2>
      ${outs.length?`<table><tr><th>파일</th><th>시각</th><th>크기</th><th></th></tr>${outs.map(f=>`<tr><td class="mono">${esc(f.name)}</td><td>${esc(f.time)}</td><td>${(f.size/1024/1024).toFixed(1)}MB</td>
        <td><a class="btn sm line" href="/api/${P("file/"+encodeURIComponent(f.name))}">받기</a></td></tr>`).join("")}</table>`:`<div class="empty">아직 만든 파일이 없습니다.</div>`}
    </div>
  </div>
  <div class="panel" style="margin-top:16px"><h2>시스템별 IO</h2>
    <table><tr><th>System</th><th>AI</th><th>AO</th><th>DI</th><th>DO</th><th>TC/RTD</th><th>합계</th><th>카드</th></tr>
    ${Object.entries(s.per_system).map(([k,v])=>`<tr><td><b>${esc(k)}</b></td><td>${v.AI}</td><td>${v.AO}</td><td>${v.DI}</td><td>${v.DO}</td><td>${v["TC/RTD"]||0}</td><td><b>${v.AI+v.AO+v.DI+v.DO+(v["TC/RTD"]||0)}</b></td><td>${s.cards[k]}</td></tr>`).join("")}</table></div>`;
  $("#mk").onclick = async () => {
    const b = $("#mk"); b.disabled = true; b.textContent = "만드는 중…";
    try { const r = await post(P("export"), {overlay: $("#ov").checked}); toast(r.files.join(", ") + " 생성"); renderOutput(m); }
    catch(e) { toast(e.message, true); b.disabled = false; b.textContent = "엑셀 만들기"; }
  };
}

render();
</script>
</body>
</html>
