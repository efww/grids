<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>계장 개념설계 IO 산출</title>
<style>
/*FONTFACE*/
:root{
  --green:#15ad60; --green-d:#1c5438; --green-l:#e7f6ee; --ink:#111111; --sub:#666666; --mute:#999999;
  --line:#dcdcdc; --line-l:#ececec; --bg:#ededed; --panel:#ffffff; --dark:#222222;
  --red:#d1335d; --purple:#7e66cb; --blue:#4fa1e0; --yellow:#ffba00; --chg:#fff5d6;
  --font:"HDHarmonyApp","Hyundai Harmony L","HyundaiHarmonyL","현대하모니 L","Hyundai Harmony","HyundaiHarmony","Malgun Gothic","Apple SD Gothic Neo","Noto Sans CJK KR",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}
button,input,select{font:inherit;color:inherit}
a{color:var(--green-d)}
/* top bar */
.top{height:58px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px;gap:14px;position:sticky;top:0;z-index:10}
.mark{width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;border-bottom:19px solid var(--green)}
.brand{font-size:18px;letter-spacing:-.01em}
.brand b{font-weight:700}
.brand span{color:var(--mute);font-size:12.5px;margin-left:10px;letter-spacing:.04em}
.top .proj{margin-left:auto;display:flex;align-items:center;gap:10px;color:var(--sub);font-size:13px}
.top .proj b{color:var(--ink);font-weight:700}
/* layout */
.wrap{display:flex;min-height:calc(100vh - 58px)}
nav{width:220px;background:#fff;border-right:1px solid var(--line);padding:22px 0;flex:none}
nav .st{display:flex;align-items:center;gap:12px;padding:12px 24px;color:var(--sub);cursor:pointer;border-left:3px solid transparent;font-size:15px}
nav .st i{font-style:normal;width:24px;height:24px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--mute);flex:none}
nav .st.on{color:var(--ink);font-weight:700;border-left-color:var(--green);background:var(--green-l)}
nav .st.on i{background:var(--green);color:#fff;border-color:var(--green)}
nav .st.done i{border-color:var(--green);color:var(--green)}
nav .st.dis{opacity:.45;pointer-events:none}
/* STEP 6+ : extension modules (cable ...) in blue */
nav .st.ext{margin-top:10px;border-top:1px dashed var(--line);color:#2c7fc0}
nav .st.ext i{border-color:var(--blue);color:#2c7fc0}
nav .st.ext.on{border-left-color:var(--blue);background:#eaf4fc;color:#111}
nav .st.ext.on i{background:var(--blue);border-color:var(--blue);color:#fff}
.ext-page .eyebrow{color:#2c7fc0}
.ext-page .uline{border-bottom-color:var(--blue)}
.ext-page .tabs a.on{border-bottom-color:var(--blue)}
.ext-page .btn:not(.line){background:var(--blue);border-color:var(--blue)}
.ext-page .btn:not(.line):hover{background:#2c7fc0;border-color:#2c7fc0}
.ext-page .tog.on{background:var(--blue)}
nav .foot{margin:26px 24px 0;padding-top:16px;border-top:1px solid var(--line-l);font-size:12px;color:var(--mute);line-height:1.7}
main{flex:1;padding:30px 34px 60px;min-width:0}
.head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px;gap:20px}
.eyebrow{font-size:12.5px;color:var(--green);font-weight:700;letter-spacing:.08em;margin-bottom:6px}
h1{font-size:32px;font-weight:300;letter-spacing:-.02em;line-height:1.2}
h2{font-size:17px;font-weight:700;margin-bottom:12px}
.lead{color:var(--sub);margin-top:6px}
.panel{background:#fff;border:1px solid var(--line);padding:20px 22px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g5{grid-template-columns:repeat(5,1fr)}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--green);color:#fff;border:1px solid var(--green);padding:10px 20px;cursor:pointer;font-weight:700;font-size:14px}
.btn{white-space:nowrap}
.kv>*:last-child{white-space:nowrap;margin-left:14px}
.btn:hover{background:var(--green-d);border-color:var(--green-d)}
.btn.line{background:#fff;color:var(--ink);border-color:#111}
.btn.line:hover{background:#111;color:#fff}
.btn.sm{padding:6px 12px;font-size:13px}
.btn[disabled]{opacity:.4;pointer-events:none}
.chip{display:inline-block;font-size:12px;padding:2px 9px;border:1px solid var(--line);color:var(--sub);white-space:nowrap}
.chip.g{border-color:var(--green);color:var(--green)} .chip.r{border-color:var(--red);color:var(--red)}
.chip.y{border-color:#e0a400;color:#b78600} .chip.p{border-color:var(--purple);color:var(--purple)} .chip.b{border-color:var(--blue);color:#2c7fc0}
.chip.fill{background:var(--green);border-color:var(--green);color:#fff}
.stat .k{font-size:12.5px;color:var(--sub)}
.stat .v{font-size:34px;font-weight:300;line-height:1.15;letter-spacing:-.02em}
.stat .v small{font-size:14px;color:var(--sub);margin-left:4px}
.uline{border-bottom:2px solid var(--green);display:inline-block;padding-bottom:2px}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line-l);font-size:13.5px;vertical-align:middle}
th{font-size:12px;color:var(--sub);font-weight:700;border-bottom:1px solid #111}
tr.click{cursor:pointer} tr.click:hover td{background:#f7faf8}
.mono{font-family:Consolas,"D2Coding",monospace;font-size:12.5px}
.empty{color:var(--mute);padding:40px;text-align:center;border:1px dashed var(--line);background:#fafafa}
input[type=text],input[type=number],select{border:1px solid #bbb;background:#fff;padding:7px 10px;border-radius:0;min-width:0}
input[type=number]{width:90px;text-align:right}
select{padding-right:26px}
/* file cards */
.fcard{background:#fff;border:2px dashed #c8c8c8;display:flex;flex-direction:column;min-height:170px;transition:border-color .15s,background .15s}
.fcard .hd{display:flex;align-items:center;gap:10px;padding:12px 16px;font-weight:700;font-size:15px}
.fcard .hd .ic{width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-size:16px;flex:none;border:2px solid currentColor;border-radius:50%}
.fcard .hd .st{margin-left:auto;font-size:12.5px;font-weight:700;padding:3px 10px}
.fcard .bd{padding:4px 16px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
.fcard .n{font-size:13px;color:var(--sub);word-break:break-all;flex:1}
.fcard .fn{font-size:13.5px;color:var(--ink);font-weight:700;word-break:break-all}
.fcard .meta{font-size:12px;color:var(--sub)}
.fcard .er{font-size:12.5px;color:var(--red);background:#fdecef;padding:8px 10px;line-height:1.45}
.fcard.need .hd{color:var(--red)} .fcard.need .hd .st{background:#fdecef;color:var(--red)}
.fcard.opt .hd{color:#777} .fcard.opt .hd .st{background:#f1f1f1;color:#777}
.fcard.ok{border:2px solid var(--green);background:#f6fcf8}
.fcard.ok .hd{background:var(--green);color:#fff} .fcard.ok .hd .st{background:#fff;color:var(--green-d)}
.fcard.busy{border:2px solid var(--blue)} .fcard.busy .hd{color:#2c7fc0}
.fcard.bad{border:2px solid var(--red)}
.fcard.drag{border-color:var(--green);background:var(--green-l)}
.fcard label{align-self:flex-start}
.fcard input[type=file]{display:none}
.g7{grid-template-columns:repeat(7,minmax(0,1fr))}
.item .xtra{grid-column:2/-1;padding:4px 0 6px}
.xnote{font-size:12.5px;color:var(--sub);margin:4px 0 8px;line-height:1.6}
table.mini th,table.mini td{padding:6px 8px;font-size:12.5px}
.typ{margin-top:12px;padding:12px;border:1px solid var(--line-l);background:#fff}
.pager{display:flex;justify-content:space-between;align-items:center;margin-top:18px;padding-top:14px;border-top:1px solid var(--line-l)}
.dec{margin-top:12px;border-top:1px solid var(--line-l);padding-top:12px;display:flex;flex-direction:column;gap:10px}
.dec .drow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.aiopt{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--line);margin-bottom:8px;cursor:pointer}
.aiopt.on{border-color:var(--green);background:var(--green-l)}
details summary::marker{color:var(--green)}
.hint{font-size:12.5px;color:var(--red);margin-top:6px;text-align:right}
.prog{height:6px;background:#e3e3e3;overflow:hidden}
.prog i{display:block;height:100%;background:var(--green);transition:width .3s}
/* checklist */
.tabs{display:flex;gap:0;border-bottom:1px solid #111;margin-bottom:0;flex-wrap:wrap}
.tabs a{padding:10px 14px;cursor:pointer;color:var(--sub);text-decoration:none;font-size:13.5px;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs a.on{color:var(--ink);font-weight:700;border-bottom-color:var(--green)}
.tabs a .cnt{font-size:11px;background:var(--yellow);color:#111;padding:0 5px;margin-left:4px}
.item{display:grid;grid-template-columns:48px 1fr 230px;gap:14px;align-items:center;padding:13px 6px;border-bottom:1px solid var(--line-l)}
.item.chg{background:var(--chg)}
.item.plan{opacity:.55}
.item .id{font-family:Consolas,monospace;color:var(--mute);font-size:12px}
.item .nm{font-size:14.5px}
.item .ef{font-size:12px;color:var(--sub);margin-top:2px}
.item .ctl{display:flex;justify-content:flex-end;align-items:center;gap:8px}
.item .def{font-size:11.5px;color:var(--mute)}
.tog{width:44px;height:22px;background:#c9c9c9;position:relative;cursor:pointer;flex:none;border:0}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;background:#fff;transition:left .15s}
.tog.on{background:var(--green)} .tog.on::after{left:25px}
.side{width:340px;flex:none;position:sticky;top:78px;align-self:flex-start;display:flex;flex-direction:column;gap:14px}
.bar{display:flex;height:16px;background:#eee}
.bar span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--sub);margin-top:8px}
.legend i{display:inline-block;width:9px;height:9px;margin-right:5px}
.kv{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--line-l);font-size:13px}
.kv:last-child{border:0}
.delta-n{color:var(--green-d);font-weight:700} .delta-p{color:var(--red);font-weight:700}
/* review */
.viewer{background:#fff;border:1px solid var(--line);position:relative;overflow:auto;height:calc(100vh - 230px)}
.viewer img{display:block;transform-origin:0 0}
.hl{position:absolute;border:3px solid var(--red);box-shadow:0 0 0 3000px rgba(0,0,0,.08);pointer-events:none}
.rlist{height:calc(100vh - 290px);overflow:auto;border:1px solid var(--line);background:#fff}
.ritem{padding:10px 12px;border-bottom:1px solid var(--line-l);cursor:pointer}
.ritem:hover{background:#f7faf8} .ritem.on{background:var(--green-l);border-left:3px solid var(--green)}
.ritem .a{display:flex;justify-content:space-between;gap:8px}
.ritem .b{font-size:12px;color:var(--sub);margin-top:3px}
.thumb{width:92px;height:92px;flex:none;object-fit:contain;background:#fff;border:1px solid var(--line);cursor:zoom-in}
#bigview{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:60}
#bigview .bigbox{background:#fff;padding:14px;max-width:80vw;max-height:86vh;display:flex;flex-direction:column;gap:8px;border-top:4px solid var(--green)}
#bigview img{max-width:76vw;max-height:76vh;object-fit:contain}
#bigview .cap{font-size:12.5px;color:var(--sub);cursor:pointer}
.toast{position:fixed;right:24px;bottom:24px;background:#111;color:#fff;padding:12px 18px;font-size:13.5px;z-index:50;display:none;max-width:420px}
.toast.err{background:var(--red)}
.hidden{display:none!important}
.dot{display:inline-block;width:8px;height:8px;margin-right:6px}
.nw th,.nw td{white-space:nowrap}.nw td:last-child{white-space:normal}
</style>
</head>
<body>
<div class="top">
  <div class="mark"></div>
  <div class="brand"><b>계장 개념설계</b> IO 산출<span>INSTRUMENTATION · CONCEPT I/O</span></div>
  <div class="proj"><span>프로젝트</span><b id="pname">선택 안 됨</b><span id="phome" class="mono"></span></div>
</div>
<div class="wrap">
  <nav id="nav">
    <div class="st" data-s="projects"><i>1</i>프로젝트</div>
    <div class="st" data-s="extract"><i>2</i>입력 · 추출</div>
    <div class="st" data-s="concept"><i>3</i>개념 체크리스트</div>
    <div class="st" data-s="review"><i>4</i>검토</div>
    <div class="st" data-s="output"><i>5</i>출력</div>
    <div class="st ext" data-s="cable"><i>6</i>케이블<span class="chip" style="margin-left:auto;font-size:10.5px;padding:0 6px">확장</span></div>
    <div class="st ext" data-s="jb"><i>7</i>JB<span class="chip" style="margin-left:auto;font-size:10.5px;padding:0 6px">확장</span></div>
    <div class="st ext" data-s="tray"><i>8</i>트레이<span class="chip" style="margin-left:auto;font-size:10.5px;padding:0 6px">확장</span></div>
    <div class="st ext" data-s="support"><i>9</i>서포트<span class="chip" style="margin-left:auto;font-size:10.5px;padding:0 6px">확장</span></div>
    <div class="st ext" data-s="twin"><i>10</i>3D 인계<span class="chip" style="margin-left:auto;font-size:10.5px;padding:0 6px">확장</span></div>
    <div class="st" data-s="ai" style="margin-top:14px;border-top:1px solid var(--line-l)"><i>AI</i>AI 연결 설정</div>
    <div class="foot">도면 인식은 한 번,<br>체크리스트를 바꾸면 IO가<br>즉시 다시 계산됩니다.<br><br><span class="mono">IO 1점 = 인덱스 1행</span><br><br><span id="fontst"></span></div>
  </nav>
  <main id="main"></main>
</div>
<div class="toast" id="toast"></div>

<script>
const ORIGIN_COLOR = {"도면인식":"#4fa1e0","Typical파생":"#15ad60","트레인복제":"#ffba00","대수복제":"#f08a24","장비Typical":"#7e66cb","패키지":"#d1335d","스페어":"#a8a8a8"};
const S = {tok:0, rview:"todo", showPage:false, warmed:false, project:null, screen:"projects", state:null, concept:null, tab:0, summary:null, review:null, sel:null, reason:"", page:null, impact:null};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = n => (n ?? 0).toLocaleString("ko-KR");

async function api(path, opt={}) {
  const r = await fetch("/api/" + path, opt);
  const ct = r.headers.get("content-type") || "";
  const body = ct.includes("json") ? await r.json() : await r.blob();
  if (!r.ok) throw new Error(body.error || r.statusText);
  return body;
}
const post = (path, data) => api(path, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(data||{})});
const P = p => `p/${encodeURIComponent(S.project)}/${p}`;
function toast(msg, err) { const t=$("#toast"); t.textContent=msg; t.className="toast"+(err?" err":""); t.style.display="block"; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display="none", err?6000:2500); }

function go(screen) { S.tok++; S.screen = screen; if (["cable","jb","tray","support","twin"].includes(screen)) CK.data = null; $("#main").className = ""; render(); }
document.querySelectorAll("#nav .st").forEach(el => el.onclick = () => go(el.dataset.s));

function navState() {
  const ex = S.state && S.state.extracted;
  document.querySelectorAll("#nav .st").forEach(el => {
    const s = el.dataset.s;
    el.classList.toggle("on", s === S.screen);
    el.classList.toggle("dis", (!S.project && !["projects","ai"].includes(s)) || (!ex && ["concept","review","output","cable","jb","tray","support","twin"].includes(s)));
    el.classList.toggle("done", (s==="projects" && S.project) || (s==="extract" && ex));
  });
  $("#pname").textContent = S.project || "선택 안 됨";
}

async function loadState() { if (S.project) S.state = await api(P("")); navState(); }

async function render() {
  navState();
  const m = $("#main"), t = S.tok;
  try {
    if (S.screen === "projects") return await renderProjects(m);
    if (S.screen === "ai") return await renderAISettings(m);
    await loadState();
    if (t !== S.tok) return;                 // user moved to another screen meanwhile
    if (S.screen === "extract") return await renderExtract(m);
    if (S.screen === "concept") return await renderConcept(m);
    if (S.screen === "review") return await renderReview(m);
    if (S.screen === "output") return await renderOutput(m);
    if (S.screen === "cable") return await renderCable(m);
    if (S.screen === "jb") return await renderJB(m);
    if (S.screen === "tray") return await renderTray(m);
    if (S.screen === "support") return await renderSupport(m);
    if (S.screen === "twin") return await renderTwin(m);
  } catch (e) { toast(e.message, true); }
}

/* ---------------------------------------------------------------- 1 projects */
async function renderProjects(m) {
  const t = S.tok;
  const d = await api("projects");
  if (t !== S.tok) return;
  $("#phome").textContent = "";
  m.innerHTML = `
  <div class="head"><div><div class="eyebrow">STEP 1</div><h1>프로젝트</h1>
    <p class="lead">프로젝트마다 도면, 양식, 체크리스트, 결과가 폴더 하나에 저장됩니다. <span class="mono">${esc(d.home)}</span></p></div></div>
  <div class="grid" style="grid-template-columns:2fr 1fr">
    <div class="panel">
      <h2>프로젝트 목록</h2>
      ${d.projects.length ? `<table><tr><th>이름</th><th>생성</th><th>P&amp;ID</th><th>추출</th><th></th></tr>
      ${d.projects.map(p => `<tr class="click" data-n="${esc(p.name)}"><td><b>${esc(p.name)}</b></td><td>${esc(p.created||"")}</td>
        <td class="mono">${esc(p.files.pdf||"-")}</td><td>${p.extracted?`<span class="chip g">${esc(p.extracted)}</span>`:`<span class="chip">대기</span>`}</td>
        <td style="text-align:right"><span class="btn sm line">열기</span></td></tr>`).join("")}</table>`
      : `<div class="empty">아직 프로젝트가 없습니다. 오른쪽에서 새로 만드세요.</div>`}
    </div>
    <div class="panel">
      <h2>새 프로젝트</h2>
      <p class="lead" style="margin-bottom:14px">회사 표준 체크리스트(기본값)가 복사되어 시작합니다.</p>
      <input type="text" id="newname" placeholder="예: 서남해 200MW 수전해" style="width:100%;margin-bottom:12px">
      <button class="btn" id="mk">만들기</button>
    </div>
  </div>`;
  m.querySelectorAll("tr.click").forEach(tr => tr.onclick = () => { S.project = tr.dataset.n; S.summary=null; S.concept=null; S.review=null; S.impact=null; S.warmed=false; S.sel=null; go("extract"); });
  $("#mk").onclick = async () => {
    const n = $("#newname").value.trim(); if (!n) return toast("이름을 입력하세요", true);
    try { await post("projects", {name:n}); S.project = n; go("extract"); } catch(e) { toast(e.message, true); }
  };
}

/* ---------------------------------------------------------------- 2 extract */
const UP = {};      // kind -> {busy, pct, err}
function fileCard(kind, title, desc, required) {
  const f = (S.state.meta.files||{})[kind];
  const fi = (S.state.meta.file_info||{})[kind] || {};
  const u = UP[kind] || {};
  const cls = u.busy ? "busy" : (f ? "ok" : (u.err ? "bad " + (required ? "need" : "opt") : (required ? "need" : "opt")));
  const info = kind==="pdf" && S.state.meta.pdf_info ? ` · ${S.state.meta.pdf_info.pages}p · ${S.state.meta.pdf_info.vector?"벡터":"스캔(미지원)"}` : "";
  const st = u.busy ? `업로드 중 ${u.pct||0}%` : (f ? "업로드 완료" : (required ? "필수 · 미업로드" : "선택 · 미업로드"));
  const ic = u.busy ? "↑" : (f ? "✓" : (required ? "!" : "+"));
  return `<div class="fcard ${cls}" data-drop="${kind}">
    <div class="hd"><span class="ic">${ic}</span>${title}<span class="st">${st}</span></div>
    <div class="bd">

function readErr(e) {

async function uploadFile(kind, f) {
  UP[kind] = {busy:true, pct:0};

  let buf;
  try { buf = await f.arrayBuffer(); }
  catch (e) { UP[kind] = {err: readErr(e)}; return S.screen === "extract" && renderExtract($("#main")); }
  await new Promise(res => {
    const x = new XMLHttpRequest();
    x.open("POST", "/api/" + P("upload?kind=" + kind));
    x.setRequestHeader("X-Filename", encodeURIComponent(f.name));
    x.upload.onprogress = ev => { if (ev.lengthComputable) { UP[kind].pct = Math.round(100*ev.loaded/ev.total);
      const c = document.querySelector(`[data-drop="${kind}"]`); if (c) { const i = c.querySelector(".prog i"); if (i) i.style.width = UP[kind].pct+"%";
        const st = c.querySelector(".st"); if (st) st.textContent = `업로드 중 ${UP[kind].pct}%`; } } };
    x.onload = () => { let b = {}; try { b = JSON.parse(x.responseText); } catch(e) {}
      UP[kind] = x.status < 300 ? {} : {err: b.error || ("서버 오류 " + x.status)}; res(); };
    x.onerror = () => { UP[kind] = {err: "서버와 연결이 끊겼습니다. 실행 창(검은 창)이 켜져 있는지 확인하고 다시 시도하세요."}; res(); };
    x.send(buf);

}

const CLS_KO = {FIELD:"현장 계기", DCS_SHARED:"DCS 표시/제어", PANEL_CR:"제어실 패널", PANEL_BEHIND:"패널 뒤", PLC:"PLC", ESD_INTERLOCK:"ESD 인터록", DCS_INTERLOCK:"DCS 인터록", HW_INTERLOCK:"하드와이어 인터록", NOT_A_TAG:"계기 아님"};
function aiSugLine(x) {

function focusItem(x) {
  const img = $("#pimg"), hl = $("#hl"), v = $("#viewer");
  if (!img || !hl || !v) return;
  if (!x.coord) { hl.classList.add("hidden"); return; }
  const place = () => {
    const [cx, cy] = x.coord.split(",").map(Number);
    const k = 60/72, r = 30*k;
    hl.style.left = (cx*k - r) + "px"; hl.style.top = (cy*k - r) + "px";
    hl.style.width = hl.style.height = (2*r) + "px"; hl.classList.remove("hidden");
    v.scrollTo({left: cx*k - v.clientWidth/2, top: cy*k - v.clientHeight/2, behavior:"smooth"});
  };
  img.complete ? place() : img.onload = place;
}

const CK = {tab:0, view:"spec", data:null};
function ckCtl(it, v) {
  if (it.on) return `<button class="tog ${String(v)===it.on?"on":""}" data-cktog="${it.id}"></button><span class="def" style="width:84px">${esc(v)}</span>`;
  if (it.type === "select") return `<select data-ck="${it.id}">${it.options.map(o=>`<option ${o===String(v)?"selected":""}>${esc(o)}</option>`).join("")}</select>`;
  if (it.type === "text") return `<input type="text" data-ck="${it.id}" value="${esc(v)}" style="width:230px">`;
  const pct = !!it.pct;
  return `<input type="number" data-ck="${it.id}" step="${it.step||1}" min="0" value="${esc(v)}">${pct?`<span class="def">${Math.round(v*100)}%</span>`:(it.unit?`<span class="def">${esc(it.unit)}</span>`:"")}`;
}
function ckDef(it) { return it.pct ? Math.round(it.default*100)+"%" : it.default + (it.unit||""); }

    const chg = [f,q,h].some(x => String(V[x.id]) !== String(x.default));

    return `<tr style="${chg?"background:var(--chg)":""}"><td><b>${io}</b>${io==="RTD"?' <span class="def">(TC/RTD)</span>':""}</td>
      <td>${ckCtl(f, V[f.id])}</td><td>${ckCtl(q, V[q.id])}</td><td>${ckCtl(h, V[h.id])}</td><td class="mono">${esc(spec)}</td></tr>`; }).join("");
  const cm = by("COMM_spec");
  return `<table class="mini" style="margin-top:6px"><tr><th>IO</th><th>구성</th><th>굵기 (SQ)</th><th>차폐</th><th>사양</th></tr>${rows}</table>

}

function ortho(poly) {               // x / y only, like pid_io.plot.orthogonal
  const out = poly.length ? [poly[0].slice()] : [];
  for (const q of poly.slice(1)) { const a = out[out.length-1];
    if (Math.abs(a[0]-q[0]) > .05 && Math.abs(a[1]-q[1]) > .05) out.push(Math.abs(q[0]-a[0]) >= Math.abs(q[1]-a[1]) ? [q[0], a[1]] : [a[0], q[1]]);
    out.push(q.slice()); }
  const c = [];
  for (const p of out) { if (c.length && Math.abs(p[0]-c[c.length-1][0]) < .05 && Math.abs(p[1]-c[c.length-1][1]) < .05) continue;
    if (c.length >= 2) { const a = c[c.length-2], b = c[c.length-1];
      if ((Math.abs(a[0]-b[0]) < .05 && Math.abs(b[0]-p[0]) < .05) || (Math.abs(a[1]-b[1]) < .05 && Math.abs(b[1]-p[1]) < .05)) { c[c.length-1] = p; continue; } }
    c.push(p); }
  return c;
}

/* ---------------------------------------------------------------- 9 support */
const SPM = {tab:99, view:"type", sel:null, edit:null, live:null};
const SP_COL = {L:"#15ad60", T:"#2c7fc0", H:"#7e66cb", RT:"#d1335d", RF:"#f08a24", RC:"#9db3c8", UB:"#8a6d00", UM:"#8a6d00", UP:"#8a6d00", PB:"#5f6b76"};
/* simple section sketches of each support type (until the typical drawing is uploaded) */
function supSketch(t, W=150, H=110) {
  const c = SP_COL[t] || "#555", tr = (x,y,w) => `<rect x="${x}" y="${y}" width="${w}" height="7" fill="none" stroke="#0b3d91" stroke-width="2"/><line x1="${x}" y1="${y+7}" x2="${x+w}" y2="${y}" stroke="#0b3d91" stroke-width=".8"/>`;
  const g = `<line x1="8" y1="${H-8}" x2="${W-8}" y2="${H-8}" stroke="#888" stroke-width="1.5"/>`;
  const post = (x, y0=18) => `<rect x="${x-3}" y="${y0}" width="6" height="${H-8-y0}" fill="${c}"/><rect x="${x-9}" y="${H-11}" width="18" height="3" fill="${c}"/>`;
  const arm = (x1,x2,y) => `<rect x="${x1}" y="${y}" width="${x2-x1}" height="5" fill="${c}"/>`;
  let b = "";
  if (t==="L") b = g + post(40) + arm(40,118,40) + tr(48,33,62);
  else if (t==="T") b = g + post(W/2) + arm(22,W-22,40) + tr(28,33,40) + tr(W/2+6,33,40);
  else if (t==="H") b = g + post(26) + post(W-26) + arm(26,W-26,40) + arm(26,W-26,66) + tr(34,33,W-68) + tr(34,59,W-68);
  else if (t==="RT") b = `<rect x="8" y="${H-30}" width="${W-16}" height="8" fill="#9aa"/><text x="${W-12}" y="${H-12}" font-size="9" text-anchor="end" fill="#678">랙 빔</text>` + `<rect x="${W/2-3}" y="30" width="6" height="${H-60}" fill="${c}"/>` + arm(24,W-24,30) + tr(30,H-37,W-60) + tr(30,23,W-60);
  else if (t==="RF") b = `<rect x="8" y="${H-30}" width="40" height="8" fill="#9aa"/><rect x="${W-48}" y="${H-30}" width="40" height="8" fill="#9aa"/>` + arm(30,W-30,H-40) + `<path d="M30 ${H-47} q45 -30 90 0" fill="none" stroke="#0b3d91" stroke-width="2"/><text x="${W/2}" y="${H-12}" font-size="9" text-anchor="middle" fill="#678">빔 사이 보조 빔</text>`;
  else if (t==="RC") b = `<rect x="8" y="${H-30}" width="${W-16}" height="8" fill="#9aa"/>` + tr(30,H-37,W-60) + `<rect x="24" y="${H-40}" width="8" height="12" fill="${c}"/><rect x="${W-32}" y="${H-40}" width="8" height="12" fill="${c}"/>`;
  else if (t==="UB" || t==="UM" || t==="UP") b = `<path d="M20 15 V${H-15} H${W-20} V15" fill="none" stroke="#8a7a50" stroke-width="5"/>` + arm(22,62,45) + arm(22,62,70) + `<circle cx="34" cy="40" r="4" fill="#333"/><circle cx="46" cy="40" r="4" fill="#333"/><circle cx="34" cy="65" r="4" fill="#333"/><text x="${W/2+10}" y="30" font-size="9" fill="#678">트렌치</text>`;
  else if (t==="PB") b = `<rect x="20" y="10" width="10" height="${H-20}" fill="#9aa"/><text x="24" y="${H-2}" font-size="8" fill="#678">기둥·장비</text>` + `<path d="M30 40 H95 M30 40 L60 70" stroke="${c}" stroke-width="4" fill="none"/><rect x="45" y="30" width="45" height="7" fill="none" stroke="#0b3d91" stroke-width="2"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="background:#fafbfc;border:1px solid var(--line-l)">${b}</svg>`;
}
function supPic(d, t, W=150, H=110) {

function supOverlay(d) {
  const pp = d.plot, [W,H] = pp.size, k = Math.max(W,H)/700, sp = d.sup;
  const racks = (pp.racks||[]).filter(r=>!r[6]).map(r => `<rect x="${r[0]}" y="${r[1]}" width="${r[2]-r[0]}" height="${r[3]-r[1]}" fill="#2c7fc0" opacity=".08"/>`).join("");

    return `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${on?"#e0002a":s.kind==="UG"?"#c9b46a":"#9fc3e6"}" stroke-width="${(on?2.6:1.4)*k}" ${s.kind==="UG"?`stroke-dasharray="${4*k} ${2.5*k}"`:""}/>`; }).join("");

  const ej = sp.joints.map(j => { const r = 3.2*k; return `<path d="M${j.x-r} ${j.y-r} L${j.x+r} ${j.y+r} M${j.x-r} ${j.y+r} L${j.x+r} ${j.y-r}" stroke="#c2185b" stroke-width="${1.4*k}"><title>${esc(j.no)} 익스펜션 스플라이스 · ${esc(j.seg)} · 트레이 ${j.trays}</title></path>`; }).join("");

  const hits = d.tray.segments.map(s => { const [a,b] = s.poly;
    return `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="transparent" stroke-width="${9*k}" data-spseg="${esc(s.no)}" style="cursor:pointer"/>`; }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" style="position:absolute;inset:0;width:100%;height:100%" id="spsvg">${racks}${segs}${qs}${hits}${pts}${ej}</svg>`;

        <p class="xnote">■ 서포트(포스트, 검은 테두리 = 앵커), ● 클램프·브래킷, ✕ 익스펜션 스플라이스, 노란 원 = 질문.<br>

  m.querySelectorAll("[data-spt]").forEach(a => a.onclick = () => { SPM.tab = +a.dataset.spt; renderSupport(m); });

    ${g.settings.map(x=>`<label style="display:block;font-size:12.5px;margin:3px 0"><input type="checkbox" data-gset="${esc(x.key)}" checked> ${esc(x.name)}: ${esc(x.from)} → <b>${esc(x.to)}</b> <span style="color:var(--sub)">${esc(x.why)}</span></label>`).join("")}
    <div style="font-size:12.5px;margin-top:8px"><b>물량 변화</b> (모두 체크했을 때)</div>

    ${g.affected.length?`<div style="font-size:12.5px;margin-top:8px"><b>사람 결정과 부딪히는 것 ${g.affected.length}개</b> (기본: 내 결정 유지)</div>${g.affected.map(a=>{const k=a.kind+":"+a.key;return `<div style="font-size:12px;margin:3px 0">${esc(a.problem)}
      <label style="margin-left:8px"><input type="radio" name="ga_${esc(k)}" data-gaff="${esc(k)}" value="keep" checked> 내 결정 유지</label>
      <label style="margin-left:6px"><input type="radio" name="ga_${esc(k)}" data-gaff="${esc(k)}" value="follow"> 3D 따르기</label></div>`}).join("")}`:`<p class="xnote" style="margin-top:6px">사람 결정과 부딪히는 것 없음</p>`}
    ${g.png?`<div style="margin-top:8px"><b style="font-size:12.5px">PLOT 마크업 미리보기</b> <span class="def">회색 = 지금, 빨강 = 제안 (승인 전에는 마크업이 안 바뀜)</span><br><img src="/api/${P("gate_png/"+encodeURIComponent(g.png))}" style="max-width:100%;border:1px solid var(--line-l);margin-top:4px;cursor:zoom-in" onclick="window.open(this.src)"></div>`:""}
    <div style="display:flex;gap:8px;margin-top:10px"><button class="btn sm" id="gtok">승인 (체크한 것 반영)</button><button class="btn sm line" id="gtno">취소</button></div>
  </div>`;
}
function review3dBox(rv) {
  const L = rv.last, sm = L.summary, A = rv.answer && rv.answer.dir === L.dir ? rv.answer : null;
  const vd = {}; if (A) A.checked.forEach(c => vd[c.issue_id] = c);
  const VK = {CONFIRMED:["맞음","#e0002a"], FALSE_ALARM:["오탐","#15ad60"], NEEDS_PERSON:["사람 판단","#c77700"]};
  const href = id => `/api/${P("twin_set/"+encodeURIComponent(L.dir))}#find=${encodeURIComponent(id)}`;
  const rows = L.issues.filter(x=>x.rule!=="V09");
  return `<div class="kv"><span>세트 <span class="mono">${esc(L.dir)}</span></span><b style="color:${sm.hold?"#e0002a":"#15ad60"}">HOLD ${sm.hold} · 전체 ${sm.total}</b></div>
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin:6px 0">${Object.entries(sm.by_rule).map(([k,v])=>`<span class="chip ${v.n?"":"g"}" style="font-size:11.5px">${k} ${esc(v.title)} ${v.n}</span>`).join("")}</div>
    <div style="max-height:300px;overflow:auto"><table class="mini"><tr><th>ID</th><th>내용</th><th>제안</th><th>AI</th></tr>
      ${rows.slice(0,150).map(x=>{const c=vd[x.issue_id];return `<tr><td class="mono" style="white-space:nowrap"><a target="_blank" href="${href(x.objects[0])}">${esc(x.issue_id)}</a></td><td style="font-size:12px">${esc(x.detail)}</td><td style="font-size:12px;color:var(--sub)">${esc(x.suggest)}</td>
        <td style="font-size:12px">${c?`<b style="color:${VK[c.verdict][1]}">${VK[c.verdict][0]}</b> ${esc(c.reason)}`:""}</td></tr>`}).join("")}</table></div>
    ${A&&A.added.length?`<div style="margin-top:8px"><b style="font-size:13px">AI 새 지적 ${A.added.length}건</b><table class="mini">${A.added.map(a=>`<tr><td class="mono" style="font-size:12px">${a.objects.map(o=>`<a target="_blank" href="${href(o)}">${esc(o)}</a>`).join(" ")}</td><td>${esc(a.title)} <span class="chip">${esc(a.severity)}</span>${a.unknown_ids&&a.unknown_ids.length?` <span style="color:var(--red);font-size:11px">없는 ID</span>`:""}</td><td style="font-size:12px">${esc(a.reason)}</td></tr>`).join("")}</table></div>`:""}
    ${A&&A.errors.length?`<p style="color:var(--red);font-size:12px">${A.errors.slice(0,8).map(esc).join("<br>")}</p>`:""}
    ${A&&A.overall?`<p class="xnote">AI 총평: ${esc(A.overall)}</p>`:""}
    <div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap"><a class="btn sm line" target="_blank" href="/api/${P("twin_file/"+encodeURIComponent(L.dir)+"/3D_REVIEW_PROMPT.md")}">프롬프트 보기</a>
      <a class="btn sm line" target="_blank" href="/api/${P("twin_file/"+encodeURIComponent(L.dir)+"/3D_REVIEW_PRECHECK.csv")}">사전 점검 CSV</a></div>
    <textarea id="rvtext" placeholder="회사 AI의 답(JSON)을 여기에 붙여 넣기" style="width:100%;height:80px;margin-top:8px;font-family:monospace;font-size:12px"></textarea>
    <button class="btn sm" id="rvsend" style="margin-top:4px">AI 리뷰 답 읽기</button>`;
}
async function renderTwin(m) {

  const rv = await api(P("review3d")).catch(()=>({}));

  m.className = "ext-page";
  const f = d.fit, b = d.base;
  const files = [["00_manifest.json","버전·출처·승인 범위·Gate·미결"],["01_scope.csv","확정 물량 범위 (담당·분류·규격·단위·수량·Rule)"],

    ["04_test_inputs.json","독립 실행 입력 (NORMAL / CHANGED / MISSING / HOLDOUT, 기대값 없음)"],["05_validation.csv","기대값 vs 실행값 (허용차·판정·확인자)"],

    <div style="display:flex;gap:8px"><button class="btn" id="twmk" ${d.model?"":"disabled"}>보강 모델 + 인계 7종 만들기</button></div></div>
  <div style="display:flex;gap:20px;align-items:flex-start">
  <div style="flex:1;min-width:0">
    <div class="panel"><h2>1. 배관 3D 모델 (Seed)</h2>
      <div class="kv"><span>${d.model?`<b class="mono">${esc(d.model)}</b>`:"아직 없음"}</span><label class="btn sm line">${d.model?"다른 파일":"파일 선택 (.html)"}<input type="file" accept=".html,.htm" id="twup" style="display:none"></label></div>
      ${b?`<div style="font-size:12.5px;color:var(--sub);margin-top:6px">${esc(b.title)} · Three.js ${esc(b.three)} · 장비 ${b.equipment} · 랙 ${b.racks.map(r=>`${esc(r.id)}(${r.dir}, 케이블 단 EL ${r.cable_el} m)`).join(", ")}${b.dx_e?` · 로드 시 동쪽 이동 ${b.dx_e} m 반영`:""} · SHA-256 ${esc(b.sha256.slice(0,12))}…</div>`:""}

    ${f?`<div class="panel"><h2>2. 좌표 맞춤 (자동)</h2>
      <p class="xnote">같은 장비 태그 ${f.anchors}개와 랙 중심선 ${f.rack_anchors}개로 PLOT 좌표(pt)를 모델 좌표(m)로 맞췄습니다. 두 PLOT 리비전이 달라 수 m 차이는 정상입니다. 랙 위 트레이는 모델 랙 중심선·케이블 단 EL에 붙입니다.</p>
      <div class="kv"><span>식</span><b class="mono" style="font-size:12px">${esc(f.formula)}</b></div>
      <div class="kv"><span>장비 잔차 중앙값 / 최대</span><b style="color:${f.median_m<=5&&f.max_m<=15?"#15ad60":"#e0002a"}">${f.median_m} m / ${f.max_m} m</b></div>
      <table class="mini" style="margin-top:8px"><tr><th>장비</th><th>ΔX</th><th>ΔZ</th><th>거리 m</th></tr>${f.equipment.slice(0,8).map(r=>`<tr><td class="mono">${esc(r.tag)}</td><td>${r.dx}</td><td>${r.dz}</td><td><b>${r.d}</b></td></tr>`).join("")}</table>
      <table class="mini" style="margin-top:8px"><tr><th>우리 랙</th><th>모델 랙</th><th>중심선 차이 m</th></tr>${f.racks.map(r=>`<tr><td class="mono">${esc(r.ours)}</td><td>${esc(r.model)}</td><td>${r.across_m}</td></tr>`).join("")}</table></div>`:""}
    <div class="panel"><h2>3. 랙 · 차선 · 충돌 (계장 선점, 충돌 시 계장이 비킴)</h2>
      <div class="kv"><span>랙 출처 / 랙 트레이 EL (STEP 6 설정, 물량에 반영)</span><b>${esc(d.rack_src)} · ${esc(d.rack_el_src)}</b></div>
      ${d.model ? `<div style="margin:6px 0 10px"><button class="btn sm" id="twuse">3D 반영 제안 보기 (랙 · 케이블 단 EL · 장비 상자)</button> <span class="def">바로 바꾸지 않습니다. 물량·JB·PLOT 마크업 변화를 먼저 보여 주고, 승인한 것만 반영합니다</span></div>` : ""}
      ${gt.pending?gateBox(gt.pending):""}
      ${gt.log&&gt.log.length?`<details style="margin:6px 0"><summary style="cursor:pointer;font-size:12.5px">결정 기록 (최근 ${gt.log.length})</summary><table class="mini">${gt.log.slice().reverse().map(e=>`<tr><td class="mono" style="font-size:11px;white-space:nowrap">${esc(e.at)}</td><td style="font-size:12px">${esc(e.source)}</td><td style="font-size:12px">${esc(e.what)}</td><td style="font-size:12px">${esc(String(e.before))} → <b>${esc(String(e.after))}</b></td><td style="font-size:12px">${esc(e.approved)}</td></tr>`).join("")}</table></details>`:""}
      ${ckItems(d.schema[0], d.values, d)}
      <div class="kv" style="margin-top:10px"><span>다른 공종 3D 파일 (JSON, 모델 좌표) ${d.other?`<b class="mono">${esc(d.other)}</b>`:"없음"}</span>
        <span style="display:flex;gap:6px"><label class="btn sm line">${d.other?"다른 파일":"올리기 (.json)"}<input type="file" accept=".json" id="twother" style="display:none"></label></span></div>
      <p class="xnote">형식 예: <span class="mono">protocols\other3d_example.json</span> (tray = 중심선 a→b + 폭·높이, box = 모서리 min/max). 전기 파일이 오면 다음 '만들기'에서 계장 트레이가 자동으로 비킵니다.</p>
      ${d.moves && d.moves.moves && d.moves.moves.length ? `<table class="mini"><tr><th>트레이</th><th>피한 것</th><th>조치</th></tr>${d.moves.moves.slice(0,40).map(x=>`<tr><td class="mono">${esc(x.tray)}</td><td class="mono" style="font-size:12px">${esc(x.with.join(", "))}</td><td style="color:${x.action.startsWith("충돌")?"#e0002a":"inherit"}">${esc(x.action)}</td></tr>`).join("")}</table>` : (d.moves && d.moves.other ? `<p class="xnote">최근 세트: ${esc(d.moves.other.discipline)} ${d.moves.other.objects}개와 충돌 없음</p>` : "")}
    </div>
    <div class="panel"><h2>4. AI 3D 리뷰 (사전 점검 → 회사 AI → 사람 판단)</h2>
      <p class="xnote">'만들기' 때 pid_io가 먼저 기하 규칙(V01~V09)으로 점검하고, 회사 AI에게 줄 <span class="mono">3D_REVIEW_PROMPT.md</span> · <span class="mono">3D_REVIEW_ANSWER_SCHEMA.json</span> · <span class="mono">3D_REVIEW_PRECHECK.csv</span>를 세트 폴더에 같이 넣습니다. AI는 항목마다 맞음/오탐/사람 판단으로 답하고, 새 지적은 객체 ID가 있어야 받습니다.</p>
      ${rv.last?review3dBox(rv):`<div class="empty">아직 없음 - 위 '만들기'를 누르면 생깁니다</div>`}
    </div>
    <div class="panel"><h2>5. 만든 인계 세트</h2>
      ${d.sets.length?d.sets.map(st=>`<div class="kv"><span class="mono">${esc(st)}</span><span style="display:flex;gap:6px"><a class="btn sm" target="_blank" data-twopen="${esc(st)}">보강 모델 열기</a></span></div>`).join(""):`<div class="empty">아직 없음</div>`}
      <p class="xnote">세트 폴더: <span class="mono">projects\\${esc(S.project)}\\output\\3D인계_날짜\\</span> - 보강 모델 HTML, 표준 7종, STRUCTURED_MODEL_DATA_FULL.json. 보강 모델은 원본처럼 인터넷(cdn.jsdelivr.net)에서 Three.js를 불러옵니다.</p></div>

  const twset = async body => { try { await post(P("cable"), body); renderTwin(m); } catch(e) { toast(e.message, true); } };

    twset({set:{[it.id]: el.classList.contains("on") ? it.options.find(o=>o!==it.on) : it.on}}); });

  $("#twup").onchange = async () => { const fl = $("#twup").files[0]; if (!fl) return;

  m.querySelectorAll("[data-twopen]").forEach(a => { const st = a.dataset.twopen;
    a.href = `/api/${P("twin_set/"+encodeURIComponent(st))}`; });
  if ($("#rvsend")) $("#rvsend").onclick = async () => { try { const r = await post(P("review3d"), {text: $("#rvtext").value});
      toast(`AI 리뷰 읽음 · 확인 ${r.checked.length} · 새 지적 ${r.added.length}${r.errors.length?` · 오류 ${r.errors.length}`:""}`); renderTwin(m); } catch(e) { toast(e.message, true); } };
  if ($("#twmk")) $("#twmk").onclick = async () => { const bt = $("#twmk"); bt.disabled = true; bt.textContent = "만드는 중…";
    try { const r = await post(P("twin"), {}); toast(`${r.dir} 생성 · 계기 ${r.counts.instruments} · 트레이 ${r.counts.trays} · 서포트 ${r.counts.supports} · 잔차 ${r.fit.median_m} m${r.moves?` · 회피 ${r.moves - r.left} · 충돌 남음 ${r.left}`:""}`); renderTwin(m); }
    catch(e) { toast(e.message, true); if ($("#twmk")) { $("#twmk").disabled = false; $("#twmk").textContent = "보강 모델 + 인계 7종 만들기"; } } };
}

api("font").then(f => { const k = Object.keys(f.found||{}); $("#fontst").innerHTML = k.length
  ? `글꼴: 현대하모니 ${k.join("·")} ✓` : `글꼴: 현대하모니 없음 → 맑은 고딕<br>(앱 폴더 <span class="mono">fonts</span>에 ttf/otf를 넣고 재실행)`; }).catch(()=>{});
render();
