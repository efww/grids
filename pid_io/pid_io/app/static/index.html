<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>계장 개념설계 IO 산출</title>
<style>
/*FONTFACE*/
:root{
  --green:#15ad60; --green-d:#1c5438; --green-l:#e7f6ee; --ink:#111111; --sub:#666666; --mute:#999999;
  --line:#dcdcdc; --line-l:#ececec; --bg:#ededed; --panel:#ffffff; --dark:#222222;
  --red:#d1335d; --purple:#7e66cb; --blue:#4fa1e0; --yellow:#ffba00; --chg:#fff5d6;
  --font:"HDHarmonyApp","Hyundai Harmony L","HyundaiHarmonyL","현대하모니 L","Hyundai Harmony","HyundaiHarmony","Malgun Gothic","Apple SD Gothic Neo","Noto Sans CJK KR",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}
button,input,select{font:inherit;color:inherit}
a{color:var(--green-d)}
/* top bar */
.top{height:58px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px;gap:14px;position:sticky;top:0;z-index:10}
.mark{width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;border-bottom:19px solid var(--green)}
.brand{font-size:18px;letter-spacing:-.01em}
.brand b{font-weight:700}
.brand span{color:var(--mute);font-size:12.5px;margin-left:10px;letter-spacing:.04em}
.top .proj{margin-left:auto;display:flex;align-items:center;gap:10px;color:var(--sub);font-size:13px}
.top .proj b{color:var(--ink);font-weight:700}
/* layout */
.wrap{display:flex;min-height:calc(100vh - 58px)}
nav{width:220px;background:#fff;border-right:1px solid var(--line);padding:22px 0;flex:none}
nav .st{display:flex;align-items:center;gap:12px;padding:12px 24px;color:var(--sub);cursor:pointer;border-left:3px solid transparent;font-size:15px}
nav .st i{font-style:normal;width:24px;height:24px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--mute);flex:none}
nav .st.on{color:var(--ink);font-weight:700;border-left-color:var(--green);background:var(--green-l)}
nav .st.on i{background:var(--green);color:#fff;border-color:var(--green)}
nav .st.done i{border-color:var(--green);color:var(--green)}
nav .st.dis{opacity:.45;pointer-events:none}
/* STEP 6+ : extension modules (cable ...) in blue */
nav .st.ext{margin-top:10px;border-top:1px dashed var(--line);color:#2c7fc0}
nav .st.ext i{border-color:var(--blue);color:#2c7fc0}
nav .st.ext.on{border-left-color:var(--blue);background:#eaf4fc;color:#111}
nav .st.ext.on i{background:var(--blue);border-color:var(--blue);color:#fff}
.ext-page .eyebrow{color:#2c7fc0}
.ext-page .uline{border-bottom-color:var(--blue)}
.ext-page .tabs a.on{border-bottom-color:var(--blue)}
.ext-page .btn:not(.line){background:var(--blue);border-color:var(--blue)}
.ext-page .btn:not(.line):hover{background:#2c7fc0;border-color:#2c7fc0}
.ext-page .tog.on{background:var(--blue)}
nav .foot{margin:26px 24px 0;padding-top:16px;border-top:1px solid var(--line-l);font-size:12px;color:var(--mute);line-height:1.7}
main{flex:1;padding:30px 34px 60px;min-width:0}
.head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px;gap:20px}
.eyebrow{font-size:12.5px;color:var(--green);font-weight:700;letter-spacing:.08em;margin-bottom:6px}
h1{font-size:32px;font-weight:300;letter-spacing:-.02em;line-height:1.2}
h2{font-size:17px;font-weight:700;margin-bottom:12px}
.lead{color:var(--sub);margin-top:6px}
.panel{background:#fff;border:1px solid var(--line);padding:20px 22px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g5{grid-template-columns:repeat(5,1fr)}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--green);color:#fff;border:1px solid var(--green);padding:10px 20px;cursor:pointer;font-weight:700;font-size:14px}
.btn{white-space:nowrap}
.kv>*:last-child{white-space:nowrap;margin-left:14px}
.btn:hover{background:var(--green-d);border-color:var(--green-d)}
.btn.line{background:#fff;color:var(--ink);border-color:#111}
.btn.line:hover{background:#111;color:#fff}
.btn.sm{padding:6px 12px;font-size:13px}
.btn[disabled]{opacity:.4;pointer-events:none}
.chip{display:inline-block;font-size:12px;padding:2px 9px;border:1px solid var(--line);color:var(--sub);white-space:nowrap}
.chip.g{border-color:var(--green);color:var(--green)} .chip.r{border-color:var(--red);color:var(--red)}
.chip.y{border-color:#e0a400;color:#b78600} .chip.p{border-color:var(--purple);color:var(--purple)} .chip.b{border-color:var(--blue);color:#2c7fc0}
.chip.fill{background:var(--green);border-color:var(--green);color:#fff}
.stat .k{font-size:12.5px;color:var(--sub)}
.stat .v{font-size:34px;font-weight:300;line-height:1.15;letter-spacing:-.02em}
.stat .v small{font-size:14px;color:var(--sub);margin-left:4px}
.uline{border-bottom:2px solid var(--green);display:inline-block;padding-bottom:2px}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line-l);font-size:13.5px;vertical-align:middle}
th{font-size:12px;color:var(--sub);font-weight:700;border-bottom:1px solid #111}
tr.click{cursor:pointer} tr.click:hover td{background:#f7faf8}
.mono{font-family:Consolas,"D2Coding",monospace;font-size:12.5px}
.empty{color:var(--mute);padding:40px;text-align:center;border:1px dashed var(--line);background:#fafafa}
input[type=text],input[type=number],select{border:1px solid #bbb;background:#fff;padding:7px 10px;border-radius:0;min-width:0}
input[type=number]{width:90px;text-align:right}
select{padding-right:26px}
/* file cards */
.fcard{background:#fff;border:2px dashed #c8c8c8;display:flex;flex-direction:column;min-height:170px;transition:border-color .15s,background .15s}
.fcard .hd{display:flex;align-items:center;gap:10px;padding:12px 16px;font-weight:700;font-size:15px}
.fcard .hd .ic{width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-size:16px;flex:none;border:2px solid currentColor;border-radius:50%}
.fcard .hd .st{margin-left:auto;font-size:12.5px;font-weight:700;padding:3px 10px}
.fcard .bd{padding:4px 16px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
.fcard .n{font-size:13px;color:var(--sub);word-break:break-all;flex:1}
.fcard .fn{font-size:13.5px;color:var(--ink);font-weight:700;word-break:break-all}
.fcard .meta{font-size:12px;color:var(--sub)}
.fcard .er{font-size:12.5px;color:var(--red);background:#fdecef;padding:8px 10px;line-height:1.45}
.fcard.need .hd{color:var(--red)} .fcard.need .hd .st{background:#fdecef;color:var(--red)}
.fcard.opt .hd{color:#777} .fcard.opt .hd .st{background:#f1f1f1;color:#777}
.fcard.ok{border:2px solid var(--green);background:#f6fcf8}
.fcard.ok .hd{background:var(--green);color:#fff} .fcard.ok .hd .st{background:#fff;color:var(--green-d)}
.fcard.busy{border:2px solid var(--blue)} .fcard.busy .hd{color:#2c7fc0}
.fcard.bad{border:2px solid var(--red)}
.fcard.drag{border-color:var(--green);background:var(--green-l)}
.fcard label{align-self:flex-start}
.fcard input[type=file]{display:none}
.g7{grid-template-columns:repeat(7,minmax(0,1fr))}
.item .xtra{grid-column:2/-1;padding:4px 0 6px}
.xnote{font-size:12.5px;color:var(--sub);margin:4px 0 8px;line-height:1.6}
table.mini th,table.mini td{padding:6px 8px;font-size:12.5px}
.typ{margin-top:12px;padding:12px;border:1px solid var(--line-l);background:#fff}
.pager{display:flex;justify-content:space-between;align-items:center;margin-top:18px;padding-top:14px;border-top:1px solid var(--line-l)}
.dec{margin-top:12px;border-top:1px solid var(--line-l);padding-top:12px;display:flex;flex-direction:column;gap:10px}
.dec .drow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.aiopt{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--line);margin-bottom:8px;cursor:pointer}
.aiopt.on{border-color:var(--green);background:var(--green-l)}
details summary::marker{color:var(--green)}
.hint{font-size:12.5px;color:var(--red);margin-top:6px;text-align:right}
.prog{height:6px;background:#e3e3e3;overflow:hidden}
.prog i{display:block;height:100%;background:var(--green);transition:width .3s}
/* checklist */
.tabs{display:flex;gap:0;border-bottom:1px solid #111;margin-bottom:0;flex-wrap:wrap}
.tabs a{padding:10px 14px;cursor:pointer;color:var(--sub);text-decoration:none;font-size:13.5px;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs a.on{color:var(--ink);font-weight:700;border-bottom-color:var(--green)}
.tabs a .cnt{font-size:11px;background:var(--yellow);color:#111;padding:0 5px;margin-left:4px}
.item{display:grid;grid-template-columns:48px 1fr 230px;gap:14px;align-items:center;padding:13px 6px;border-bottom:1px solid var(--line-l)}
.item.chg{background:var(--chg)}
.item.plan{opacity:.55}
.item .id{font-family:Consolas,monospace;color:var(--mute);font-size:12px}
.item .nm{font-size:14.5px}
.item .ef{font-size:12px;color:var(--sub);margin-top:2px}
.item .ctl{display:flex;justify-content:flex-end;align-items:center;gap:8px}
.item .def{font-size:11.5px;color:var(--mute)}
.tog{width:44px;height:22px;background:#c9c9c9;position:relative;cursor:pointer;flex:none;border:0}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;background:#fff;transition:left .15s}
.tog.on{background:var(--green)} .tog.on::after{left:25px}
.side{width:340px;flex:none;position:sticky;top:78px;align-self:flex-start;display:flex;flex-direction:column;gap:14px}
.bar{display:flex;height:16px;background:#eee}
.bar span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--sub);margin-top:8px}
.legend i{display:inline-block;width:9px;height:9px;margin-right:5px}
.kv{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--line-l);font-size:13px}
.kv:last-child{border:0}
.delta-n{color:var(--green-d);font-weight:700} .delta-p{color:var(--red);font-weight:700}
/* review */
.viewer{background:#fff;border:1px solid var(--line);position:relative;overflow:auto;height:calc(100vh - 230px)}
.viewer img{display:block;transform-origin:0 0}
.hl{position:absolute;border:3px solid var(--red);box-shadow:0 0 0 3000px rgba(0,0,0,.08);pointer-events:none}
.rlist{height:calc(100vh - 290px);overflow:auto;border:1px solid var(--line);background:#fff}
.ritem{padding:10px 12px;border-bottom:1px solid var(--line-l);cursor:pointer}
.ritem:hover{background:#f7faf8} .ritem.on{background:var(--green-l);border-left:3px solid var(--green)}
.ritem .a{display:flex;justify-content:space-between;gap:8px}
.ritem .b{font-size:12px;color:var(--sub);margin-top:3px}
.thumb{width:92px;height:92px;flex:none;object-fit:contain;background:#fff;border:1px solid var(--line);cursor:zoom-in}
#bigview{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:60}
#bigview .bigbox{background:#fff;padding:14px;max-width:80vw;max-height:86vh;display:flex;flex-direction:column;gap:8px;border-top:4px solid var(--green)}
#bigview img{max-width:76vw;max-height:76vh;object-fit:contain}
#bigview .cap{font-size:12.5px;color:var(--sub);cursor:pointer}
.toast{position:fixed;right:24px;bottom:24px;background:#111;color:#fff;padding:12px 18px;font-size:13.5px;z-index:50;display:none;max-width:420px}
.toast.err{background:var(--red)}
.hidden{display:none!important}
.dot{display:inline-block;width:8px;height:8px;margin-right:6px}
.nw th,.nw td{white-space:nowrap}.nw td:last-child{white-space:normal}
</style>
</head>
<body>
<div class="top">
  <div class="mark"></div>
  <div class="brand"><b>계장 개념설계</b> IO 산출<span>INSTRUMENTATION · CONCEPT I/O</span></div>
  <div class="proj"><span>프로젝트</span><b id="pname">선택 안 됨</b><span id="phome" class="mono"></span></div>
</div>
<div class="wrap">
  <nav id="nav">
    <div class="st" data-s="projects"><i>1</i>프로젝트</div>
    <div class="st" data-s="extract"><i>2</i>입력 · 추출</div>
    <div class="st" data-s="concept"><i>3</i>개념 체크리스트</div>
    <div class="st" data-s="review"><i>4</i>검토</div>
    <div class="st" data-s="output"><i>5</i>출력</div>
    <div class="st ext" data-s="cable"><i>6</i>케이블 · JB<span class="chip" style="margin-left:auto;font-size:10.5px;padding:0 6px">확장</span></div>
    <div class="st" data-s="ai" style="margin-top:14px;border-top:1px solid var(--line-l)"><i>AI</i>AI 연결 설정</div>
    <div class="foot">도면 인식은 한 번,<br>체크리스트를 바꾸면 IO가<br>즉시 다시 계산됩니다.<br><br><span class="mono">IO 1점 = 인덱스 1행</span><br><br><span id="fontst"></span></div>
  </nav>
  <main id="main"></main>
</div>
<div class="toast" id="toast"></div>

<script>
const ORIGIN_COLOR = {"도면인식":"#4fa1e0","Typical파생":"#15ad60","트레인복제":"#ffba00","대수복제":"#f08a24","장비Typical":"#7e66cb","패키지":"#d1335d","스페어":"#a8a8a8"};
const S = {tok:0, rview:"todo", showPage:false, warmed:false, project:null, screen:"projects", state:null, concept:null, tab:0, summary:null, review:null, sel:null, reason:"", page:null, impact:null};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = n => (n ?? 0).toLocaleString("ko-KR");

async function api(path, opt={}) {
  const r = await fetch("/api/" + path, opt);
  const ct = r.headers.get("content-type") || "";
  const body = ct.includes("json") ? await r.json() : await r.blob();
  if (!r.ok) throw new Error(body.error || r.statusText);
  return body;
}
const post = (path, data) => api(path, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(data||{})});
const P = p => `p/${encodeURIComponent(S.project)}/${p}`;
function toast(msg, err) { const t=$("#toast"); t.textContent=msg; t.className="toast"+(err?" err":""); t.style.display="block"; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display="none", err?6000:2500); }

function go(screen) { S.tok++; S.screen = screen; if (screen === "cable") CK.data = null; $("#main").className = ""; render(); }
document.querySelectorAll("#nav .st").forEach(el => el.onclick = () => go(el.dataset.s));

function navState() {
  const ex = S.state && S.state.extracted;
  document.querySelectorAll("#nav .st").forEach(el => {
    const s = el.dataset.s;
    el.classList.toggle("on", s === S.screen);
    el.classList.toggle("dis", (!S.project && !["projects","ai"].includes(s)) || (!ex && ["concept","review","output","cable"].includes(s)));
    el.classList.toggle("done", (s==="projects" && S.project) || (s==="extract" && ex));
  });
  $("#pname").textContent = S.project || "선택 안 됨";
}

async function loadState() { if (S.project) S.state = await api(P("")); navState(); }

async function render() {
  navState();
  const m = $("#main"), t = S.tok;
  try {
    if (S.screen === "projects") return await renderProjects(m);
    if (S.screen === "ai") return await renderAISettings(m);
    await loadState();
    if (t !== S.tok) return;                 // user moved to another screen meanwhile
    if (S.screen === "extract") return await renderExtract(m);
    if (S.screen === "concept") return await renderConcept(m);
    if (S.screen === "review") return await renderReview(m);
    if (S.screen === "output") return await renderOutput(m);
    if (S.screen === "cable") return await renderCable(m);
  } catch (e) { toast(e.message, true); }
}

/* ---------------------------------------------------------------- 1 projects */
async function renderProjects(m) {
  const t = S.tok;
  const d = await api("projects");
  if (t !== S.tok) return;
  $("#phome").textContent = "";
  m.innerHTML = `
  <div class="head"><div><div class="eyebrow">STEP 1</div><h1>프로젝트</h1>
    <p class="lead">프로젝트마다 도면, 양식, 체크리스트, 결과가 폴더 하나에 저장됩니다. <span class="mono">${esc(d.home)}</span></p></div></div>
  <div class="grid" style="grid-template-columns:2fr 1fr">
    <div class="panel">
      <h2>프로젝트 목록</h2>
      ${d.projects.length ? `<table><tr><th>이름</th><th>생성</th><th>P&amp;ID</th><th>추출</th><th></th></tr>
      ${d.projects.map(p => `<tr class="click" data-n="${esc(p.name)}"><td><b>${esc(p.name)}</b></td><td>${esc(p.created||"")}</td>
        <td class="mono">${esc(p.files.pdf||"-")}</td><td>${p.extracted?`<span class="chip g">${esc(p.extracted)}</span>`:`<span class="chip">대기</span>`}</td>
        <td style="text-align:right"><span class="btn sm line">열기</span></td></tr>`).join("")}</table>`
      : `<div class="empty">아직 프로젝트가 없습니다. 오른쪽에서 새로 만드세요.</div>`}
    </div>
    <div class="panel">
      <h2>새 프로젝트</h2>
      <p class="lead" style="margin-bottom:14px">회사 표준 체크리스트(기본값)가 복사되어 시작합니다.</p>
      <input type="text" id="newname" placeholder="예: 서남해 200MW 수전해" style="width:100%;margin-bottom:12px">
      <button class="btn" id="mk">만들기</button>
    </div>
  </div>`;
  m.querySelectorAll("tr.click").forEach(tr => tr.onclick = () => { S.project = tr.dataset.n; S.summary=null; S.concept=null; S.review=null; S.impact=null; S.warmed=false; S.sel=null; go("extract"); });
  $("#mk").onclick = async () => {
    const n = $("#newname").value.trim(); if (!n) return toast("이름을 입력하세요", true);
    try { await post("projects", {name:n}); S.project = n; go("extract"); } catch(e) { toast(e.message, true); }
  };
}

/* ---------------------------------------------------------------- 2 extract */
const UP = {};      // kind -> {busy, pct, err}
function fileCard(kind, title, desc, required) {
  const f = (S.state.meta.files||{})[kind];
  const fi = (S.state.meta.file_info||{})[kind] || {};
  const u = UP[kind] || {};
  const cls = u.busy ? "busy" : (f ? "ok" : (u.err ? "bad " + (required ? "need" : "opt") : (required ? "need" : "opt")));
  const info = kind==="pdf" && S.state.meta.pdf_info ? ` · ${S.state.meta.pdf_info.pages}p · ${S.state.meta.pdf_info.vector?"벡터":"스캔(미지원)"}` : "";
  const st = u.busy ? `업로드 중 ${u.pct||0}%` : (f ? "업로드 완료" : (required ? "필수 · 미업로드" : "선택 · 미업로드"));
  const ic = u.busy ? "↑" : (f ? "✓" : (required ? "!" : "+"));
  return `<div class="fcard ${cls}" data-drop="${kind}">
    <div class="hd"><span class="ic">${ic}</span>${title}<span class="st">${st}</span></div>
    <div class="bd">
      ${f ? `<div class="fn">${esc(f)}</div><div class="meta">${fi.size?(fi.size/1024/1024).toFixed(1)+"MB · ":""}${esc(fi.time||"")}${info}</div>`
          : `<div class="n">${desc}<br><span style="font-size:12px;color:var(--mute)">버튼을 누르거나 파일을 여기로 끌어 놓으세요</span></div>`}
      ${u.busy ? `<div class="prog"><i style="width:${u.pct||0}%"></i></div>` : ""}
      ${u.err ? `<div class="er">✕ ${esc(u.err)}</div>` : ""}
      <label class="btn sm ${f?"line":""}">${f?"다른 파일로 바꾸기":"파일 선택"}<input type="file" data-k="${kind}" accept="${kind==="pdf"?".pdf":".xlsx"}"></label>
    </div>
  </div>`;
}
function readErr(e) {
  const n = (e && e.name) || "";
  if (n === "NotReadableError" || n === "NotFoundError" || /Failed to fetch|NetworkError|network/i.test(String(e && e.message)))

}
async function uploadFile(kind, f) {
  UP[kind] = {busy:true, pct:0};
  if (S.screen === "extract") renderExtract($("#main"));
  let buf;
  try { buf = await f.arrayBuffer(); }
  catch (e) { UP[kind] = {err: readErr(e)}; return S.screen === "extract" && renderExtract($("#main")); }
  await new Promise(res => {
    const x = new XMLHttpRequest();
    x.open("POST", "/api/" + P("upload?kind=" + kind));
    x.setRequestHeader("X-Filename", encodeURIComponent(f.name));
    x.upload.onprogress = ev => { if (ev.lengthComputable) { UP[kind].pct = Math.round(100*ev.loaded/ev.total);
      const c = document.querySelector(`[data-drop="${kind}"]`); if (c) { const i = c.querySelector(".prog i"); if (i) i.style.width = UP[kind].pct+"%";
        const st = c.querySelector(".st"); if (st) st.textContent = `업로드 중 ${UP[kind].pct}%`; } } };
    x.onload = () => { let b = {}; try { b = JSON.parse(x.responseText); } catch(e) {}
      UP[kind] = x.status < 300 ? {} : {err: b.error || ("서버 오류 " + x.status)}; res(); };
    x.onerror = () => { UP[kind] = {err: "서버와 연결이 끊겼습니다. 실행 창(검은 창)이 켜져 있는지 확인하고 다시 시도하세요."}; res(); };
    x.send(buf);
  });
  S.concept = null;
  if (!UP[kind].err) toast("업로드 완료");
  await loadState(); if (S.screen === "extract") renderExtract($("#main"));
}

function focusItem(x) {

  const place = () => {
    const [cx, cy] = x.coord.split(",").map(Number);
    const k = 60/72, r = 30*k;
    hl.style.left = (cx*k - r) + "px"; hl.style.top = (cy*k - r) + "px";

  return files + `<div style="display:flex;gap:16px;align-items:flex-start">
    <div style="width:330px;flex:none">
      <div class="panel" style="padding:0">${qs}
        <div class="ritem" style="cursor:default"><div class="a"><b>계기 위치</b></div><div class="b">장비 태그 위치 ${fmt(pp.located["장비"])} · 추정 ${fmt(pp.located["추정"])} (시트 장비 중심·반복 배치) · 미정 ${fmt(pp.unlocated)}<br>PLOT 장비 글자 ${fmt(pp.equipment)}개</div></div>
        <div class="ritem" style="cursor:default"><div class="a"><b>PLOT 길이 적용</b></div><div class="b">${fmt(s.by_plot||0)} / ${fmt(s.cables)}가닥${d.values.plot_use!=="사용"?" · 지금은 '가정 길이만' 설정":""}</div></div>
      </div>
      <div class="legend" style="margin-top:10px"><span><i style="background:#15ad60"></i>계기(장비 위치)</span><span><i style="background:#9aa"></i>계기(추정)</span><span><i style="background:#f08a24"></i>JB</span><span><i style="background:#d1335d"></i>패키지 제어반</span><span><i style="background:#2c7fc0"></i>제어실 · 랙</span><span><i style="background:#7e66cb"></i>IRP</span></div>
      <p class="xnote">선은 랙을 우선 타고 장비를 피해 가는 경로 초안입니다 (장애물 ${fmt(pp.obstacles)}개). 높이(랙 EL, UG/AG)는 '경로 · 높이 (Z)' 탭 값으로 더합니다.</p>
    </div>
    <div class="viewer" style="flex:1;height:calc(100vh - 260px);cursor:${PL.pick?"crosshair":"default"}">
      <div style="position:relative;width:100%;max-width:${Math.round(pp.size[0]*50/72)*2}px" id="plwrap"><img src="/api/${P("plot_png")}?v=${encodeURIComponent(pp.file)}" style="width:100%;display:block" id="plimg">${plotOverlay(pp)}</div>
    </div></div>`;
}
function bindPlot(m, upd) {
  m.querySelectorAll("[data-plup]").forEach(inp => inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    toast("올리는 중… PLOT PLAN 읽기는 몇 초 걸립니다");
    try { await api(P("upload?kind="+inp.dataset.plup), {method:"POST", headers:{"X-Filename":encodeURIComponent(f.name)}, body:f}); upd({}); }
    catch(e) { toast(e.message, true); } });
  m.querySelectorAll("[data-plok]").forEach(b => b.onclick = () => plotPost({confirm:b.dataset.plok}, m));
  m.querySelectorAll("[data-plpick]").forEach(b => b.onclick = () => { PL.pick = PL.pick===b.dataset.plpick ? null : b.dataset.plpick; PL.pts = []; renderCable(m); });
  m.querySelectorAll("[data-rkdel]").forEach(a => a.onclick = () => plotPost({rack_del:+a.dataset.rkdel}, m));
  const rd = $("#plrkdone"); if (rd) rd.onclick = () => { if ((PL.pts||[]).length < 2) return toast("두 점 이상 찍어 주세요", true); const pts = PL.pts; PL.pick = null; PL.pts = []; plotPost({rack_add: pts}, m); };
  const ru = $("#plrkundo"); if (ru) ru.onclick = () => { (PL.pts||[]).pop(); renderCable(m); };
  const rc = $("#plrkcancel"); if (rc) rc.onclick = () => { PL.pick = null; PL.pts = []; renderCable(m); };
  const sb = $("#plscaleb"); if (sb) sb.onclick = () => { const n = +$("#plscale").value; if (!n) return toast("축척 1:N의 N을 입력하세요", true); plotPost({scale_n:n}, m); };
  const w = $("#plwrap"); if (w) w.onclick = e => {
    if (!PL.pick || !CK.data.plot) return;
    const r = w.getBoundingClientRect(), [W,H] = CK.data.plot.size;
    const x = (e.clientX - r.left) / r.width * W, y = (e.clientY - r.top) / r.height * H;
    if (PL.pick === "rackdraw") { PL.pts = (PL.pts||[]).concat([[x, y]]); renderCable(m); return; }
    if (PL.pick === "racktoggle") { const i = (CK.data.plot.racks||[]).findIndex(r => x>=r[0]-3 && x<=r[2]+3 && y>=r[1]-3 && y<=r[3]+3);
      if (i < 0) return toast("랙 위를 눌러 주세요", true); PL.pick = null; plotPost({rack_toggle: i}, m); return; }
    const k = PL.pick; PL.pick = null; plotPost({[k]: [x, y]}, m); };
}
async function plotPost(body, m) {
  try { CK.data = await post(P("plot"), body); CK.data._p = S.project; if (S.screen==="cable") renderCable(m); } catch(e) { toast(e.message, true); }
}

async function renderCable(m) {
  const t = S.tok;
  if (!CK.data || CK.data._p !== S.project) { CK.data = await api(P("cable")); CK.data._p = S.project; }
  if (t !== S.tok) return;
  const d = CK.data, G = d.schema, V = d.values;
  if (CK.tab >= G.length || CK.tab < -1) CK.tab = 0;
  const g = G[Math.max(0, CK.tab)];
  m.className = "ext-page";
  m.innerHTML = `
  <div class="head"><div><div class="eyebrow">STEP 6</div><h1>케이블 · JB</h1>
    <p class="lead">만들어진 인덱스의 IO로 분기 케이블, JB, 멀티 케이블을 뽑습니다. PLOT PLAN이 있으면 도면 좌표로, 없으면 가정 길이로 계산합니다. (변경 ${d.changed}건)</p></div>
    <div style="display:flex;gap:8px"><button class="btn line" id="ckreset">기본값으로</button><button class="btn" id="ckmk">케이블 엑셀 만들기</button></div></div>
  <div style="display:flex;gap:20px;align-items:flex-start">
    <div style="flex:1;min-width:0">
      <div class="panel">
        <div class="tabs">${G.map((x,i)=>`<a class="${i===CK.tab?"on":""}" data-ckt="${i}">${esc(x.title)}</a>`).join("")}<a class="${CK.tab===-1?"on":""}" data-ckt="-1">PLOT PLAN 초안${d.plot?` <span class="chip b" style="font-size:10.5px;padding:0 5px">${fmt(d.summary.by_plot||0)}</span>`:""}</a></div>
        ${CK.tab === -1 ? `<div style="margin-top:12px">${plotTab(d)}</div>` : `<p class="xnote" style="margin-top:10px">${esc(g.lead)}</p>
        ${g.id === "branch" ? ckBranch(g, V) : ckItems(g, V, d)}`}
      </div>
      ${ckTables(d)}
    </div>
    <div class="side">${ckSide(d)}</div>
  </div>`;
  const upd = async body => { try { CK.data = await post(P("cable"), body); CK.data._p = S.project; if (S.screen==="cable") renderCable(m); } catch(e) { toast(e.message, true); } };
  m.querySelectorAll("[data-ckt]").forEach(a => a.onclick = () => { CK.tab = +a.dataset.ckt; PL.pick = null; renderCable(m); });
  bindPlot(m, upd);
  m.querySelectorAll("[data-ckv]").forEach(a => a.onclick = () => { CK.view = a.dataset.ckv; renderCable(m); });
  m.querySelectorAll("[data-ck]").forEach(el => el.onchange = () => upd({set:{[el.dataset.ck]: el.value}}));
  m.querySelectorAll("[data-cktog]").forEach(el => el.onclick = () => { const it = G.flatMap(x=>x.items).find(x=>x.id===el.dataset.cktog);
    upd({set:{[it.id]: el.classList.contains("on") ? it.options.find(o=>o!==it.on) : it.on}}); });
  m.querySelectorAll("[data-trunk]").forEach(el => el.onchange = () => upd({trunk:{[el.dataset.trunk]: el.value}}));
  $("#ckreset").onclick = () => { if (confirm("케이블 설정을 모두 기본값으로 되돌릴까요?")) upd({reset:true}); };
  if ($("#ckload")) $("#ckload").onclick = () => { if (confirm(`'${$("#ckpre").value}' 프리셋으로 설정을 바꿀까요? (유닛별 길이는 유지)`)) upd({preset_load: $("#ckpre").value}); };
  $("#cksave").onclick = async () => { const n = $("#ckname").value.trim(); if (!n) return toast("프리셋 이름을 입력하세요", true); await upd({preset_save:n}); toast("프리셋을 저장했습니다"); };
  $("#ckmk").onclick = async () => { const b = $("#ckmk"); b.disabled = true; b.textContent = "만드는 중…";
    try { const r = await post(P("cable_export"), {}); toast(r.files.join(", ") + " 생성 · 5 출력 화면에서 받을 수 있습니다"); }
    catch(e) { toast(e.message, true); }
    if ($("#ckmk")) { $("#ckmk").disabled = false; $("#ckmk").textContent = "케이블 엑셀 만들기"; } };
}

api("font").then(f => { const k = Object.keys(f.found||{}); $("#fontst").innerHTML = k.length
  ? `글꼴: 현대하모니 ${k.join("·")} ✓` : `글꼴: 현대하모니 없음 → 맑은 고딕<br>(앱 폴더 <span class="mono">fonts</span>에 ttf/otf를 넣고 재실행)`; }).catch(()=>{});
render();
</script>
</body>
</html>
