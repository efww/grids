[package]
name = "grids"
version = "0.7.6"
edition = "2021"
description = "Fast multi-pane file manager for Windows"
license = "MIT"
repository = "https://github.com/efww/grids"
publish = false

[dependencies.windows]
version = "0.62"
features = [
    "Data_Pdf",
    "Foundation",
    "Storage",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_EnhancedStorage",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_RestartManager",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
]

# batch rename's regular expressions: the small pure-Rust one, no Unicode tables
[dependencies.regex-lite]
version = "0.1"

[dependencies.windows-core]
version = "0.62"

# inflate for ZIP-based documents in the preview (docx, xlsx, pptx, hwpx, odt): pure Rust, no C
[dependencies.miniz_oxide]
version = "0.8"
default-features = false
features = ["with-alloc"]

# HWP/HWPX pages in the preview (hwpdoc.rs): the rhwp document engine, without its PDF import and JS facade
[dependencies.rhwp]
version = "=0.9.0"
default-features = false

# the same font list rhwp loads, to find fonts it would pick by name but cannot draw (hwpdoc.rs)
[dependencies.fontdb]
version = "0.23"
default-features = false
features = ["std", "fs", "memmap"]

[dependencies.ttf-parser]
version = "0.25"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "unwind" # rhwp runs behind catch_unwind: a document it trips on must not close the window
strip = true
