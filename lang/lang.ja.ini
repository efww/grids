help_explorer = F2, Del, Ctrl+C/X/V, F5\tエクスプローラーと同じ。F5 はウィンドウのどこからでもアクティブなペインを再読み込みし、ネットワーク フォルダーのエラーではそのパスを再試行\nCtrl+V\tコピーした画像（スクリーンショット、ブラウザーの画像）があれば、このフォルダーに PNG として保存\nSpace\tクイックルック。F3 と同じです。入力から 1 秒以内、または日本語・韓国語の変換中のスペースは名前の一部になります。設定 → ペインと表示でオフにできます\nEnter\tクイックルックで: 表示中のファイルを既定のアプリで開き、プレビューを閉じる\nShift+Enter\tクイックルックで: 表示中のファイルを別のアプリで開く。右クリックも同じ\n\n
help_notes = アドレス バー: パスのフォルダーをクリックするとそこへ移動。› で中のフォルダー一覧。現在のフォルダーか空き、または Ctrl+L でパスを入力\nレイアウト ボタン: クリックで均等配置、押したままドラッグで列ごとの行数（方向キー+Enter も可）\n⇄ ボタン: 選択したフォルダー（なければ現在のフォルダー）を別ペインで開く。列の順序・幅・並べ替えと表示も引き継ぐ。または選択したファイルを別ペインのフォルダーへコピー / 移動（最大 10,000 個）。ペインが一つのときは左右に均等に分け（新しいペインは右）、そのフォルダーをそこで開く。選択がなければ現在のフォルダーを複製する。ファイルだけが選択されているときも現在のフォルダーを複製し、ファイルはコピー / 移動しない\n保存 (Ctrl+S): このタブを保存（ペインの配置、フォルダー、表示、色ラベル）。緑の点 = このタブの未保存のレイアウト変更（フォルダー移動は含まない）\nセッションを開く: 保存したタブを現在のタブの隣に新しいタブで開きます。まとめて開くは選んだセッションをそれぞれタブにします\nスプリッターをダブルクリック: 均等に分割\nペインの見出しを右クリック: ペインの色 (セッションに保存、タブの色とは別)\nペイン タブ: 一つのペインの中のフォルダーです。ウィンドウ上部のタブとは別です。フォルダーが一つならタブ列は隠れ、⇄ の右のボタンでタブを追加します（Ctrl+Alt+T）。二つ以上でタブ列が出ます。既定は Ctrl+Alt+W / Ctrl+Alt+PageDown / Ctrl+Alt+PageUp で、フォーカスがそのペインにあるときだけ動きます。+、×、中クリック、空いた列のダブルクリックも使えます\n引数: maguro.exe C:\\a D:\\b ... または maguro.exe work.maguro\nCtrl+Alt+C はアクティブなペインのフォルダーを次のペインと WinMerge で比較します。歯車メニューとファイル一覧では、選んだ二つのファイル、または別のペインの同じ名前とも比較できます。WinMerge のパスは設定 → 一般で指定します。\nすでに起動している場合は、そのプロセスに新しいウィンドウを開きます。単一ウィンドウがオンのときは、そのウィンドウを前面にし、パスはタブで開きます。\nペイン番号: ドラッグでペインを移動します。Ctrl を押したままドラッグすると、今のペイン タブをコピーします。端に置くと分割（自分の端でも可）、中央に置くとそのセルのペイン タブになります。赤いプレビューは上限超えです（列 4、1 列の行 4、ペイン 16）。ドラッグ中に Ctrl を離すと移動に戻ります
