help_body_getting_started = Maguro は Windows 向けの速いマルチペイン ファイル マネージャーです。ペイン 1 つがフォルダー 1 つです。いくつか並べたり格子にしたりして、別のソフトなしでコピー、移動、比較ができます。\n\nスタート メニューかコマンドラインから起動します。maguro.exe の後にフォルダーのパスを書くとそのフォルダーが開きます。.maguro ファイルは保存したセッションを開きます。\n\nアドレス バーが現在のフォルダーです。パスの名前をクリックするとそこへ移動します。山括弧で中のフォルダーを一覧します。現在のフォルダーか余白をクリックするか、Ctrl+L、Alt+D、F4 でパスを入力します。\n\nツール バーにはレイアウト、保存、セッションを開く、お気に入りがあります。ドライブ文字はタブ列に出せます。ステータス バーは選択数と空き容量を出します。\n\nF1 がこのヘルプです。Ctrl+/ は短いショートカット一覧です。Ctrl+, は設定です。Esc か閉じる印でヘルプを閉じ、元の場所へ戻ります。
help_body_panes_tabs = ペインはフォルダー 1 つです。レイアウト ボタンは均等な格子を作ります。押したままドラッグすると、列ごとのペイン数を決めます。方向キーと Enter も使えます。分割線のダブルクリックは均等分割、ドラッグはサイズ変更です。格子は列 4、1 列の行 4、ペイン 16 で止まります。\n\n番号かヘッダーをドラッグしてペインを動かします。端に落とすとそのペインが分割され、中央は入れ替わります。Ctrl を押したままドラッグすると、今のペイン タブをコピーします。端は元のペインを残して分割し、中央はそのマスにペイン タブを追加します。赤いプレビューは上限を超えるという意味です。Ctrl を離すとコピーではなく移動です。\n\nウィンドウ タブはレイアウト全体です。Ctrl+T で開き、Ctrl+W で閉じます。Ctrl+Tab と Ctrl+Shift+Tab で切り替えます。Ctrl+Shift+T は閉じたタブを開き直します。Ctrl+Alt+K は現在のタブを複製します。Ctrl+Shift+L はタブ一覧を開きます。タブはペイン、フォルダー、表示、色ラベルを覚えています。\n\nファイルやフォルダーをドラッグしたまま、別のウィンドウ タブかペイン タブの上で約 0.5 秒待つと、そのタブが開きます。タブの上へ落とすと、実ファイルを実フォルダーへ入れる普通のドロップのとき、そのタブのアクティブなフォルダーへ入ります。列の上でタブをドラッグすると、これまでどおり並べ替えです。\n\n保存 (Ctrl+S) はこのタブを書き込みます。保存ボタンの緑の点は、レイアウトが未保存という意味です。ファイルのコピーとは別です。セッションを開くは、保存したタブを現在のタブの隣に開きます。複数を開くと、それぞれがタブになります。\n\nペイン タブは 1 つのペインの中の追加フォルダーで、ウィンドウ タブではありません。フォルダーが 1 つなら帯は隠れます。入れ替えボタンの右のボタンか Ctrl+Alt+T でペイン タブを追加します。Ctrl+Alt+W で閉じます。フォーカスがペインにあるとき、Ctrl+Alt+PageDown と Ctrl+Alt+PageUp で切り替えます。中クリックとタブの閉じる印でも閉じます。\n\nCtrl+N は別のウィンドウを開きます。単一ウィンドウ モードではこのウィンドウを前面にし、パスはタブで開きます。単一インスタンスでは後からの起動もこのプロセスに入ります。\n\nCtrl+Shift+M、またはペイン ヘッダーのダブルクリックで、そのペインを最大化します。もう一度で格子に戻ります。ヘッダーを右クリックすると色ラベルを付けます。ラベルはセッションと一緒に保存され、タブの色とは別です。
help_body_favorites = お気に入りとフォルダー ツリーは左のパネルを共有します。間の区切りをドラッグします。どちらを上にするかは設定で決めます。Ctrl+Shift+E でパネルを隠したり出したりします。\n\nお気に入りをクリックすると、アクティブなペインで開きます。グループをクリックすると展開または折りたたみです。検索は親グループを残すので、一致した項目がどこにあるか分かります。お気に入りはフォルダーでもファイルでもかまいません。フォルダーが無いときは、空のパスを開かず案内を出します。\n\nツール バーのお気に入りボタンは、大きい一覧を開きます。そこで検索、名前の変更、削除、アクティブなペインで開く、ができます。エクスプローラーのピンも同じ一覧に出ることがあります。\n\nフォルダー ツリーはディスクです。Enter かダブルクリックで、そのフォルダーをペインに開きます。Ctrl+クリックや中クリックはペイン タブとして開けます。
help_body_file_operations = コピー、切り取り、貼り付け、名前の変更、削除はエクスプローラーと同じです。Ctrl+C がコピー、Ctrl+X が切り取り、Ctrl+V が貼り付けです。F2 は名前の変更です。Del は Windows の既定がそうならごみ箱へ送ります。Shift+Del は完全削除です。設定で、Del の前に確認するか、既定の削除を何にするかを選べます。\n\nペインからペインへドラッグしてコピーまたは移動します。同じドライブは移動、別のドライブはコピーが Windows の規則で、設定で既定のドラッグを変えられます。フォルダー行の上に落とすと、そのフォルダーに入ります。\n\nファイルやフォルダーをドラッグしたまま、別のウィンドウ タブかペイン タブの上で約 0.5 秒待つと、ブラウザーと同じようにそのタブが開きます。開いたタブのペインへ落とすとコピーまたは移動です。同じドライブは移動、別のドライブはコピー、Ctrl はコピー、Shift は移動です。Windows の進行状況は別のスレッドで表示されます。タブそのものへ落とすと、中身が実ファイルで先が実フォルダーのとき、そのタブのアクティブなフォルダーへ入ります。そうでないときはタブが開くだけです。ウィンドウ タブを列の上でドラッグすると、これまでどおり並べ替えです。\n\n高速コピーはネットワーク フォルダー用です。設定のファイル操作でオンにします。ネットワーク パスが関わる貼り付けとドラッグは、Windows のコピー ウィンドウの代わりに robocopy を使います。高速コピーは自分の進行と残り時間を出します。キャンセルで止まります。ツリーをコピーし、宛先にある余分なファイルは消しません。オフのときは Windows の進行ウィンドウを使います。\n\nクリップボードに画像があるときの Ctrl+V は、スクリーンショットのように、現在のフォルダーへ PNG を保存します。\n\nCtrl+Shift+N と F7 はフォルダーを作ります。Ctrl+Alt+N はファイルを作ります。ファイル名は設定から来て、空なら表示言語に従います。\n\n入れ替えボタンは、選択したフォルダーを別のペインへ送ります。このペインの列と表示を保つか、選択したファイルを最大 10,000 件コピーまたは移動します。ペインが 1 つなら左右に分割し、右にそのフォルダーを開きます。何も選択していなければ、現在のフォルダーを別のペインに複製します。\n\nCtrl+Alt+C は、アクティブなペインのフォルダーを次のペインと WinMerge で比較します。歯車メニューとファイル一覧から、選択した 2 ファイル、または別ペインの同名ファイルを比較できます。WinMerge のパスは設定の全般で指定します。\n\nCtrl+Shift+O は、エクスプローラーのウィンドウで開いているフォルダーを Maguro のペインに取り込みます。そのいずれかをすでに表示しているペインはそのままにし、残りのフォルダーはアクティブなペインから順に開きます。\n\nCtrl+Shift+B はファイルバスケットを開きます。常に手前に残る小さなウィンドウです。ファイルやフォルダーをドロップするか、Ctrl+Alt+B でアクティブペインの選択を追加します。一覧は元のパスを覚えます。アクティブペインへのコピーと移動は Windows の進行ウィンドウを使います。すべて選択はすべての行を選びます。Ctrl+クリックは行の選択を切り替え、Shift+クリックは範囲を選びます。選択を外へドラッグするとコピーです。Ctrl はコピー、Shift は移動です。Alt と Ctrl+Shift はショートカットを作りません。ペインへ落とすと、別スレッドの IFileOperation が Windows の進行ウィンドウを出します。エクスプローラーも同じドラッグを受け取ります。取り除くとクリアは一覧だけを変えます。
help_body_server_connections = サーバー接続は、ペインで見るリモート フォルダーです。Maguro は SMB 共有、WebDAV、SFTP、FTP に接続します。\n\n接続ダイアログで種類を選び、アドレス、ポート、ユーザー名、パスワードを入力します。パスワードは Windows の資格情報に置き、設定ファイルには書きません。保存したら、ほかのフォルダーと同じように開きます。\n\nSMB は Windows の共有を使います。WebDAV は HTTPS が必要なことがあります。FTP は入力したホストとポートを使います。SFTP には rclone と WinFsp が必要です。無いときは Maguro が知らせ、接続の前にインストールできます。\n\n接続したサーバーは、ペインで開き、コピーし、プレビューできるフォルダーとして見えます。終わったら切断します。切れた共有は、ネットワーク フォルダーのサイズをオンにしない限り、フォルダー サイズを歩きません。ネットワーク フォルダーが開けないときは F5 でもう一度試します。
help_body_shortcuts = この文の下に、Maguro のすべてのキーが表示されます。同じ一覧は Ctrl+/ で短いウィンドウにも開きます。F1 がこのヘルプです。どちらも設定に従うので、変えたキーは再起動なしでここに出ます。\n\nキーを変えるには、設定のショートカットで行をダブルクリックし、新しいキーを押します。Esc はその入力を取り消します。別のコマンドが既に使っているときは Maguro が知らせます。リセットで元のキーに戻ります。\n\nウィンドウ タブは Ctrl+T、Ctrl+W、Ctrl+Tab、Ctrl+Shift+Tab、Ctrl+Shift+T、Ctrl+Alt+K、Ctrl+Shift+L です。ペインの移動は Ctrl+PageDown と Ctrl+PageUp で、Ctrl+1 から Ctrl+9 はそのペインへ飛びます。Alt+左は戻る、Alt+上は親フォルダー、Ctrl+L と Alt+D と F4 はアドレスの編集です。\n\nF2 は名前の変更、Del は削除、Ctrl+C、Ctrl+X、Ctrl+V はコピー、切り取り、貼り付けです。F5 はウィンドウのどこからでもアクティブなペインを読み直します。F3 と、そのオプションがオンのときの Space はプレビューです。 プレビューでは Enter が表示中のファイルを既定のアプリで開いて閉じ、Shift+Enter か右クリックは別のアプリで開くです。F6 と Shift+F6 はフォーカスを動かします。Ctrl+, は設定、Ctrl+N はウィンドウ、Win+Shift+E は Maguro を前面にします。Win+Alt+V はクリップボードのフォルダーを新しいタブで開き、ファイルは既定のアプリで開きます。\n\n下の一覧がすべてです。レイアウト ボタン、アドレス バー、分割線、ペイン ヘッダー、ペイン タブなどのマウス操作も含まれます。\n\nCtrl+Alt+1 から Ctrl+Alt+9 はワークスペース 1–9 を開きます。Ctrl+Alt+Shift+1 から Ctrl+Alt+Shift+9 は今のタブ、ペインの配置、フォルダーをそのスロットに保存します。歯車メニューのワークスペースから、スロットの保存、読み込み、名前の変更、消去ができます。空のスロットは短いメッセージを出します。読み込むと今のタブが置き換わり、確認は「開く前に確認」がオンのときだけです。
help_body_settings = Ctrl+, で設定が開きます。検索は、タイトルか説明が一致するカードへ移動します。\n\n全般には、表示言語、フォント、起動時に開くもの、フォルダー アプリとして使う、既定のレイアウト、単一インスタンス、単一ウィンドウ、余白のダブルクリックで親フォルダー、Everything 検索、WinMerge、クリップボードのパスのショートカットがあります。\n\n外観には、テーマ、アクセント色、ツール バー、ドライブ ボタン、ステータス バーがあります。ライトとダークはアクセント色を別々に覚えます。Windows に従うはシステムと一緒に切り替わります。テーマを変えたあと、フォルダー一覧の色は次に Maguro を起動したときに付き、残りのウィンドウはすぐに変わります。\n\nペインと表示には、新しいペインの既定の表示、フォルダーごとの並べ替え・列・表示・アイコン サイズの記憶、保存が無いフォルダーの既定の表示、隠しファイル、拡張子、フォルダー サイズ、ネットワーク パスのフォルダー サイズ、左パネルとお気に入りまたはツリーのどちらを上にするか、アクティブなペインの枠、Space のプレビュー、プレビューのホイールがあります。\n\nファイル操作には、Windows のコピー ウィンドウ、ネットワーク フォルダーの高速コピー、削除の確認、既定の削除、新しいファイル名、既定のドラッグ アンド ドロップがあります。\n\nお気に入り、ショートカット、セッションはそれぞれページがあります。セッション ファイルは Maguro のセッション フォルダーにあります。終了時に保存は、既にセッション ファイルがあるタブを書き込みます。緑の点は、レイアウトがまだ保存されていないタブです。\n\n詳細には、起動時に新しい Maguro を確認する、設定ファイルの場所、リセットがあります。maguro.exe の隣の portable.txt は、設定ファイルを AppData ではなくその場所に置きます。リセットは設定を既定に戻し、レイアウトとフォルダーとお気に入りは残します。\n\n右クリック メニューは、オフにできる他社の項目を出します。クラシックと Windows 11 の 2 つの形です。Windows 11 のパッケージ項目はオフから始まり、必要なものだけオンにします。更新はメニューを読み直します。
help_body_troubleshooting = フォルダーが開かないときは、そのペインをクリックして F5 を押します。F5 はウィンドウのどこからでもアクティブなペインを読み直し、失敗したネットワーク フォルダーをもう一度試します。\n\nサブフォルダーの検索が何も見つけないときは、Everything をインストールして起動します。設定の全般で、インストールと実行の状態を見て、インストールまたは起動できます。Maguro が Everything に聞くのは、そのプログラムが動いているときだけです。\n\nネットワーク フォルダーへのコピーが遅い、または Maguro の進行が出ないときは、ネットワーク フォルダーの高速コピーを確認します。オンなら、貼り付けとドラッグは robocopy と Maguro の進行を使い、キャンセルできます。オフなら Windows のコピー ウィンドウが出ます。完全にローカルなコピーでは高速コピーは動きません。\n\nWinMerge が起動しないときは、設定の全般でパスを指定するか、インストールします。フォルダー比較の前に、ペインは実際のフォルダーである必要があります。\n\nSFTP がつながらないときは、Maguro が尋ねたら rclone と WinFsp をインストールし、ホスト、ポート、ユーザー、パスワードを確認します。WebDAV は、サーバーが求めるとき HTTPS をオンにします。SMB は Windows が開く共有パスを使います。FTP は接続のホストとポートを使います。\n\nウィンドウの色は変わったのにフォルダー一覧が変わらないときは、Maguro を再起動します。その一覧は起動時にテーマを受け取ります。\n\n前回 Maguro が自分で閉じたときは、次の起動で知らせ、レポートの場所も知らせます。レポートは設定の隣の crashes フォルダーにあります。案内からそのフォルダーを開けます。\n\n同じ maguro.exe をもう一度起動すると、単一インスタンスか単一ウィンドウがオンのときはすぐに終わり、最初のウィンドウが残ります。Maguro がインストールできる更新は maguro.exe を置き換えて再起動します。リリースが zip だけのときは展開しません。更新ウィンドウがそう言ったら、maguro.exe を自分で置き換えてください。\n\nウィンドウの閉じるボタンで Maguro を閉じます。終了時に保存がオンなら、そのときセッションを書き込みます。
