help_body_getting_started = Maguro ist ein schneller Mehrbereich-Dateimanager für Windows. Jeder Bereich zeigt einen Ordner. Öffnen Sie mehrere Bereiche nebeneinander oder im Raster, und kopieren, verschieben und vergleichen Sie ohne ein zweites Programm.\n\nStarten Sie Maguro über das Startmenü oder die Befehlszeile. Ordnerpfade nach maguro.exe öffnen diese Ordner. Eine .maguro-Datei öffnet eine gespeicherte Sitzung.\n\nDie Adressleiste ist der aktuelle Ordner. Klicken Sie einen Namen im Pfad, um dorthin zu gehen. Ein Chevron listet die Ordner darin. Klicken Sie den aktuellen Ordner oder die leere Leiste, oder drücken Sie Strg+L, Alt+D oder F4, um einen Pfad zu tippen.\n\nDie Symbolleiste hat die Layout-Schaltfläche, Speichern, Sitzung öffnen und Favoriten. Laufwerksbuchstaben können in der Registerkartenzeile stehen. Die Statusleiste zeigt, wie viele Elemente markiert sind und wie viel Platz frei ist.\n\nF1 öffnet diese Hilfe. Strg+/ öffnet die kurze Tastenkürzelliste. Strg+, öffnet die Einstellungen. Esc oder die Schließen-Marke schließt die Hilfe und kehrt dorthin zurück, wo Sie waren.
help_body_panes_tabs = Ein Bereich ist ein Ordner. Die Layout-Schaltfläche baut ein gleichmäßiges Raster. Drücken und ziehen Sie, um zu wählen, wie viele Bereiche in jede Spalte kommen. Pfeiltasten und Eingabe funktionieren dort auch. Ein Doppelklick auf einen Trenner teilt gleichmäßig. Ziehen Sie einen Trenner, um die Größe zu ändern. Das Raster endet bei 4 Spalten, 4 Zeilen in einer Spalte und 16 Bereichen.\n\nZiehen Sie einen Bereich an seiner Nummer oder seiner Kopfzeile, um ihn zu verschieben. Ablegen auf einer Kante teilt den Bereich, auf dem Sie landen. Ablegen in der Mitte tauscht die beiden. Halten Sie Strg beim Ziehen, um die aktuelle Bereichsregisterkarte zu kopieren: eine Kante teilt und behält diesen Bereich, und die Mitte fügt in dieser Zelle eine Bereichsregisterkarte hinzu. Eine rote Vorschau bedeutet, dass das Ablegen die Grenze überschreiten würde. Lassen Sie Strg los, um zu verschieben statt zu kopieren.\n\nFensterregisterkarten sind ganze Layouts. Strg+T öffnet eine Registerkarte. Strg+W schließt sie. Strg+Tab und Strg+Umschalt+Tab wechseln. Strg+Umschalt+T öffnet eine geschlossene Registerkarte wieder. Strg+Alt+K dupliziert die aktuelle Registerkarte. Strg+Umschalt+L öffnet die Tab-Liste. Jede Registerkarte merkt sich Bereiche, Ordner, Ansicht und Farbmarke.\n\nWährend Dateien oder Ordner gezogen werden, öffnet eine etwa halbe Sekunde auf einem anderen Fenster-Tab oder einem Bereichs-Tab diesen Tab. Ablegen auf dem Tab legt sie in seinen aktiven Ordner, wenn es ein einfaches Ablegen echter Dateien auf einen echten Ordner ist. Einen Tab in der Zeile ziehen sortiert ihn weiterhin um.\n\nSpeichern (Strg+S) schreibt diese Registerkarte. Ein grüner Punkt auf Speichern bedeutet, dass das Layout nicht gespeichert ist. Der Punkt gilt nicht für gewöhnliche Dateikopien. Sitzung öffnen öffnet eine gespeicherte Registerkarte neben der aktuellen. Mehrere Sitzungen öffnen jede als eigene Registerkarte.\n\nBereichsregisterkarten sind weitere Ordner in einem Bereich. Sie sind keine Fensterregisterkarten. Bei einem Ordner bleibt die Leiste verborgen. Die Schaltfläche rechts neben der Tausch-Schaltfläche fügt eine Bereichsregisterkarte hinzu, ebenso Strg+Alt+T. Strg+Alt+W schließt sie. Strg+Alt+Bild-ab und Strg+Alt+Bild-auf wechseln Bereichsregisterkarten, solange der Fokus in einem Bereich liegt. Ein Mittelklick und die kleine Schließen-Marke schließen sie ebenfalls.\n\nStrg+N öffnet ein weiteres Fenster. Der Einzel-Fenster-Modus holt dieses Fenster nach vorn und öffnet Pfade als Registerkarten. Der Einzel-Instanz-Modus behält einen späteren Start in diesem Prozess.\n\nStrg+Umschalt+M oder ein Doppelklick auf eine Bereichskopfzeile maximiert diesen Bereich. Noch einmal stellt das Raster wieder her. Ein Rechtsklick auf die Kopfzeile setzt eine Farbmarke. Die Marke wird mit der Sitzung gespeichert und ist von der Registerkartenfarbe getrennt.\n\nAlt+P zeigt den Vorschaubereich für die im aktiven Bereich gewählte Datei. Die Kopfzeile nennt Symbol, Name, Größe, Typ, Änderungs- und Erstellungsdatum und Attribute. Ein registrierter Windows-Vorschauhandler zeichnet Office, PDF und HTML, und die Kopfzeile bleibt darüber. Fehlt ein Handler oder schlägt er fehl, zeigt der Bereich dieselbe Vorschau wie die Schnellansicht: Text, Code mit Zeilennummern, Markdown, ein CSV-Gitter, ein Bild, ein Archiv oder einen Ordner. Ein Ordner zeigt ein großes Symbol, die Anzahl der Elemente und die Gesamtgröße, dann die Kinder, Ordner zuerst. Ein Doppelklick auf eine Zeile öffnet sie im aktiven Bereich. Text und Code können die Auswahl oder den ganzen Text kopieren und in dem Standardeditor geöffnet werden. Bilder listen Kameradaten, wenn die Datei sie enthält.
help_body_favorites = Favoriten und der Ordnerbaum teilen sich den linken Bereich. Ziehen Sie den Trenner dazwischen. Die Einstellungen wählen, welcher oben liegt. Strg+Umschalt+E blendet den Bereich aus oder ein.\n\nKlicken Sie einen Favoriten, um ihn im aktiven Bereich zu öffnen. Ein Klick auf eine Gruppe klappt sie auf oder zu. Die Suche behält die übergeordneten Gruppen, damit ein Treffer zeigt, wo er sitzt. Ein Favorit kann ein Ordner oder eine Datei sein. Fehlt der Ordner, zeigt Maguro einen Hinweis, statt einen leeren Pfad zu öffnen.\n\nDie Favoriten-Schaltfläche in der Symbolleiste öffnet die größere Liste. Dort können Sie suchen, umbenennen, entfernen und einen Eintrag im aktiven Bereich öffnen. Angeheftete Einträge des Explorers können in derselben Liste erscheinen.\n\nDer Ordnerbaum ist das Laufwerk. Eingabe oder ein Doppelklick öffnet diesen Ordner im Bereich. Strg+Klick oder ein Mittelklick kann ihn als Bereichsregisterkarte öffnen.
help_body_file_operations = Kopieren, Ausschneiden, Einfügen, Umbenennen und Löschen entsprechen dem Explorer. Strg+C kopiert, Strg+X schneidet aus, Strg+V fügt ein. F2 benennt um. Entf verschiebt in den Papierkorb, wenn das die Windows-Vorgabe ist. Umschalt+Entf löscht endgültig. Die Einstellungen können vor Entf fragen und das Standardlöschen wählen.\n\nZiehen Sie von einem Bereich in einen anderen, um zu kopieren oder zu verschieben. Windows verschiebt auf demselben Laufwerk und kopiert über Laufwerke hinweg, außer die Einstellungen setzen ein Standardziehen. Ablegen auf einer Ordnerzeile legt die Dateien in diesen Ordner.\n\nEine Datei oder einen Ordner etwa eine halbe Sekunde über einem anderen Fenster-Tab oder einem Bereichs-Tab halten, und der Tab öffnet sich wie in einem Browser. Ablegen auf einem Bereich in diesem Tab kopiert oder verschiebt: gleiches Laufwerk verschiebt, ein anderes kopiert, Strg kopiert, Umschalt verschiebt. Das Windows-Fortschrittsfenster läuft in einem eigenen Thread. Ablegen auf dem Tab selbst legt die Elemente in den aktiven Ordner dieses Tabs, wenn jedes Element eine echte Datei oder ein echter Ordner ist und das Ziel ein echter Ordner ist. Sonst öffnet sich nur der Tab. Einen Fenster-Tab in der Zeile ziehen sortiert ihn weiterhin um.\n\nSchnellkopieren gilt für Netzwerkordner. Schalten Sie es unter Einstellungen, Dateioperationen ein. Einfügen und Ziehen nutzen dann robocopy, wenn ein Netzwerkpfad beteiligt ist, statt des Windows-Kopierfensters. Schnellkopieren zeigt seinen eigenen Fortschritt und die restliche Zeit. Abbrechen stoppt den Auftrag. Es kopiert den Baum und löscht keine zusätzlichen Dateien am Ziel. Ist der Schalter aus, wird das Windows-Fortschrittsfenster benutzt.\n\nStrg+V mit einem Bild in der Zwischenablage, etwa einem Screenshot, speichert eine PNG im aktuellen Ordner.\n\nStrg+Umschalt+N erstellt einen Ordner. F7 tut dasselbe. Strg+Alt+N erstellt eine Datei. Der Dateiname kommt aus den Einstellungen. Ein leerer Name folgt der Anzeigesprache.\n\nDie Tausch-Schaltfläche sendet den markierten Ordner in einen anderen Bereich und behält Spalten und Ansicht dieses Bereichs, oder sie kopiert oder verschiebt die markierten Dateien dorthin, bis zu 10.000. Bei nur einem Bereich teilt sie nebeneinander und öffnet diesen Ordner rechts. Ohne Markierung dupliziert sie den aktuellen Ordner in den anderen Bereich.\n\nStrg+Alt+C vergleicht den Ordner des aktiven Bereichs mit dem nächsten Bereich in WinMerge. Das Zahnradmenü und die Dateiliste können zwei markierte Dateien vergleichen, oder eine Datei mit demselben Namen in einem anderen Bereich. Den WinMerge-Pfad setzen Sie unter Einstellungen, Allgemein.\n\nStrg+Umschalt+O sammelt dieselben markierten Namen in den anderen Bereichen.\n\nStrg+Umschalt+B öffnet den Dateikorb, ein kleines Fenster, das oben bleibt. Ziehen Sie Dateien oder Ordner darauf, oder drücken Sie Strg+Alt+B, um die Auswahl des aktiven Bereichs hinzuzufügen. Die Liste merkt sich jeden ursprünglichen Pfad. Kopieren und Verschieben in den aktiven Bereich nutzen das Windows-Fortschrittsfenster. Alles auswählen markiert jede Zeile. Strg+Klick schaltet eine Zeile um und Umschalt+Klick wählt einen Bereich. Herausziehen der Auswahl kopiert. Strg kopiert und Umschalt verschiebt. Alt und Strg+Umschalt legen keine Verknüpfung an. Ein Ablegen auf einem Bereich nutzt IFileOperation in einem eigenen Thread, mit dem Windows-Fortschrittsfenster. Der Explorer nimmt dasselbe Ziehen an. Entfernen und Leeren ändern nur die Liste.
help_body_server_connections = Eine Serververbindung ist ein entfernter Ordner, den Sie in einem Bereich durchsuchen. Maguro verbindet SMB-Freigaben, WebDAV, SFTP und FTP.\n\nÖffnen Sie den Verbindungsdialog und wählen Sie die Art. Geben Sie Adresse, Port, Benutzername und Kennwort ein. Das Kennwort bleibt in den Windows-Anmeldeinformationen. Es wird nicht in die Einstellungsdatei geschrieben. Speichern Sie die Verbindung und öffnen Sie sie wie jeden anderen Ordner.\n\nSMB nutzt eine Windows-Freigabe. WebDAV kann HTTPS verlangen. FTP nutzt den Host und den Port, die Sie eingeben. SFTP braucht rclone und WinFsp. Fehlt eines der Werkzeuge, sagt Maguro das und kann es vor dem Verbindungsstart installieren.\n\nEin verbundener Server erscheint als Ordner, den Sie in einem Bereich öffnen, kopieren und in der Vorschau ansehen können. Trennen Sie die Verbindung, wenn Sie fertig sind. Eine ausgefallene Freigabe wird für Ordnergrößen nicht durchlaufen, außer Netzwerk-Ordnergrößen sind an. Öffnet sich ein Netzwerkordner nicht, versucht F5 es erneut.
help_body_shortcuts = Jedes Maguro-Tastenkürzel steht unter diesem Text. Dieselbe Liste öffnet sich in einem kurzen Fenster mit Strg+/. F1 öffnet diese Hilfe. Beide folgen den Einstellungen, sodass ein dort geändertes Kürzel hier ohne Neustart erscheint.\n\nUm ein Kürzel zu ändern, öffnen Sie Einstellungen, Tastenkürzel, doppelklicken Sie die Zeile und drücken Sie die neuen Tasten. Esc bricht diese Erfassung ab. Nutzt ein anderer Befehl das Kürzel schon, sagt Maguro das. Zurücksetzen stellt das ursprüngliche Kürzel wieder her.\n\nFensterregisterkarten nutzen Strg+T, Strg+W, Strg+Tab, Strg+Umschalt+Tab, Strg+Umschalt+T, Strg+Alt+K und Strg+Umschalt+L. Bereiche bewegen sich mit Strg+Bild-ab und Strg+Bild-auf, und Strg+1 bis Strg+9 springt zu einem Bereich. Alt+Links geht zurück, Alt+Auf zum übergeordneten Ordner, und Strg+L, Alt+D oder F4 bearbeitet die Adresse.\n\nF2 benennt um, Entf löscht, und Strg+C, Strg+X und Strg+V kopieren, schneiden aus und fügen ein. F5 lädt den aktiven Bereich von überall im Fenster neu. F3, und die Leertaste wenn diese Option an ist, öffnet die Vorschau. In der Vorschau öffnet Enter die angezeigte Datei und schließt sie; Umschalt+Enter oder ein Rechtsklick ist Öffnen mit. F6 und Umschalt+F6 bewegen den Fokus. Strg+, öffnet die Einstellungen. Strg+N öffnet ein Fenster. Win+Umschalt+E holt Maguro nach vorn.\n\nDie Liste darunter ist der volle Satz, einschließlich Mausaktionen: die Layout-Schaltfläche, die Adressleiste, Trenner, Bereichskopfzeilen und Bereichsregisterkarten.\n\nStrg+Alt+1 bis Strg+Alt+9 lädt Arbeitsbereich 1–9. Strg+Alt+Umschalt+1 bis Strg+Alt+Umschalt+9 speichert die aktuellen Registerkarten, die Aufteilung und die Ordner in diesen Slot. Im Zahnradmenü unter Arbeitsbereiche kann jeder Slot gespeichert, geladen, umbenannt und geleert werden. Ein leerer Slot zeigt eine kurze Meldung. Das Laden ersetzt die aktuellen Registerkarten und fragt nur, wenn Vor dem Laden fragen eingeschaltet ist.
help_body_settings = Strg+, öffnet die Einstellungen. Die Suche springt zu einer Karte, deren Titel oder Beschreibung passt.\n\nAllgemein umfasst die Anzeigesprache, die Schrift, was beim Start geöffnet wird, Maguro als Ordner-App, das Standardlayout, eine einzelne Instanz, ein einzelnes Fenster, Doppelklick auf leere Fläche zum übergeordneten Ordner, die Everything-Suche, WinMerge und die Tastenkombination für den Zwischenablage-Pfad.\n\nDarstellung umfasst das Thema, die Akzentfarbe, die Symbolleiste, die Laufwerksschaltflächen und die Statusleiste. Hell und Dunkel behalten jeweils ihre eigene Akzentfarbe. Windows folgen schaltet mit dem System. Nach einem Themenwechsel übernehmen die Ordnerlisten die neuen Farben beim nächsten Start von Maguro. Der Rest des Fensters aktualisiert sich sofort.\n\nBereiche und Ansicht umfasst die Standardansicht eines neuen Bereichs, das Merken von Sortierung, Spalten, Ansicht und Symbolgröße je Ordner, eine Standardansicht für Ordner ohne Gespeichertes, versteckte Dateien, Dateierweiterungen, Ordnergrößen, Ordnergrößen auf Netzwerkpfaden, den linken Bereich und ob Favoriten oder der Baum oben liegt, den Rand des aktiven Bereichs, die Vorschau mit der Leertaste und das Vorschau-Rad.\n\nDateioperationen umfasst das Windows-Kopierfenster, Schnellkopieren für Netzwerkordner, Löschen bestätigen, das Standardlöschen, den Namen neuer Dateien und das Standard-Ziehen und Ablegen.\n\nFavoriten, Tastenkürzel und Sitzungen haben eigene Seiten. Sitzungsdateien liegen im Maguro-Sitzungsordner. Speichern beim Beenden schreibt jede Registerkarte, die schon eine Sitzungsdatei hat. Der grüne Punkt markiert eine Registerkarte, deren Layout noch nicht gespeichert ist.\n\nErweitert umfasst die Suche nach einem neueren Maguro beim Start, den Ort der Einstellungsdatei und das Zurücksetzen. Eine portable.txt neben maguro.exe behält die Einstellungsdatei dort, statt unter AppData. Zurücksetzen stellt die Voreinstellungen wieder her. Layout, Ordner und Favoriten bleiben.\n\nDas Rechtsklickmenü listet Einträge anderer Programme, die Sie ausschalten können. Klassisch und Windows 11 sind die beiden Formen. Gepackte Windows-11-Einträge starten deaktiviert; schalten Sie nur ein, was Sie brauchen. Aktualisieren liest das Menü neu.
help_body_troubleshooting = Wenn ein Ordner sich nicht öffnet, klicken Sie diesen Bereich und drücken Sie F5. F5 lädt den aktiven Bereich von überall im Fenster neu und versucht einen fehlgeschlagenen Netzwerkordner erneut.\n\nWenn eine Suche in Unterordnern nichts findet, installieren Sie Everything und starten Sie es. Einstellungen, Allgemein zeigt, ob es installiert ist und läuft, und kann es installieren oder starten. Maguro fragt Everything nur, während dieses Programm läuft.\n\nWenn ein Kopieren in einen Netzwerkordner langsam ist oder keinen Maguro-Fortschritt zeigt, prüfen Sie Schnellkopieren für Netzwerkordner. Eingeschaltet nutzen Einfügen und Ziehen robocopy und den eigenen Fortschritt von Maguro, mit Abbrechen. Ausgeschaltet zeigt Windows sein Kopierfenster. Schnellkopieren läuft nicht für ein rein lokales Kopieren.\n\nWenn WinMerge nicht startet, setzen Sie den Pfad unter Einstellungen, Allgemein, oder installieren Sie es. Der Bereich muss ein echter Ordner sein, bevor Ordner verglichen werden.\n\nWenn SFTP keine Verbindung herstellt, installieren Sie rclone und WinFsp, wenn Maguro danach fragt, und prüfen Sie dann Host, Port, Benutzer und Kennwort. Für WebDAV schalten Sie HTTPS ein, wenn der Server es verlangt. Für SMB verwenden Sie den Freigabepfad, den Windows öffnen würde. FTP nutzt Host und Port der Verbindung.\n\nWenn die Fensterfarbe sich geändert hat, die Ordnerlisten aber nicht, starten Sie Maguro neu. Diese Listen nehmen das Thema beim Start.\n\nWenn Maguro sich beim letzten Mal von selbst geschlossen hat, sagt der nächste Start das, und wo der Bericht geschrieben wurde. Der Bericht liegt im Ordner crashes neben den Einstellungen. Öffnen Sie diesen Ordner aus dem Hinweis.\n\nEin zweiter Start derselben maguro.exe endet sofort, wenn Einzelinstanz oder Einzelfenster an ist, und das erste Fenster bleibt. Ein Update, das Maguro installieren kann, ersetzt maguro.exe und startet neu. Wenn eine Version nur eine Zip-Datei enthält, entpackt Maguro sie nicht. Ersetzen Sie maguro.exe selbst, wenn das Update-Fenster das sagt.\n\nSchließen Sie Maguro mit der Schließen-Schaltfläche des Fensters. Das schreibt die Sitzung, wenn Speichern beim Beenden an ist.
