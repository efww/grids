help_explorer = F2, Del, Ctrl+C/X/V, F5\tWie im Explorer. F5 lädt den aktiven Bereich von überall im Fenster neu; ein fehlgeschlagener Netzwerkordner wird erneut versucht\nCtrl+V\tMit einem kopierten Bild (Screenshot, Browserbild): hier als PNG-Datei speichern\nSpace\tSchnellvorschau, wie F3. Ein Leerzeichen innerhalb einer Sekunde nach der Eingabe oder während der IME-Komposition bleibt Teil des Namens. Einstellungen → Bereiche und Ansicht kann das ausschalten\nEnter\tIn der Schnellvorschau: die angezeigte Datei mit der Standard-App öffnen und die Vorschau schließen\nShift+Enter\tIn der Schnellvorschau: Öffnen mit für die angezeigte Datei. Ein Rechtsklick macht dasselbe\n\n
help_notes = Adressleiste: einen Ordner im Pfad anklicken, um dorthin zu gehen; ein › anklicken, um die Ordner darin aufzulisten; den aktuellen Ordner oder eine leere Stelle anklicken oder Ctrl+L drücken, um einen Pfad einzugeben\nSchaltfläche Layout: Klick für ein gleichmäßiges Raster, gedrückt ziehen für die Zeilen je Spalte (Pfeiltasten + Enter gehen auch)\nSchaltfläche ⇄: den ausgewählten Ordner (oder den aktuellen) in einem anderen Bereich öffnen, mit den Spalten dieses Bereichs (Reihenfolge, Breiten, Sortierung) und der Ansicht; oder die ausgewählten Dateien in den Ordner eines anderen Bereichs kopieren / verschieben (bis zu 10.000). Bei nur einem Bereich nebeneinander teilen (neuer Bereich rechts, gleichmäßig) und den Ordner dort öffnen. Ohne Auswahl wird der aktuelle Ordner dupliziert. Sind nur Dateien ausgewählt, wird er ebenfalls dupliziert, und sie werden nicht kopiert oder verschoben\nSpeichern (Ctrl+S): diesen Registerkarte speichern (Bereichslayout, Ordner, Ansicht, Farbmarkierungen). Ein grüner Punkt bedeutet, dass das Layout dieser Registerkarte nicht gespeichert ist (keine Ordnerwechsel)\nSitzung öffnen: die gespeicherte Registerkarte als neue Registerkarte neben der aktuellen öffnen. Mehrere öffnen öffnet jede gewählte Sitzung als eigene Registerkarte\nDoppelklick auf einen Trenner: gleichmäßig teilen\nRechtsklick auf eine Bereichskopfzeile: Farbmarkierung (mit der Sitzung gespeichert, getrennt von der Registerkartenfarbe)\nBereichsregisterkarten: Ordner in einem Bereich, getrennt von den Fensterregisterkarten. Ein Ordner blendet die Leiste aus; die Schaltfläche rechts von ⇄ fügt eine Registerkarte hinzu (Ctrl+Alt+T). Zwei oder mehr zeigen die Leiste. Standard ist Ctrl+Alt+W / Ctrl+Alt+PageDown / Ctrl+Alt+PageUp, und nur solange der Fokus in einem Bereich liegt. +, ×, ein Mittelklick und ein Doppelklick auf die leere Leiste gehen auch\nArgumente: maguro.exe C:\\a D:\\b ... oder maguro.exe arbeit.maguro\nCtrl+Alt+C vergleicht den Ordner des aktiven Bereichs mit dem nächsten Bereich in WinMerge. Das Zahnradmenü und die Dateiliste können auch zwei ausgewählte Dateien vergleichen, oder eine Datei mit demselben Namen in einem anderen Bereich. Einstellungen → Allgemein legt den WinMerge-Pfad fest.\nWenn Maguro schon läuft, öffnet sich ein neues Fenster in diesem Prozess. Der Einzelfenster-Modus holt dieses Fenster nach vorn und öffnet Pfade als Registerkarten.\nBereichsnummer: Ziehen verschiebt den Bereich. Strg+Ziehen kopiert den aktuellen Bereichsreiter. Eine Kante teilt, auch die eigene, und die Mitte fügt in dieser Zelle einen Bereichsreiter hinzu. Eine rote Vorschau liegt über dem Limit (4 Spalten, 4 Zeilen je Spalte oder 16 Bereiche). Strg beim Ziehen loslassen verschiebt stattdessen
