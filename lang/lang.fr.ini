help_explorer = F2, Del, Ctrl+C/X/V, F5\tComme l'Explorateur. F5 actualise le panneau actif depuis n'importe où dans la fenêtre ; un dossier réseau en échec est réessayé\nCtrl+V\tAvec une image copiée (capture d'écran, image du navigateur) : l'enregistrer ici en fichier PNG\nSpace\tAperçu rapide, comme F3. Un espace dans la seconde qui suit une frappe, ou pendant la composition IME, fait partie du nom. Paramètres → Panneaux et affichage peut le désactiver\n\n
help_notes = Barre d'adresse : cliquez un dossier du chemin pour y aller ; cliquez un › pour lister les dossiers qu'il contient ; cliquez le dossier actuel ou un espace vide, ou appuyez sur Ctrl+L, pour saisir un chemin\nBouton Disposition : un clic pour une grille égale, maintenir et glisser pour les lignes par colonne (les flèches + Entrée marchent aussi)\nBouton ⇄ : ouvrir le dossier sélectionné (ou le dossier actuel) dans un autre panneau, avec les colonnes de ce panneau (ordre, largeurs, tri) et l'affichage ; ou copier / déplacer les fichiers sélectionnés vers le dossier d'un autre panneau (jusqu'à 10 000). Avec un seul panneau, partager côte à côte (nouveau panneau à droite, partage égal) et y ouvrir ce dossier. Sans sélection, le dossier actuel est dupliqué. Si seuls des fichiers sont sélectionnés, il est aussi dupliqué, et ils ne sont ni copiés ni déplacés\nEnregistrer (Ctrl+S) : enregistrer cet onglet (disposition des panneaux, dossiers, affichage, libellés de couleur). Un point vert signifie que la disposition de cet onglet n'est pas enregistrée (pas les changements de dossier)\nOuvrir une session : ouvrir l'onglet enregistré comme nouvel onglet à côté de l'actuel. En ouvrir plusieurs ouvre chaque session choisie dans son propre onglet\nDouble-clic sur un séparateur : partage égal\nClic droit sur l'en-tête d'un panneau : libellé de couleur (enregistré avec la session, distinct de la couleur de l'onglet)\nOnglets de panneau : dossiers dans un panneau, distincts des onglets de la fenêtre. Un seul dossier masque la bande ; le bouton à droite de ⇄ ajoute un onglet (Ctrl+Alt+T). Deux ou plus affichent la bande. Ctrl+Alt+W / Ctrl+Alt+PageDown / Ctrl+Alt+PageUp par défaut, et seulement tant que le focus est dans un panneau. +, ×, un clic milieu et un double-clic sur la bande vide marchent aussi\nArguments : maguro.exe C:\\a D:\\b ... ou maguro.exe travail.grids\nCtrl+Alt+C compare le dossier du panneau actif avec le panneau suivant dans WinMerge. Le menu engrenage et la liste de fichiers peuvent aussi comparer deux fichiers sélectionnés, ou un fichier avec le même nom dans un autre panneau. Paramètres → Général définit le chemin de WinMerge.\nSi Maguro est déjà lancé, une nouvelle fenêtre s'ouvre dans ce processus. Le mode fenêtre unique amène cette fenêtre au premier plan et ouvre les chemins comme onglets.\nNuméro de panneau : glisser déplace le panneau. Ctrl+glisser copie l'onglet de panneau actuel : un bord fractionne, y compris celui de ce panneau, et le centre ajoute un onglet dans cette cellule. Un aperçu rouge dépasse la limite (4 colonnes, 4 lignes par colonne, ou 16 panneaux). Relâchez Ctrl pendant le glissement pour déplacer
