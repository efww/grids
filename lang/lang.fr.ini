help_tab_troubleshooting = Aide
help_body_getting_started = Maguro est un gestionnaire de fichiers multi-panneaux, rapide, pour Windows. Chaque panneau affiche un dossier. Ouvrez-en plusieurs, côte à côte ou en grille, pour copier, déplacer et comparer sans un second programme.\n\nLancez Maguro depuis le menu Démarrer ou la ligne de commande. Des chemins de dossiers après maguro.exe ouvrent ces dossiers. Un fichier .grids ouvre une session enregistrée.\n\nLa barre d'adresse est le dossier actuel. Cliquez un nom du chemin pour y aller. Cliquez un chevron pour lister les dossiers qu'il contient. Cliquez le dossier actuel, ou le vide de la barre, ou appuyez sur Ctrl+L, Alt+D ou F4, pour taper un chemin.\n\nLa barre d'outils contient le bouton de disposition, Enregistrer, Ouvrir une session et les Favoris. Les lettres de lecteur peuvent figurer sur la rangée d'onglets. La barre d'état montre le nombre d'éléments sélectionnés et l'espace libre.\n\nF1 ouvre cette aide. Ctrl+/ ouvre la liste courte des raccourcis. Ctrl+, ouvre les Paramètres. Échap, ou la marque de fermeture, ferme l'aide et revient là où vous étiez.
help_body_panes_tabs = Un panneau est un dossier. Le bouton de disposition construit une grille régulière. Appuyez et faites glisser pour choisir combien de panneaux vont dans chaque colonne. Les flèches et Entrée fonctionnent aussi. Un double-clic sur un séparateur partage en parts égales. Faites glisser un séparateur pour redimensionner. La grille s'arrête à 4 colonnes, 4 rangées dans une colonne et 16 panneaux.\n\nFaites glisser un panneau par son numéro ou son en-tête pour le déplacer. Déposez sur un bord pour partager le panneau d'arrivée. Déposez au centre pour échanger les deux. Maintenez Ctrl pendant le glisser pour copier l'onglet de panneau actuel : un bord partage et garde ce panneau, et le centre ajoute un onglet de panneau dans cette cellule. Un aperçu rouge signifie que le dépôt dépasserait la limite. Relâchez Ctrl pour déplacer au lieu de copier.\n\nLes onglets de fenêtre sont des dispositions entières. Ctrl+T en ouvre un. Ctrl+W le ferme. Ctrl+Tab et Ctrl+Shift+Tab changent d'onglet. Ctrl+Shift+T rouvre un onglet fermé. Ctrl+Alt+K duplique l'onglet actuel. Chaque onglet retient ses panneaux, dossiers, affichage et étiquette de couleur.\n\nEnregistrer (Ctrl+S) écrit cet onglet. Un point vert sur Enregistrer signifie que la disposition n'est pas enregistrée. Ce point ne sert pas aux copies de fichiers ordinaires. Ouvrir une session ouvre un onglet enregistré à côté de l'actuel. En ouvrir plusieurs ouvre chacun comme son propre onglet.\n\nLes onglets de panneau sont des dossiers en plus dans un seul panneau. Ce ne sont pas des onglets de fenêtre. Avec un seul dossier, la bande reste cachée. Le bouton à droite du bouton d'échange ajoute un onglet de panneau, ainsi que Ctrl+Alt+T. Ctrl+Alt+W le ferme. Ctrl+Alt+PageDown et Ctrl+Alt+PageUp changent d'onglet de panneau tant que le focus est dans un panneau. Un clic milieu et la petite marque de fermeture ferment aussi l'onglet.\n\nCtrl+N ouvre une autre fenêtre. Le mode une seule fenêtre amène cette fenêtre au premier plan et ouvre les chemins comme des onglets. Le mode une seule instance garde un lancement ultérieur dans ce processus.\n\nCtrl+Shift+M, ou un double-clic sur l'en-tête d'un panneau, agrandit ce panneau. Refaites-le pour restaurer la grille. Un clic droit sur l'en-tête pose une étiquette de couleur. L'étiquette est enregistrée avec la session et reste distincte de la couleur de l'onglet.
help_body_favorites = Les Favoris et l'arborescence des dossiers partagent le panneau de gauche. Faites glisser le séparateur entre les deux. Les Paramètres choisissent lequel est en haut. Ctrl+Shift+E masque ou affiche le panneau.\n\nCliquez un favori pour l'ouvrir dans le panneau actif. Cliquez un groupe pour le déplier ou le replier. La recherche garde les groupes parents, afin qu'une correspondance montre encore où elle se trouve. Un favori peut être un dossier ou un fichier. Si le dossier manque, Maguro affiche une note au lieu d'ouvrir un chemin vide.\n\nLe bouton Favoris de la barre d'outils ouvre la liste plus grande. Vous pouvez y chercher, renommer, retirer et ouvrir une entrée dans le panneau actif. Les épingles de l'Explorateur peuvent apparaître dans la même liste.\n\nL'arborescence est le disque. Entrée ou un double-clic ouvre ce dossier dans le panneau. Ctrl+clic ou un clic milieu peut l'ouvrir comme onglet de panneau.
help_body_file_operations = Copier, couper, coller, renommer et supprimer suivent l'Explorateur. Ctrl+C copie, Ctrl+X coupe et Ctrl+V colle. F2 renomme. Suppr envoie à la corbeille quand c'est le défaut de Windows. Maj+Suppr est une suppression définitive. Les Paramètres peuvent demander avant Suppr, et choisir la suppression par défaut.\n\nGlissez d'un panneau à l'autre pour copier ou déplacer. Windows déplace sur le même lecteur et copie vers un autre, sauf si les Paramètres fixent un glisser par défaut. Déposer sur une ligne de dossier place les fichiers dans ce dossier.\n\nLa copie rapide sert aux dossiers réseau. Activez-la dans Paramètres, Opérations sur les fichiers. Coller et glisser utilisent alors robocopy quand un chemin réseau est en jeu, à la place de la fenêtre de copie de Windows. La copie rapide montre sa propre progression et le temps restant. Annuler arrête le travail. Elle copie l'arborescence et ne supprime pas les fichiers en trop à la destination. Quand l'option est coupée, la fenêtre de progression de Windows est utilisée.\n\nCtrl+V avec une image dans le presse-papiers, par exemple une capture, enregistre un PNG dans le dossier actuel.\n\nCtrl+Shift+N crée un dossier. F7 le fait aussi. Ctrl+Alt+N crée un fichier. Le nom vient des Paramètres. Un nom vide suit la langue d'affichage.\n\nLe bouton d'échange envoie le dossier sélectionné vers un autre panneau, en gardant les colonnes et l'affichage de celui-ci, ou il copie ou déplace les fichiers sélectionnés, jusqu'à 10 000. Avec un seul panneau, il partage côte à côte et ouvre ce dossier à droite. Sans sélection, il duplique le dossier actuel dans l'autre panneau.\n\nCtrl+Alt+C compare le dossier du panneau actif avec le panneau suivant dans WinMerge. Le menu engrenage et la liste de fichiers peuvent comparer deux fichiers sélectionnés, ou un fichier avec le même nom dans un autre panneau. Indiquez le chemin de WinMerge dans Paramètres, Général.\n\nCtrl+Shift+O rassemble les mêmes noms sélectionnés dans les autres panneaux.
help_body_server_connections = Une connexion serveur est un dossier distant que vous parcourez dans un panneau. Maguro se connecte aux partages SMB, à WebDAV, à SFTP et à FTP.\n\nOuvrez la boîte de connexion et choisissez le type. Saisissez l'adresse, le port, le nom d'utilisateur et le mot de passe. Le mot de passe reste dans les informations d'identification Windows. Il n'est pas écrit dans le fichier de paramètres. Enregistrez la connexion, puis ouvrez-la comme n'importe quel dossier.\n\nSMB utilise un partage Windows. WebDAV peut exiger HTTPS. FTP utilise l'hôte et le port que vous saisissez. SFTP a besoin de rclone et de WinFsp. Si l'un manque, Maguro le dit et peut l'installer avant le démarrage de la connexion.\n\nUn serveur connecté apparaît comme un dossier que vous pouvez ouvrir dans un panneau, copier et prévisualiser. Déconnectez-vous quand vous avez fini. Un partage arrêté n'est pas parcouru pour la taille des dossiers, sauf si les tailles réseau sont activées. Si un dossier réseau ne s'ouvre pas, F5 réessaie.
help_body_shortcuts = Tous les raccourcis Maguro sont listés sous ce texte. La même liste s'ouvre dans une fenêtre courte avec Ctrl+/. F1 ouvre cette aide. Les deux suivent les Paramètres : un raccourci que vous y changez apparaît ici sans redémarrage.\n\nPour changer un raccourci, ouvrez Paramètres, Raccourcis, double-cliquez la ligne et appuyez sur les nouvelles touches. Échap annule cette saisie. Si une autre commande utilise déjà le raccourci, Maguro le dit. Réinitialiser remet le raccourci d'origine.\n\nLes onglets de fenêtre utilisent Ctrl+T, Ctrl+W, Ctrl+Tab, Ctrl+Shift+Tab, Ctrl+Shift+T et Ctrl+Alt+K. Les panneaux se déplacent avec Ctrl+PageDown et Ctrl+PageUp, et Ctrl+1 à Ctrl+9 saute à un panneau. Alt+Gauche revient en arrière, Alt+Haut va au parent, et Ctrl+L, Alt+D ou F4 modifie l'adresse.\n\nF2 renomme, Suppr supprime, et Ctrl+C, Ctrl+X et Ctrl+V copient, coupent et collent. F5 recharge le panneau actif depuis n'importe où dans la fenêtre. F3, et Espace quand cette option est active, ouvre l'aperçu. F6 et Maj+F6 déplacent le focus. Ctrl+, ouvre les Paramètres. Ctrl+N ouvre une fenêtre. Win+Maj+E amène Maguro au premier plan.\n\nLa liste ci-dessous est l'ensemble complet, y compris les actions de la souris : le bouton de disposition, la barre d'adresse, les séparateurs, les en-têtes de panneau et les onglets de panneau.
help_body_settings = Ctrl+, ouvre les Paramètres. La recherche saute à une carte dont le titre ou la description correspond.\n\nGénéral couvre la langue d'affichage, la police, ce qui s'ouvre au démarrage, l'usage de Maguro comme application de dossiers, la disposition par défaut, l'instance unique, la fenêtre unique, le double-clic dans le vide pour le dossier parent, la recherche Everything et WinMerge.\n\nApparence couvre le thème, la couleur d'accent, la barre d'outils, les boutons de lecteur et la barre d'état. Le clair et le sombre gardent chacun leur accent. Suivre Windows bascule avec le système. Après un changement de thème, les listes de dossiers prennent les nouvelles couleurs au prochain démarrage de Maguro. Le reste de la fenêtre se met à jour tout de suite.\n\nPanneaux et affichage couvre l'affichage par défaut d'un nouveau panneau, la mémorisation du tri, des colonnes, de l'affichage et de la taille des icônes par dossier, un affichage par défaut pour les dossiers sans rien d'enregistré, les fichiers masqués, les extensions, la taille des dossiers, la taille des dossiers sur les chemins réseau, le panneau de gauche et lequel des Favoris ou de l'arborescence est en haut, la bordure du panneau actif, l'aperçu avec Espace et la molette de l'aperçu.\n\nOpérations sur les fichiers couvre la fenêtre de copie de Windows, la copie rapide des dossiers réseau, la confirmation de suppression, la suppression par défaut, le nom des nouveaux fichiers et le glisser-déposer par défaut.\n\nFavoris, Raccourcis et Sessions ont chacun leur page. Les fichiers de session vivent dans le dossier de sessions Maguro. Enregistrer en quittant écrit chaque onglet qui a déjà un fichier de session. Le point vert marque un onglet dont la disposition n'est pas encore enregistrée.\n\nAvancé couvre la recherche d'un Maguro plus récent au démarrage, l'emplacement du fichier de paramètres et la réinitialisation. Un fichier portable.txt à côté de maguro.exe garde le fichier de paramètres là, au lieu d'AppData. La réinitialisation rend les préférences par défaut. La disposition, les dossiers et les favoris restent.\n\nLe menu du clic droit liste les éléments tiers que vous pouvez couper. Classique et Windows 11 sont les deux formes. Actualiser relit le menu.
help_body_troubleshooting = Si un dossier ne s'ouvre pas, cliquez ce panneau et appuyez sur F5. F5 recharge le panneau actif depuis n'importe où dans la fenêtre, et réessaie un dossier réseau qui a échoué.\n\nSi une recherche de sous-dossiers ne trouve rien, installez Everything et démarrez-le. Paramètres, Général montre s'il est installé et en cours d'exécution, et peut l'installer ou le démarrer. Maguro interroge Everything seulement pendant que ce programme tourne.\n\nSi une copie vers un dossier réseau est lente ou n'affiche pas la progression Maguro, vérifiez Copie rapide pour les dossiers réseau. Activée, coller et glisser utilisent robocopy et la progression de Maguro, avec Annuler. Coupée, Windows affiche sa propre fenêtre de copie. La copie rapide ne s'exécute pas pour une copie seulement locale.\n\nSi WinMerge ne démarre pas, indiquez son chemin dans Paramètres, Général, ou installez-le. Le panneau doit être un vrai dossier avant une comparaison de dossiers.\n\nSi SFTP ne se connecte pas, installez rclone et WinFsp quand Maguro le demande, puis vérifiez l'hôte, le port, l'utilisateur et le mot de passe. Pour WebDAV, activez HTTPS quand le serveur l'exige. Pour SMB, utilisez le chemin de partage que Windows ouvrirait. FTP utilise l'hôte et le port de la connexion.\n\nSi la couleur de la fenêtre a changé mais pas les listes de dossiers, redémarrez Maguro. Ces listes prennent le thème au démarrage.\n\nSi Maguro s'est fermé tout seul la dernière fois, le démarrage suivant vous le dit, ainsi que l'endroit du rapport. Le rapport est dans le dossier crashes à côté des paramètres. Ouvrez ce dossier depuis la note.\n\nUn second lancement du même maguro.exe se termine tout de suite quand l'instance unique ou la fenêtre unique est active, et la première fenêtre reste. Une mise à jour que Maguro peut installer remplace maguro.exe et redémarre. Quand une version ne contient qu'un zip, Maguro ne l'extrait pas. Remplacez maguro.exe vous-même quand la fenêtre de mise à jour le dit.\n\nFermez Maguro avec le bouton de fermeture de la fenêtre. Cela écrit la session quand l'enregistrement à la sortie est actif.
jump_to_a_folder_in_a_file_dialog = Aller à un dossier dans une boîte de dialogue de fichier
folders_in_open_and_save_dialogs = Dossiers dans les boîtes Ouvrir et Enregistrer
while_another_app_s_open_or_save_dialog_is_in_front = Tant qu'une boîte Ouvrir ou Enregistrer d'une autre application est au premier plan, le raccourci liste les dossiers ouverts ici. En choisir un y ouvre ce dossier. Le raccourci se change sous Raccourcis.
file_in_use = Cet élément est ouvert dans un autre programme
file_in_use_none = Aucun programme n'a été trouvé. Un service Windows ou un programme exécuté en tant qu'administrateur l'utilise peut-être.
file_in_use_holder = {app} — {process} (PID {pid})
file_in_use_partial = Certains programmes n'ont pas pu être listés. L'un d'eux s'exécute peut-être en tant qu'administrateur.
file_in_use_keep = Maguro ne fermera pas {app}.
who_is_using_this_file = Quel programme utilise ce fichier ?
switch_to_program = Afficher le programme
close_program = Fermer le programme
close_program_ask = Demander à {app} de se fermer ?\n\nMaguro le lui demandera. Il ne sera pas forcé à quitter.
