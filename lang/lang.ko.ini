help_explorer = F2, Del, Ctrl+C/X/V, F5\t탐색기와 동일. F5는 창의 어디서나 활성 패널을 새로고침하고, 네트워크 폴더 오류면 그 경로를 다시 시도\nCtrl+V\t복사한 그림(스크린샷, 브라우저 이미지)이 있으면 이 폴더에 PNG 파일로 저장\nSpace\t빠른 미리보기. F3과 같아요. 글자를 입력한 뒤 1초 안의 스페이스나, 한글·일본어 조합 중에는 이름의 일부로 들어가요. 설정 → 패널·보기에서 끌 수 있어요\n\n
help_notes = 주소 칸: 경로의 폴더를 누르면 그리로 이동, › 를 누르면 그 안의 폴더 목록, 현재 폴더·빈 곳을 누르거나 Ctrl+L이면 경로 입력\n레이아웃 버튼: 클릭 = 균등 배치, 누른 채 끌기 = 열마다 칸 수 (방향키+Enter도 가능)\n⇄ 버튼: 선택한 폴더(없으면 현재 폴더)를 다른 패널에서 열기, 열 순서·폭·정렬과 보기도 함께. 또는 선택한 파일을 다른 패널 폴더로 복사·이동 (최대 10,000개). 패널이 하나뿐이면 좌우로 균등하게 나누고(새 패널은 오른쪽) 그 폴더를 거기서 엽니다. 선택이 없으면 현재 폴더를 복제합니다. 파일만 선택된 경우에도 현재 폴더를 복제하며, 파일은 복사·이동하지 않습니다\n저장 (Ctrl+S): 이 탭을 저장 (패널 배치, 폴더, 보기, 색 라벨). 초록 점 = 이 탭의 저장 안 된 배치 변경(폴더 이동은 제외)\n세션 열기: 저장한 탭을 현재 탭 옆에 새 탭으로 엽니다. 여러 개 열기는 고른 세션마다 탭 하나씩\n스플리터 더블클릭: 균등 분할\n패널 머리줄 오른쪽 클릭: 패널 색 라벨 (세션에 저장, 탭 색과는 별개)\n패널 탭: 한 패널 안의 폴더입니다. 창 위쪽 탭과는 다릅니다. 폴더가 하나면 탭 줄이 숨고, ⇄ 오른쪽 버튼으로 탭을 추가합니다(Ctrl+Alt+T). 둘 이상이면 탭 줄이 나옵니다. 기본은 Ctrl+Alt+W / Ctrl+Alt+PageDown / Ctrl+Alt+PageUp 이고, 포커스가 그 패널에 있을 때만 동작합니다. +, ×, 가운데 클릭, 빈 줄 더블클릭도 됩니다\n실행 인자: maguro.exe C:\\a D:\\b ... 또는 maguro.exe 작업.grids\nCtrl+Alt+C는 활성 패널의 폴더를 다음 패널과 WinMerge로 비교합니다. 톱니바퀴 메뉴와 파일 목록에서는 선택한 파일 둘, 또는 다른 패널의 같은 이름과도 비교할 수 있어요. WinMerge 경로는 설정 → 일반에서 지정합니다.\n이미 실행 중이면 그 프로세스에 새 창이 열립니다. 창 하나만 쓰기가 켜져 있으면 그 창을 앞으로 가져오고, 경로는 탭으로 엽니다.\n패널 번호: 끌면 패널을 옮깁니다. Ctrl을 누른 채 끌면 현재 패널 탭을 복사합니다. 가장자리에 놓으면 나누고(자기 가장자리도 가능), 가운데에 놓으면 그 칸의 패널 탭으로 넣습니다. 빨간 미리보기는 한도를 넘긴 것입니다(열 4개, 한 열에 행 4개, 패널 16개). 끄는 중에 Ctrl을 떼면 이동으로 바뀝니다
