help_body_getting_started = Maguro는 Windows용 빠른 멀티 패널 파일 관리자예요. 패널 하나에는 폴더 하나가 열려요. 여러 패널을 나란히 또는 격자로 두면, 다른 프로그램 없이 복사하고 이동하고 비교할 수 있어요.\n\n시작 메뉴나 명령줄에서 Maguro를 실행해요. maguro.exe 뒤에 폴더 경로를 적으면 그 폴더가 열려요. .grids 파일은 저장한 세션을 열어요.\n\n주소 표시줄이 현재 폴더예요. 경로의 이름을 누르면 그곳으로 가요. 갈매기 단추를 누르면 그 안의 폴더가 나와요. 현재 폴더나 빈 곳을 누르거나 Ctrl+L, Alt+D, F4로 경로를 직접 입력해요.\n\n도구 모음에는 레이아웃 단추, 저장, 세션 열기, 즐겨찾기가 있어요. 드라이브 문자는 탭 줄에 둘 수 있어요. 상태 표시줄은 선택한 항목 수와 남은 공간을 보여 줘요.\n\nF1은 이 도움말이에요. Ctrl+/ 는 짧은 단축키 창이에요. Ctrl+, 는 설정이에요. Esc나 닫기 표시는 도움말을 닫고 있던 곳으로 돌아가요.
help_body_panes_tabs = 패널은 폴더 하나예요. 레이아웃 단추는 고른 격자를 만들어요. 누른 채 끌면 열마다 패널이 몇 개인지 정해요. 화살표와 Enter도 돼요. 분할선을 두 번 누르면 균등하게 나뉘고, 끌면 크기가 바뀌어요. 격자는 열 4개, 한 열의 행 4개, 패널 16개에서 멈춰요.\n\n번호나 머리글을 끌어 패널을 옮겨요. 가장자리에 놓으면 그 패널이 나뉘고, 가운데에 놓으면 두 패널이 바뀌어요. Ctrl을 누른 채 끌면 현재 패널 탭을 복사해요. 가장자리는 이 패널을 남기고 나누고, 가운데는 그 칸에 패널 탭을 더해요. 빨간 미리보기는 한도를 넘는다는 뜻이에요. Ctrl을 놓으면 복사가 아니라 이동이에요.\n\n창 탭은 레이아웃 전체예요. Ctrl+T로 열고 Ctrl+W로 닫아요. Ctrl+Tab과 Ctrl+Shift+Tab으로 옮겨요. Ctrl+Shift+T는 닫은 탭을 다시 열어요. Ctrl+Alt+K는 현재 탭을 복제해요. 탭은 패널, 폴더, 보기, 색 라벨을 기억해요.\n\n저장(Ctrl+S)은 이 탭을 써요. 저장 단추의 초록 점은 레이아웃이 아직 저장되지 않았다는 뜻이에요. 파일을 복사한 것과는 달라요. 세션 열기는 저장한 탭을 현재 탭 옆에 열어요. 여러 세션을 열면 각각이 탭이 돼요.\n\n패널 탭은 한 패널 안의 추가 폴더이고 창 탭이 아니에요. 폴더가 하나면 줄이 숨어요. 교환 단추 오른쪽 단추나 Ctrl+Alt+T로 패널 탭을 더해요. Ctrl+Alt+W로 닫아요. 포커스가 패널에 있을 때 Ctrl+Alt+PageDown과 Ctrl+Alt+PageUp으로 바꿔요. 가운데 클릭과 탭의 닫기 표시도 닫아요.\n\nCtrl+N은 다른 창을 열어요. 단일 창 모드면 이 창을 앞으로 가져오고 경로는 탭으로 열어요. 단일 인스턴스면 나중 실행도 이 프로세스 안에 있어요.\n\nCtrl+Shift+M이나 패널 머리글을 두 번 누르면 그 패널이 커져요. 다시 하면 격자로 돌아와요. 머리글을 오른쪽 클릭하면 색 라벨을 정해요. 라벨은 세션과 함께 저장되고 탭 색과는 별개예요.
help_body_favorites = 즐겨찾기와 폴더 트리가 왼쪽 패널을 나눠 써요. 사이의 구분선을 끌어요. 어느 쪽이 위인지는 설정에서 정해요. Ctrl+Shift+E로 패널을 숨기거나 보여요.\n\n즐겨찾기를 누르면 활성 패널에서 열려요. 그룹을 누르면 펼치거나 접어요. 검색은 부모 그룹을 남겨서, 맞는 항목이 어디에 있는지 보여 줘요. 즐겨찾기는 폴더일 수도 파일일 수도 있어요. 폴더가 없으면 빈 경로를 여는 대신 안내를 보여요.\n\n도구 모음의 즐겨찾기 단추는 더 큰 목록을 열어요. 거기서 검색하고, 이름을 바꾸고, 지우고, 활성 패널에서 열 수 있어요. 탐색기 고정 항목도 같은 목록에 나올 수 있어요.\n\n폴더 트리는 디스크예요. Enter나 두 번 클릭하면 그 폴더가 패널에 열려요. Ctrl+클릭이나 가운데 클릭은 패널 탭으로 열 수 있어요.
help_body_file_operations = 복사, 잘라내기, 붙여넣기, 이름 바꾸기, 삭제는 탐색기와 같아요. Ctrl+C는 복사, Ctrl+X는 잘라내기, Ctrl+V는 붙여넣기예요. F2는 이름 바꾸기예요. Del은 Windows 기본이 그럴 때 휴지통으로 보내요. Shift+Del은 완전 삭제예요. 설정에서 Del 전에 물을지, 기본 삭제를 무엇으로 할지를 정해요.\n\n패널에서 패널로 끌어 복사하거나 이동해요. 같은 드라이브는 이동, 다른 드라이브는 복사가 Windows 규칙이고, 설정에서 기본 끌기를 바꿀 수 있어요. 폴더 줄 위에 놓으면 그 폴더 안으로 들어가요.\n\n빠른 복사는 네트워크 폴더용이에요. 설정, 파일 작업에서 켜요. 네트워크 경로가 있으면 붙여넣기와 끌기가 Windows 복사 창 대신 robocopy를 써요. 빠른 복사는 자기 진행과 남은 시간을 보여 줘요. 취소하면 작업이 멈춰요. 트리를 복사하고, 대상에 있는 여분 파일은 지우지 않아요. 끄면 Windows 진행 창을 써요.\n\n클립보드에 그림이 있을 때 Ctrl+V를 누르면, 스크린샷처럼, 현재 폴더에 PNG로 저장해요.\n\nCtrl+Shift+N과 F7은 폴더를 만들어요. Ctrl+Alt+N은 파일을 만들어요. 파일 이름은 설정에서 오고, 비어 있으면 표시 언어를 따라요.\n\n교환 단추는 선택한 폴더를 다른 패널로 보내요. 이 패널의 열과 보기를 유지하거나, 선택한 파일을 최대 10,000개까지 복사하거나 이동해요. 패널이 하나면 좌우로 나누고 오른쪽에 그 폴더를 열어요. 선택이 없으면 현재 폴더를 다른 패널에 복제해요.\n\nCtrl+Alt+C는 활성 패널의 폴더를 다음 패널과 WinMerge로 비교해요. 톱니 메뉴와 파일 목록에서 선택한 파일 둘, 또는 다른 패널의 같은 이름 파일을 비교할 수 있어요. WinMerge 경로는 설정, 일반에서 정해요.\n\nCtrl+Shift+O는 선택한 같은 이름을 다른 패널에 모아요.\n\nCtrl+Shift+B는 파일 바구니를 열어요. 위에 남는 작은 창이에요. 파일이나 폴더를 끌어다 놓거나 Ctrl+Alt+B로 활성 패널의 선택을 담아요. 목록은 원래 경로를 기억해요. 활성 패널로 복사와 이동은 Windows 진행 창을 써요. 밖으로 끌면 복사하고, Shift를 누르면 이동해요. 제거와 비우기는 목록만 바꿔요.
help_body_server_connections = 서버 연결은 패널에서 보는 원격 폴더예요. Maguro는 SMB 공유, WebDAV, SFTP, FTP에 연결해요.\n\n연결 대화상자에서 종류를 고르고 주소, 포트, 사용자 이름, 암호를 입력해요. 암호는 Windows 자격 증명에 두고, 설정 파일에는 쓰지 않아요. 저장한 뒤 다른 폴더처럼 열어요.\n\nSMB는 Windows 공유를 써요. WebDAV는 HTTPS가 필요할 수 있어요. FTP는 입력한 호스트와 포트를 써요. SFTP에는 rclone과 WinFsp가 필요해요. 없으면 Maguro가 알리고, 연결 전에 설치할 수 있어요.\n\n연결된 서버는 패널에서 열고 복사하고 미리 볼 수 있는 폴더로 보여요. 끝나면 연결을 끊어요. 끊긴 공유는 네트워크 폴더 크기를 켜지 않으면 폴더 크기를 세지 않아요. 네트워크 폴더가 안 열리면 F5로 다시 시도해요.
help_body_shortcuts = 이 글 아래에 Maguro의 모든 단축키가 있어요. 같은 목록은 Ctrl+/ 로 짧은 창에서도 열려요. F1은 이 도움말이에요. 둘 다 설정을 따르므로, 바꾼 단축키는 다시 시작하지 않아도 여기 나와요.\n\n단축키를 바꾸려면 설정, 단축키에서 줄을 두 번 누르고 새 키를 눌러요. Esc는 그 입력을 취소해요. 다른 명령이 이미 쓰면 Maguro가 알려요. 원래대로는 처음 단축키로 돌려요.\n\n창 탭은 Ctrl+T, Ctrl+W, Ctrl+Tab, Ctrl+Shift+Tab, Ctrl+Shift+T, Ctrl+Alt+K예요. 패널 이동은 Ctrl+PageDown, Ctrl+PageUp이고 Ctrl+1부터 Ctrl+9는 그 패널로 건너뛰어요. Alt+왼쪽은 뒤로, Alt+위는 부모 폴더, Ctrl+L과 Alt+D와 F4는 주소를 편집해요.\n\nF2는 이름 바꾸기, Del은 삭제, Ctrl+C, Ctrl+X, Ctrl+V는 복사, 잘라내기, 붙여넣기예요. F5는 창 어디서나 활성 패널을 다시 읽어요. F3과, 그 옵션이 켜져 있을 때의 Space는 미리보기예요. F6과 Shift+F6은 포커스를 옮겨요. Ctrl+, 는 설정, Ctrl+N은 창, Win+Shift+E는 Maguro를 앞으로 가져와요.\n\n아래 목록이 전체예요. 레이아웃 단추, 주소 표시줄, 분할선, 패널 머리글, 패널 탭 같은 마우스 동작도 들어 있어요.\n\nCtrl+Alt+1부터 Ctrl+Alt+9는 작업 공간 1–9를 불러와요. Ctrl+Alt+Shift+1부터 Ctrl+Alt+Shift+9는 현재 탭, 패널 배치, 폴더를 그 슬롯에 저장해요. 톱니바퀴 메뉴의 작업 공간에서 슬롯을 저장하고, 불러오고, 이름을 바꾸고, 지울 수 있어요. 빈 슬롯은 짧은 안내를 보여요. 불러오기는 현재 탭을 바꾸며, 확인은 불러오기 전에 확인이 켜져 있을 때만 해요.
help_body_settings = Ctrl+, 는 설정을 열어요. 검색은 제목이나 설명이 맞는 카드로 이동해요.\n\n일반에는 표시 언어, 글꼴, 시작할 때 여는 것, 폴더 앱으로 쓰기, 기본 레이아웃, 단일 인스턴스, 단일 창, 빈 곳 두 번 클릭으로 부모 폴더, Everything 검색, WinMerge가 있어요.\n\n모양에는 테마, 강조 색, 도구 모음, 드라이브 단추, 상태 표시줄이 있어요. 밝은 테마와 어두운 테마는 강조 색을 따로 기억해요. Windows 따르기는 시스템과 같이 바뀌어요. 테마를 바꾼 뒤 폴더 목록의 색은 Maguro를 다음에 시작할 때 적용되고, 나머지 창은 바로 바뀌어요.\n\n패널과 보기에는 새 패널의 기본 보기, 폴더마다 정렬·열·보기·아이콘 크기 기억, 저장된 보기가 없는 폴더의 기본 보기, 숨김 파일, 확장명, 폴더 크기, 네트워크 경로의 폴더 크기, 왼쪽 패널과 즐겨찾기 또는 트리 중 위쪽, 활성 패널 테두리, Space 미리보기, 미리보기 휠이 있어요.\n\n파일 작업에는 Windows 복사 창, 네트워크 폴더의 빠른 복사, 삭제 확인, 기본 삭제, 새 파일 이름, 기본 끌어서 놓기가 있어요.\n\n즐겨찾기, 단축키, 세션은 각각 페이지가 있어요. 세션 파일은 Maguro 세션 폴더에 있어요. 끝날 때 저장은 이미 세션 파일이 있는 탭을 써요. 초록 점은 레이아웃이 아직 저장되지 않은 탭이에요.\n\n고급에는 시작할 때 새 Maguro 확인, 설정 파일 위치, 초기화가 있어요. maguro.exe 옆의 portable.txt는 설정 파일을 AppData 대신 그 옆에 둬요. 초기화는 환경설정을 기본으로 돌리고, 레이아웃과 폴더와 즐겨찾기는 남겨요.\n\n오른쪽 클릭 메뉴는 끌 수 있는 다른 프로그램 항목을 보여요. 클래식과 Windows 11 두 모양이에요. Windows 11 패키지 항목은 꺼진 채로 시작하고, 필요한 것만 켜요. 새로고침은 메뉴를 다시 읽어요.
help_body_troubleshooting = 폴더가 안 열리면 그 패널을 누르고 F5를 눌러요. F5는 창 어디서나 활성 패널을 다시 읽고, 실패한 네트워크 폴더를 다시 시도해요.\n\n하위 폴더 검색이 아무것도 못 찾으면 Everything을 설치하고 실행해요. 설정, 일반에서 설치와 실행 여부를 보고, 설치하거나 시작할 수 있어요. Maguro는 Everything이 실행 중일 때만 물어봐요.\n\n네트워크 폴더로 복사가 느리거나 Maguro 진행이 없으면 네트워크 폴더의 빠른 복사를 확인해요. 켜면 붙여넣기와 끌기가 robocopy와 Maguro 진행을 쓰고 취소할 수 있어요. 끄면 Windows 복사 창이 나와요. 완전히 로컬인 복사에는 빠른 복사가 돌지 않아요.\n\nWinMerge가 시작되지 않으면 설정, 일반에서 경로를 지정하거나 설치해요. 폴더 비교 전에 패널은 실제 폴더여야 해요.\n\nSFTP가 연결되지 않으면 Maguro가 물을 때 rclone과 WinFsp를 설치하고, 호스트, 포트, 사용자, 암호를 확인해요. WebDAV는 서버가 요구하면 HTTPS를 켜요. SMB는 Windows가 여는 공유 경로를 써요. FTP는 연결의 호스트와 포트를 써요.\n\n창 색은 바뀌었는데 폴더 목록이 그대로면 Maguro를 다시 시작해요. 그 목록은 시작할 때 테마를 받아요.\n\n지난번에 Maguro가 스스로 닫혔으면 다음 시작이 알리고, 보고서가 어디에 있는지도 알려요. 보고서는 설정 옆 crashes 폴더에 있어요. 안내에서 그 폴더를 열 수 있어요.\n\n같은 maguro.exe를 다시 실행하면, 단일 인스턴스나 단일 창이 켜져 있을 때 바로 끝나고 첫 창이 남아요. Maguro가 설치할 수 있는 업데이트는 maguro.exe를 바꾸고 다시 시작해요. 릴리스에 zip만 있으면 풀지 않아요. 업데이트 창이 그렇게 말하면 maguro.exe를 직접 바꾸세요.\n\n창의 닫기 단추로 Maguro를 닫아요. 끝날 때 저장이 켜져 있으면 그때 세션을 써요.
jump_to_a_folder_in_a_file_dialog = 파일 대화 상자의 폴더로 이동
